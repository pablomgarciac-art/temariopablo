<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Guía de Estudio — Camarero Limpiador</title>
<style>
:root{--c:#ffd479}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{background:#12141a}
body{font-family:system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif;color:#e8eaf0;max-width:600px;margin:0 auto;padding:0 12px calc(90px + env(safe-area-inset-bottom))}
header{position:sticky;top:0;z-index:5;background:linear-gradient(180deg,#12141a 92%,#12141a00);padding:calc(10px + env(safe-area-inset-top)) 0 10px}
h1{font-size:23px;color:#ffd479;line-height:1.15}
#mSub{display:block;font-size:14px;color:#9aa3b8;font-weight:600;margin-top:3px}
.tabs{display:flex;gap:8px;margin-top:10px}
.tab{flex:1;border:none;border-radius:12px;padding:11px;font-size:14px;font-weight:800;cursor:pointer;background:#232838;color:#9aa3b8}
.tab.on{background:#ffd479;color:#201400}
.bar{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap;align-items:center}
.btn{border:none;border-radius:999px;padding:10px 16px;font-size:13.5px;font-weight:800;cursor:pointer;background:#232838;color:#e8eaf0}
.btn.on{background:#ffd479;color:#201400}
.btn.hue{background:var(--c);color:#10121a}
.back{display:inline-flex;align-items:center;gap:4px;background:#2a3142;border-radius:999px;padding:6px 10px;font-size:12px;color:#dfe4ee;cursor:pointer}
.srch{display:block;width:100%;margin:10px 0 0;background:#232838;color:#e8eaf0;border:2px solid #414a61;border-radius:999px;padding:13px 18px;font-size:16px;font-weight:600;outline:none}
.srch::placeholder{color:#8b93a7}
.status{font-size:12.5px;color:#ffd479;margin-top:7px}
/* ---- portada ---- */
#cover{position:fixed;inset:0;z-index:999;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:30px;background:radial-gradient(1100px 800px at 30% 8%,#2c3b53,#12141a 72%);transition:opacity .45s,visibility .45s}
#cover.hide{opacity:0;visibility:hidden}
.c-emoji{font-size:58px;letter-spacing:10px;margin-bottom:16px}
.c-title{font-size:38px;color:#ffd479;font-weight:900;letter-spacing:.5px;line-height:1.1}
.c-who{font-size:16px;color:#9aa3b8;margin-top:12px;font-weight:600}
.c-by{margin:26px 0;font-size:16px;font-weight:700;color:#e8eaf0;background:#232838;border:1px solid #3a4254;border-radius:999px;padding:10px 28px}
.c-by b{color:#ffd479}
.enter{border:none;background:linear-gradient(90deg,#ffd479,#ffb428);color:#201400;font-size:20px;font-weight:900;border-radius:999px;padding:17px 56px;cursor:pointer;box-shadow:0 10px 30px #ffb42833;letter-spacing:.3px}
.enter:active{transform:scale(.96)}
/* ---- selector de temas ---- */
.pick-note{font-size:13px;color:#9aa3b8;margin:2px 2px 10px}
.grid{display:flex;flex-direction:column;gap:10px}
.th{display:flex;align-items:center;gap:12px;text-align:left;width:100%;background:#1c222e;border:1px solid #2a3142;border-radius:14px;padding:14px;color:#e8eaf0;cursor:pointer}
.th:hover{background:#222937}
.th-num{font-size:13px;font-weight:900;letter-spacing:.5px;color:#fff}
.th-name{font-weight:800;font-size:16px}
.th-sub{font-size:12px;color:#9aa3b8;margin-top:2px}
.th-badge{margin-left:auto;font-size:12px;font-weight:800;background:#2a3142;border-radius:999px;padding:5px 11px;white-space:nowrap}
.th-badge.ok{background:#233c2c;color:#7ce08f}
.th-badge.wait{background:#3a3418;color:#ffd479}
/* ---- estudios ---- */
.sec{margin-bottom:14px;border:1px solid #2a3142;border-radius:16px;overflow:hidden;background:#191e28}
.sec-head{width:100%;display:flex;align-items:center;gap:10px;padding:14px;background:linear-gradient(90deg,var(--c),color-mix(in srgb,var(--c) 55%,#191e28));border:none;color:#fff;font-size:14px;font-weight:800;letter-spacing:.4px;cursor:pointer}
.s-count{margin-left:auto;background:rgba(255,255,255,.22);border-radius:999px;padding:2px 10px;font-size:12px}
.sec .chev{transition:transform .18s}
.sec.open .chev{transform:rotate(180deg)}
.cards{display:none}
.sec.open .cards{display:block}
.card{background:#1f2532;border-left:5px solid var(--c);border-radius:12px;margin:8px;overflow:hidden}
.card.ok{background:#123521;border-left-color:#3ecf6f}
.card.rev{background:#36270f;border-left-color:#ffb428}
.card[hidden]{display:none}
.q{width:100%;display:flex;align-items:center;gap:8px;padding:11px 10px;background:none;border:none;color:#e8eaf0;text-align:left;cursor:pointer}
.qt{font-size:13.5px;font-weight:700;flex:1}
.q .chev{font-size:10px;color:var(--c)}
.a{display:none;padding:2px 12px 10px}
.card.open .a{display:block}
.a p,.a ul,.a ol,.a table{font-size:13.5px;line-height:1.5;margin:8px 0;padding-left:10px;border-left:2px solid color-mix(in srgb,var(--c) 45%,#ffffff00)}
.a ul,.a ol{list-style:none;padding-left:10px}
.a li{margin:5px 0;padding-left:0}
.a b,.bw{color:#ffd479;font-weight:700}
.a em,.a i{font-style:italic;color:#b9c2d6}
.r{color:#ff7b7b;font-weight:700}
.v{color:#7ce08f;font-weight:700}
.h{background:#ffd479;color:#201400;border-radius:4px;padding:0 3px;font-weight:700}
.a td,.a th{font-size:13px;border:1px solid #3a4254;padding:5px 8px;color:#dfe4ee}
.a th{background:#262d3d}
.mark{display:none;gap:8px;padding:0 10px 10px}
.card.open .mark{display:flex}
.mark button{flex:1;border:none;border-radius:9px;padding:9px;font-size:12.5px;font-weight:700;cursor:pointer}
.btn-ok{background:#2e9e55;color:#fff}
.btn-rev{background:#e0912a;color:#fff}
.btn-x{flex:0 0 auto!important;background:#3a4254;color:#aeb6c6}
.card.ok .btn-ok,.card.rev .btn-rev{outline:2px solid #fff}
body.exam .a{display:none!important}
body.exam .card.open .a{display:block}
/* ---- test ---- */
.t-head{display:flex;justify-content:space-between;align-items:center;margin:12px 2px 10px;font-size:13px;color:#ffd479;flex-wrap:wrap;gap:6px}
.t-card{background:#1f2532;border:1px solid #31394a;border-radius:16px;padding:16px}
.t-q{font-size:17px;font-weight:800;line-height:1.4;margin-bottom:14px}
.t-opt{display:block;width:100%;text-align:left;background:#262d3d;border:2px solid #31394a;border-radius:12px;padding:14px;margin-bottom:10px;font-size:15px;line-height:1.4;color:#e8eaf0;cursor:pointer}
.t-opt.ok{background:#16432a;border-color:#3ecf6f}
.t-opt.bad{background:#4a1d1d;border-color:#ff6b6b}
.t-opt:disabled{opacity:1;cursor:default}
.t-expl{margin-top:12px;background:#232a39;border-left:4px solid #ffd479;border-radius:8px;padding:12px 14px;font-size:14px;line-height:1.5}
.t-expl b{color:#ffd479}
.t-next{width:100%;margin-top:12px;background:#ffd479;color:#201400;font-size:15px}
.t-end{background:#1f2532;border:1px solid #31394a;border-radius:16px;padding:18px}
.t-result{font-size:20px;font-weight:800;text-align:center;margin-bottom:12px}
.t-fallos h3{font-size:13px;color:#ff7b7b;margin:12px 0 6px}
.t-fallos p{font-size:12.5px;background:#262d3d;border-radius:8px;padding:8px 10px;margin-bottom:6px}
.t-fallos p b{color:#7ce08f}
.pend{background:#1f2532;border:1px solid #31394a;border-radius:16px;padding:22px;text-align:center}
.pend .e{font-size:40px}
.pend p{color:#9aa3b8;font-size:15px;margin:12px 0 18px;line-height:1.5}
footer{position:fixed;bottom:0;left:0;right:0;text-align:center;padding:10px env(safe-area-inset-bottom) 0;background:#12141aE6;backdrop-filter:blur(6px)}
footer small{font-size:11px;color:#6c768c}
/* ---- responsive escritorio ---- */
@media (min-width:900px){
  body{max-width:1060px;padding:0 26px calc(120px + env(safe-area-inset-bottom))}
  header{padding-top:calc(14px + env(safe-area-inset-top))}
  h1{font-size:30px}
  #mSub{font-size:15px}
  .tab{padding:14px;font-size:15.5px}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .th{padding:18px 20px}
  .th-num{font-size:15px}
  .th-name{font-size:18px}
  .th-sub{font-size:13px}
  .th-badge{font-size:13px;padding:6px 14px}
  .btn{padding:12px 20px;font-size:14.5px}
  .back{padding:8px 12px;font-size:13px}
  .srch{font-size:17px;padding:15px 20px}
  .status{font-size:13.5px}
  .sec-head{padding:16px}
  .a p,.a ul,.a ol,.a table{font-size:14.5px}
  .qt{font-size:15px}
  .card{margin:9px}
  .q{padding:13px 12px}
  .t-q{font-size:20px}
  .t-opt{font-size:16.5px;padding:16px 18px}
  .t-expl{font-size:15px}
  .t-result{font-size:22px}
  .t-end{padding:22px}
  .enter{font-size:22px;padding:19px 64px}
  .c-by{padding:12px 34px}
  .sec.open .cards{display:grid;grid-template-columns:1fr 1fr}
  #tOpts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
}
@media (min-width:1280px){body{max-width:1240px}}
</style>
</head>
<body>
<div id="cover">
  <div class="c-emoji">📚 ✍️ 🎓</div>
  <h1 class="c-title">Guía de Estudio<br>Camarero Limpiador</h1>
  <p class="c-who">10 temas + Convenio<br>Estudia, entrena y aprueba el examen</p>
  <div class="c-by">Hecho por <b>Pablo</b></div>
  <button class="enter" id="cEnter">🎓 Entrar</button>
</div>
<header>
  <h1 id="mTitle">Guía de Estudio</h1>
  <span id="mSub">10 temas + Convenio · prepara tu oposición</span>
  <div class="tabs">
    <button class="tab on" id="tabE">📖 Estudiar</button>
    <button class="tab" id="tabT">📝 Test</button>
  </div>
</header>
<main id="content"></main>
<footer><small>Camarero Limpiador · hecho por Pablo</small></footer>
<script>
const CURR=[{"key": "1", "num": "Tema 1", "name": "El personal de limpieza al servicio de la Junta de Extremadura", "hue": "#d9541e", "sections": [{"t": "Tema 1 · El personal de limpieza al servicio de la Junta de Extremadura", "cards": [{"t": "1 · DEFINICIÓN CAMARERO-LIMPIADOR", "p": "<p>«Realiza todas o algunas de las funciones mecánicas de: limpieza, comedor, lavandería, plancha y análogas.»</p><p>Funciones: limpieza general (incl. deportivas, patios, talleres), preparación y atención de comedores, retirada de bandejas, utensilios/menaje/ropa/almacenes, servicios, cocinas, electrodomésticos, calefacción, fregaderos, office, dormitorio, lavado, costura y plancha.</p>"}, {"t": "2 · SERVIDORES PÚBLICOS", "p": ""}, {"t": "3 · CALIDAD EN LA LIMPIEZA", "p": "<p>Hacer las cosas bien para la satisfacción propia y del residente. La calidad no hace trabajar más lento.</p><p>Profesionalidad + espíritu de servicio + sentido del humor.</p>"}, {"t": "4 · RESPONSABILIDAD", "p": ""}, {"t": "5 · AMABILIDAD", "p": ""}, {"t": "6 · ATENCIÓN PERSONALIZADA", "p": "<p>El cliente no tiene la culpa de nuestros problemas.</p>"}, {"t": "7 · TRATAMIENTO DE QUEJAS", "p": "<p>Si tiene razón: disculparse sin servilismo, resolver de inmediato, no echar culpas, avisar cuando esté resuelto.</p><p>Si no tiene razón: no discutir, serenidad y paciencia, aclarar malentendidos, no triunfalismos; callejón sin salida → superior.</p>"}, {"t": "8 · IMAGEN DE LA ADMINISTRACIÓN / 9 · CIUDADANO-CLIENTE", "p": ""}, {"t": "10 · TÉCNICAS DE COMUNICACIÓN", "p": ""}, {"t": "11 · AYUDAS EN LA COMUNICACIÓN", "p": ""}, {"t": "12 · PARALENGUAJE", "p": "<p>Información adicional e involuntaria de la voz: velocidad, pausas, enunciación, tono, vocalización, volumen. Clave en teléfono.</p>"}, {"t": "13-14 · FALLOS Y MEJORA", "p": "<p>Psicológicas: entendemos lo que queremos, estado emocional, no saber escuchar, defensivos.</p><p>Mecánicas: lenguaje técnico, mala vocalización, mensajes mal elaborados.</p><p>Hablar: ordenar ideas, precisión, lenguaje sencillo, frases simples, sin muletillas, naturalidad.</p><p>Escuchar: atención, feed-back, no pensar la respuesta mientras escuchas, no prejuzgar.</p>"}, {"t": "15 · PERFIL DEL INFORMADOR", "p": ""}, {"t": "16 · HABILIDADES", "p": "<p>Escuchar activamente · resumir · ser positivo y recompensar · mensajes «yo» · acuerdo parcial y disco rayado · empatizar.</p>"}, {"t": "17-18 · ACOGIDA Y RESPUESTA", "p": "<p>Recepción Saludo Presentación A disposición</p><p>Respuesta: explicar (sin tecnicismos), convencer (no coaccionar), negociar (acuerdo mutuo). Etapas: preparación → discusión → oferta/contraoferta → acuerdo/desacuerdo → concretar. · para imprimir (A4 horizontal)</p><p>Todos los trabajadores, sin distinción de categorías.•</p><p>Equipo con objetivos comunes: favorecer el desarrollo personal y colectivo de los asistidos y la convivencia / respeto mutuo. •</p><p>Factor humano: amables, aspecto cuidado y limpio, trato agradable y educado, competentes. •</p><p>Factor técnico: respetar cuadro de frecuencias, métodos y máquinas, organizar y preparar al personal. •</p><p>Prioridades · orden y organización•</p><p>Discreción: «ver, oír y callar»•</p><p>Fiabilidad · positivismo•</p><p>Separar vida profesional y privada · no proyectar tensiones•</p><p>Sí: «por favor»/«gracias», mirar, saludar, puntualidad, disculparse, conversar. •</p><p>No: gritar, sarcasmos, reírse del otro, estallidos emocionales.•</p><p>Interés por su problema, por pequeño que sea.•</p><p>Repetir los aspectos difíciles.•</p><p>Ante la duda, preguntar antes de actuar.•</p><p>Confidencialidad · paciencia.•</p><p>Cliente interno = empleado público atendido por otro; todos lo somos.•</p><p>Cliente externo = consumidor de las atenciones; el más valioso.•</p><p>Ciudadano: persona más importante, escucharle, rapidez y reflexión, datos prácticos, interés y disposición de ayuda. •</p><p>Emisor ←→ receptor; código común; mensaje claro y completo; ritmo/tono adecuado; atención del receptor. •</p><p>Canal: oral, escrito, gestual. Ruido: elemento que entorpece o anula.•</p><p>Escucha activa: clima agradable, oír en sus términos, sin distracciones, resumir, preguntar, tomar notas. •</p><p>Feed-back: informar de cómo hemos entendido; permite aclarar/precisar; depende de la confianza.•</p><p>Reformulación (eco): repetir igual/diferente lo dicho → anima a seguir, conocer necesidades.•</p><p>Parafrasear: decir lo que hemos comprendido (verbal + gestual).•</p><p>Imagen neutra, aspecto cuidado; el vestir es el primer mensaje; entorno limpio y bien acondicionado (espacios de espera). •</p>"}, {"t": "19 · ESCUCHA FÍSICA (CLIENTE ENFADADO) · DOBLE JUEGO", "p": "<p>Primero la persona, después el problema. Primero los sentimientos, después los hechos.</p>"}, {"t": "20 · COMUNICACIÓN NO VERBAL", "p": "<p>Verbal = información y conocimiento. No verbal = sentimientos (ojos, cara, manos, distancia corporal). Expresa, enfatiza, sustituye, orienta la interpretación. Deben complementarse y no contradecirse.</p>"}, {"t": "21 · COMPORTAMIENTOS DEL CIUDADANO", "p": ""}, {"t": "22 · EMPATÍA", "p": "<p>Ponerse en el lugar de la otra persona. Conectar de forma correcta y sincera con sus emociones.</p>"}, {"t": "28 · EFECTO POSITIVIDAD", "p": "<p>Mejora personal y colectiva. Material: celebrar objetivos, formación, premiar calidad. Psíquica: reconocimiento y felicitación de los superiores.</p>"}, {"t": "23 · TIPOS DE PERSONALIDAD (RESUMEN)", "p": "<p>Tipo Tratarlo</p><p>Habladores Encauzar, brevedad, cortesía</p><p>Excitables Autocontrol, calmar, argumentos objetivos</p><p>Tímidos Confianza, ayuda, en reservado</p><p>Irrazonables Firme, impasible, cortos acuerdos</p><p>Inquisitivos Detalles, paciencia, no contradecir</p><p>Presuntuosos Humildad, no competir, adulación</p><p>Silenciosos Tú la iniciativa, ir al grano</p><p>Escépticos Perseverancia, sinceridad, garantías</p><p>Entendidos Prudencia, escuchar, no enfrentarse</p>"}, {"t": "24-26 · COMEDOR", "p": ""}, {"t": "25 · PRÁCTICAS ALIMENTARIAS", "p": ""}, {"t": "27 · CONDUCTAS ALIMENTARIAS PATOLÓGICAS", "p": ""}, {"t": "29 · PERCEPCIÓN Y EXPECTACIÓN", "p": "<p>Mirada directa, sin distracciones•</p><p>Acercarse sin invadir el espacio íntimo•</p><p>Abrir postura (no cruzar brazos/piernas)•</p><p>Ojos 3–7 segundos cada vez•</p><p>Refuerzos: sonrisa, gestos de cabeza, respuestas simples•</p><p>Relajarse durante la escucha•</p><p>Pasivo: no expresa opiniones, baja autoestima → facilitar expresión con preguntas cerradas.•</p><p>Agresivo: manda, intimida → no perder las maneras, interés real por el problema, escucha activa.•</p><p>Pasivo-agresivo: hostil oculto → lograr que exprese emociones; si emerge, tratar como agresivo.•</p><p>Asertivo (ideal): franqueza constructiva, ni abusa ni deja que abusen.•</p><p>La comida es un acto fundamental y signo de comunidad; compartirla = pertenencia; comer solo = soledad. •</p><p>Mesas redondas: incitan a la convivencia y favorecen la relación entre mayores.•</p><p>Comer en grupo = exposición a las miradas (efecto espejo) → posibles conductas de reacción.•</p><p>Dulces/líquidos/lácteos → placer y protección; los primeros en reconocerse; mayores enfermos/deprimidos vuelven a ellos. •</p><p>Salados y texturas sólidas → imposición y desagrado.•</p><p>Anorexia: aversión a la comida / incapacidad de comer o conservar alimento; lo vivido como peligroso. •</p><p>Bulimia: no poder dejar de comer; necesita hartarse.•</p><p>Acumulación: sobre todo en mayores, sin necesidad aparente.•</p><p>Falsa ruta alimentaria: comportamiento accidental que impide casi sistemáticamente la ingestión del bolo. •</p><p>Percepción: seleccionar, organizar e interpretar; importa más lo que se percibe que lo que se ve.•</p><p>Expectación: lo que se cree que debe ocurrir; por referencias externas o experiencias previas.•</p><p>Calidad = lo percibido frente a lo esperado.•</p><p>Percepción global: elementos tangibles (instalaciones, edificio, equipos, personal, impresos) + fiabilidad (servir en las condiciones prometidas). •</p>"}]}], "ncards": 25}, {"key": "2", "num": "Tema 2", "name": "Organización del espacio y del tiempo. Sistemas de limpieza y desinfección", "hue": "#12878c", "sections": [{"t": "Tema 2 · Organización del espacio y del tiempo. Sistemas de limpieza y desinfección", "cards": [{"t": "1 · HIGIENE", "p": "<p>Conjunto de acciones externas sobre un organismo para preservar la salud, prevenir enfermedades y mantener el estado físico óptimo.</p><p>Individual (organismo; limpieza, aseo e imagen personal) y social (salud pública/colectiva). Punto común: LA SALUD. No hay sociedad higiénica sin individuos higiénicos.</p>"}, {"t": "2 · ORGANIZACIÓN DEL TRABAJO", "p": ""}, {"t": "3-4 · TIPOS DE LIMPIEZA", "p": "<p>Diaria (cada 24 h) y rotativa (según suciedad acumulada: ventanales, persianas). Otras: periódica (cristales/aspiradora), mantenimiento (planificación), fin de obra (techo→suelo), especial (no diaria), desinfección.</p><p>Prioridad: Hall/entrada/vestíbulo → aseos → bar- cafetería/restaurante.</p>"}, {"t": "6 · CLASIFICACIÓN DE PRODUCTOS", "p": ""}, {"t": "7-8 · DESINFECCIÓN", "p": "<p>Destrucción de gérmenes patógenos. Continua/recurrente (habitual) y terminal (tras alta de enfermo): airear ≥1 h → vaciar y lavar cubo → material desechable a incineración → ropa de cama sin sacudir → lavar con jabón desinfectante → cambiar cortinas → airear varias horas → ordenar y hacer cama.</p><p>Antes de desinfectar, limpiar siempre. Factores: tiempo de actuación, concentración, gérmenes, condiciones, sensibilidad.</p>"}, {"t": "11-12 · EDIFICIOS PÚBLICOS Y ZONAS", "p": ""}, {"t": "13-14 · FRECUENCIA Y ORDEN", "p": "<p>Factores: frecuencia de uso, tipo de actividad, tipo de suciedad, estado. Pautas: diaria (suelos, papeleras, mobiliario, aseos…) · semanal (papeleras, azulejos) · quincenal (cortinas, puertas) · mensual (radiadores) · trimestral (paredes, techos, lámparas).</p><p>Orden diario: 1 luces → 2 desconectar aire → 3 papeleras → 4 abrir ventanas → 5 polvo mobiliario → 6 paredes/puertas → 7 aspirar alfombras → 8 barrido húmedo → 9 fregar → 10 ordenar.</p>"}, {"t": "15-16 · SISTEMAS Y ZONAS NOBLES", "p": "<p>Limpiar: eliminar suciedad sin dañar. Suciedad: amenaza salud, interfiere actividad, altera estética. Fin de obra: bruto (restos gruesos) + fino (exhaustiva). Mantenimiento: rutinaria (fija) + extraordinaria (imprevista). · A4 horizontal</p><p>Controlado para evitar olvidos → perjuicios a clientes y reclamaciones lícitas •</p><p>Planilla: puntos básicos + tiempo invertido · Parte: zonas no limpiadas → gobernanta •</p><p>Incidencias/averías → avisar rápido al encargado•</p><p>Evitar rutina: actividad fija + alternativa; grupos rotatorios•</p><p>Mecánica: aspiración/arrastre, aglutinación (reunir la suciedad), frotación (abrasivos) •</p><p>Química: jabones y detergentes → rebajan la tensión superficial del agua •</p><p>Bloques: detergentes y jabones · auxiliares (abrillantadores, suavizantes) · otros químicos (limpiahornos, limpiametales) •</p><p>Utilidad: limpieza en seco (champús, desinfectantes, ambientadores) · desmanchado (removedores, desincrustantes, inhib. óxido) · desengrase (desengrasantes, emulsiones) •</p><p>Necesidad: mínimos = agua + detergente + desinfectantes · suplementarios (encerar, impermeabilizar, decapar, quitar cal, antiestáticos…) •</p><p>Jefe de equipo: experto, orden, planillas, nº personas, tiempo; comunica por escrito y verbal •</p><p>Coordinadores: controlan grupos, ayudan en tareas especiales, supervisan retrasos •</p><p>Zonas nobles: uso exclusivo usuarios (privadas / uso común / utilidad vial) · servicio: funcionamiento interno (cocina, office, lavandería, vestuarios) · comunes: exterior (aparcamientos, aceras) •</p><p>Orden: empezar por zonas nobles con más gente y rápido•</p><p>Preparados/pulidos → mopa · mármol → jabón neutro · alicatados → barrer+fregona · áreas extensas → aspiradora •</p><p>Balaustres → alcohol (metal) · mobiliario → bayeta húmeda+seca · baños → desinfectante · restaurantes fuera de horario · jardines con profesional · lejía (previo jabón, después enjuagar) •</p><p>Cocina: máxima higiene · zonas comunes: cepillos, marquesinas, toldos •</p>"}, {"t": "17-18 · AGUA Y DETERGENTES", "p": "<p>El producto básico es el AGUA. Productos químicos no actúan solos: forma, calor y tiempo de contacto.</p><p>Dureza del agua = impurezas/sales. Detergente: modifica propiedades del agua (disminuye tensión superficial).</p><p>Elección según: tipo de suciedad, material, contacto con manos, lavado manual/mecánico, dureza del agua.</p>"}, {"t": "19 · JABONES", "p": "<p>Naturales (grasas animales + huesos + sales alcalinas) a limitar; sintéticos biodegradables. Variedades: duros (sosa: ropa/vajilla) · blanco/negro (potasa: batería cocina) · escamas (ropa delicada) · polvo · sólido (a mano) · manos = desinfectante + dermoprotector.</p>"}, {"t": "20 · LEJÍA (HIPOCLORITO SÓDICO)", "p": ""}, {"t": "21 · CERAS Y OTROS", "p": "<p>Ceras: animales / minerales / sintéticas. Encáusticos (sólidas: disolventes+colorantes) y emulsionados (líquidas: agua+emulsionante+resinas). Vinagre (útil cocina), limón (cobre), limpia inox, limpiador madera (15 cc/l), jabón bactericida.</p>"}, {"t": "22-23 · DETERGENCIA Y CÍRCULO DE SINNER", "p": "<p>3 principios: poder humectante (romper tensión superficial) · dispersión (romper suciedad en partículas) · suspensión (emulsionar para que no se re-adhiera).</p><p>Mecánica 25% Química 25% Tiempo 25% Temperatura 25%</p><p>La química = 3/4 del trabajo en condiciones ideales → mecánica mínima. Sustituir elementos que falten. «El producto químico no hace milagros».</p>"}, {"t": "24 · MÉTODOS DE DESINFECCIÓN", "p": "<p>Físicos: calor/ebullición (no esporas) · pasteurización (30 min a 68 ºC, −4 ºC; pasteurizada sin patógenos vs esterilizada sin gérmenes) · UV (precauciones: >2 m, luz arriba) · filtros de aire · ultrasonido · flujo laminar.</p><p>Químicos (antisépticos): clorhexidina (bucal 0,1%) · povidona yodada (campos operatorios) · cloruros (lejía: 20-40 g/l, ventajas/inconvenientes) · fenol (bactericida, no con lejía/amoniaco, >5% tóxico) · hexaclorofeno (manos).</p>"}, {"t": "25 · ALCOHOLES, ALDEHÍDOS, ETC.", "p": ""}, {"t": "26-29 · POTENCIAS, PH, ELECCIÓN, INCOMPATIBILIDADES, NIVELES", "p": "<p>Desengrasantes-desinfectantes: baja = agua oxigenada, bioalcohol · media = bioalcohol, alcohol, fenol, lejía · alta = aldehídos. Rotar productos contra resistencias; agua <20 ºC. pH: grado de acidez/alcalinidad en agua (sin agua no hay pH). Escala 0-14; 7 neutro (6-8); <7 ácidos; >7 alcalinos.</p><p>Productos: ácidos (clorhídrico, salfuman, cítricos) · alcalinos (sosa, lejía, amoniaco) · neutros (agua) · disolventes (petróleo, gasolina, acetona).</p><p>Elección: dura y lavable + grasa vegetal/proteica → pH>8 · grasa mineral → >10 · cemento/yeso/herrumbre/óxido → 1-2 · textil/piel/calcáreas → 6-8.</p><p>Incompatibilidades: ácidos ↔ hipoclorito sódico · fenoles ↔ lejía · amoniaco ↔ cloro · cloro ↔ alcoholes · vinagre ↔ lejía. Sangre → lejía 0,5-1% (5000-10000 ppm).</p><p>Lejía: barata, rápida, pero corroe metales, inestable, poco remanente, inactiva con materia orgánica. Diluida 35-60 g/l · concentrada 60-100 g/l. 1:10 (9L+1L) alto riesgo · 1:50 (9,8L+200ml) riesgo medio; 15-30 min (mín 10). Agua fría, no mezclar, tapada y a la sombra.</p><p>Niveles: bajo 10 min (bacterias vegetativas) · intermedio 10 min (+hongos/virus/micobacterias) · alto ~20 min, esporas 6-10 h. La lejía NO es de alto nivel.</p><p>Alcalinos: suciedad orgánica (grasas, proteínas); potentes: cera y grasa quemada•</p><p>Ácidos: desincrustantes (calcáreos); alternar con alcalinos reduce microbios•</p><p>Neutros: uso general, superficies lisas con poca suciedad; jabones de manos•</p><p>Abrasivos: ayuda suplementaria; cepillar+enjuagar; dañan superficies lisas•</p><p>No aplicar directa (irritante, corrosiva con metales)•</p><p>Dilución habitual 100-200 mg cloro/l · sin limpieza absoluta: 1000 mg/l•</p><p>Pierde eficacia con materia orgánica, luz, calor y pasados 2 meses•</p><p>Guardar de sol y humedad; enjuagar tras aplicación; no con jabón•</p><p>Caduca; daña químicamente si condiciones inadecuadas•</p><p>Etanol: piel → 70º mejor que 90º; inactivo con materia orgánica•</p><p>Isopropanol: 70%, inflamable•</p><p>Formaldehído: 40 ºC, mínimo 7 h, goma/caucho•</p><p>Glutaraldehído: 2% 30 min desinfecta; 10-12 h esteriliza•</p><p>Óxido de etileno: gas, explosivo/cancerígeno; material que no resiste calor; aireación•</p><p>Agua oxigenada: ropa hospitalaria; >20% corrosivo•</p>"}]}], "ncards": 16}, {"key": "3", "num": "Tema 3", "name": "Utensilios y maquinaria de limpieza", "hue": "#c8901a", "sections": [{"t": "Parte 1 · Utensilios y Maquinaria", "cards": [{"t": "Instrumento vs Aparato", "p": "<ul><li><b>Instrumento:</b> usa la propia energía y esfuerzo físico del profesional.</li><li><b>Aparato:</b> requiere energía eléctrica.</li></ul>"}, {"t": "Instrumentos básicos", "p": "<ul><li>Cepillo, escoba, aspiradora, mopa, <b>barredora de conductor sentado</b>.</li><li>En seco: estropajos, plumeros, bayetas, gamuza, paños.</li><li>Con agua: fregonas, lavavajillas, lavadora, fregadora/secadora.</li><li>Pulidora, abrillantadora, encerador.</li></ul>"}, {"t": "Escoba", "p": "<ul><li>Arrastra objetos y restos orgánicos/inorgánicos; se agrupan con <b>recogedor</b> y a la bolsa.</li><li><b>Mantenimiento:</b> lavar semanal (agua caliente jabonosa), mojar todas las cerdas, frotar suave, aclarar, sacudir, secar <b>cerdas arriba</b> en lugar seco.</li></ul>"}, {"t": "Tipos de escobas", "p": "<ul><li><b>Pequeña:</b> construcción (remojar obra, lechadas).</li><li><b>Escobeta:</b> cepillo para la ropa (cerdas o alambres).</li><li><b>Escobilla:</b> cepillo de cerdas de alambre.</li><li><b>Escobillón:</b> limpia cañones de armas.</li><li><b>Escobón:</b> barrer y deshollinar.</li><li><b>Magnética:</b> polvo por acción electrostática.</li></ul>"}, {"t": "Cepillo · Recogedor", "p": "<ul><li><b>Cepillo:</b> manojos de cerda o fibra en una tabla; quita el polvo.</li><li><b>Recogedor:</b> agua + desinfectante, enjuagar y secar.</li><li>Tipos: de <b>carbón y ceniza</b> (hierro, cocinas/chimeneas); de <b>legumbres</b> (madera o metal, medio cilindro, a granel).</li></ul>"}, {"t": "Paños · Gamuzas · Plumeros", "p": "<ul><li>Retiran el polvo de paredes y mobiliario.</li><li><b>Paños:</b> diario, agua tibia + detergente, aclarar, secar al aire.</li><li><b>Gamuzas:</b> agua + jabón, enjuagar varias veces, sacudir, secar <b>extendidas en sombra</b>.</li></ul>"}, {"t": "Bayetas (3 tipos)", "p": "<ul><li><b>Tejida:</b> humedecer previamente; reutilizable.</li><li><b>Preimpregnadas:</b> de usar y tirar, costosas; UCI, quirófanos... (zona de atención especial).</li><li><b>No tejida de celulosa:</b> buena absorción, no se deshilacha, cualquier producto; reutilizable al menos una vez más.</li></ul>"}, {"t": "Esponjas (sintéticas)", "p": "<ul><li><b>Químicas:</b> celulosa regenerada + plásticos; limpieza de vajilla.</li><li><b>Plásticas:</b> duras y suaves, tricotado en bola; no rayan ni atacan el esmalte; cacerolas y hornos.</li><li><b>Mantenimiento:</b> agua tibia + detergente, aclarar, escurrir, secar.</li></ul>"}, {"t": "Mopa con flecos · Mopa", "p": "<ul><li>Función de escoba y fregona con poca agua; exige superficie <b>decapada y sellada</b>.</li><li>Mango de <b>aluminio fijo o articulado</b> + funda/flecos sobre base metálica; funda de quita y pon, lavable.</li><li><b>Mopa:</b> superficies lisas y limpieza continuada.</li></ul>"}, {"t": "Microfibras", "p": "<ul><li><b>Efecto imán:</b> absorción muy superior; sustituye a la fregona.</li><li>Mopa y bayetas limpias <b>por cada habitación</b> de pacientes: barrera higiénica.</li><li>Medio seco y húmedo; reduce el esfuerzo (ergonomía).</li><li>Elimina el barrido y reduce <b>hasta el 66% del tiempo de fregado</b>.</li></ul>"}, {"t": "Fiselina", "p": "<ul><li>No-tejido spunbond de <b>polipropileno</b> (velo termo-soldado).</li><li>Alta resistencia mecánica y química; estable; resiste abrasión.</li><li>Sin pelusa/hilachas; se contrae a 110 ºC, funde a 130 ºC; baja flamabilidad.</li><li>No tóxico, no alérgico; permeable e impermeable al agua.</li></ul>"}, {"t": "Fregona", "p": "<ul><li>Mango + soporte con <b>tiras de algodón</b> (planas o enrolladas).</li><li><b>Desinfección:</b> sumergir en desinfectante <b>3–4 horas</b>, aclarar y escurrir.</li><li><b>Normal:</b> lavar cuando se vea sucia (agua tibia + detergente), aclarar, escurrir.</li></ul>"}, {"t": "Cepillos duros · Escobas especiales", "p": "<ul><li><b>Duros:</b> desincrustan suciedad fijada al suelo.</li><li><b>Aplicadoras:</b> emulsión fina y uniforme.</li><li><b>Escobillas de goma:</b> desalojar agua.</li><li><b>Rozantes:</b> abrasivos en base; esquinas y rincones.</li></ul>"}, {"t": "Estropajos y lanas de acero", "p": "<ul><li>Fibra vegetal, más fuertes que las esponjas; corta duración.</li><li>Estropajo de <b>aluminio</b>: cuidado al limpiar acero (raya).</li><li>Función: raspar elementos adheridos.</li></ul>"}, {"t": "Gamuza · Plumero", "p": "<ul><li><b>Gamuza:</b> tejido/paño de lana; se rocía con producto; limpieza agua y jabón, secar <b>vertical en sombra</b>.</li><li><b>Plumero:</b> atado de plumas en palo torneado; <b>quita polvo</b> para cuadros, lámparas, adornos.</li></ul>"}, {"t": "Cubo", "p": "<ul><li>Con/sin escurridor; sencillo; <b>doble</b>: una cubeta con detergente y otra con desinfectante.</li></ul>"}, {"t": "Carro de limpieza", "p": "<ul><li>Estructura móvil con ruedas y compartimentos; transporte del equipo.</li><li><b>Diario:</b> limpiar polvo, cestas y compartimentos (desinfectar y secar), lavar cubos y recipientes.</li><li><b>Mensual:</b> ruedas revisadas y engrasadas.</li><li>Modalidades: <b>sencillos</b> o <b>con accesorios</b> (mopa, bandejas, bolsas, escurridor, cubos).</li></ul>"}, {"t": "Carro doble cubo (sistema)", "p": "<ul><li>Ágil, ruedas giratorias + frenado; superficies lisas; 3 paños de distintas alturas.</li><li>Bandeja con <b>2 cubetas de distinto color</b> (3–5 L) + barra; bandeja mínima de <b>15 cm</b> (baño / mobiliario).</li><li><b>Doble cubo azul-rojo</b> con escurridor o prensa; 2 cubos pequeños azul y rojo.</li><li>Material: mopas, fiselina, gamuzas, bayetas azul/rojo, estropajos, escobillas, fregonas, bolsas, papel higiénico/jabón, desinfectante, detergente, desincrustante.</li><li>Diario: mopas, carro, cubos y escurridor. Periódico: engrasar ruedas, engranajes y prensa.</li></ul>"}, {"t": "Carro de servicio", "p": "<ul><li>Estantería de 4 ruedas con bolsas laterales para <b>ropa sucia</b>; hostelería y hospitales.</li></ul>"}, {"t": "Papel de celulosa", "p": "<ul><li>Sustituye a los paños; papel reciclado; reforzable con fibras sintéticas/resinas; absorbente y suave para superficies delicadas.</li></ul>"}, {"t": "Rasca-vidrios · Achicador · Limpiacristales", "p": "<ul><li><b>Rasca-vidrios:</b> hoja de metal; raspa suciedad pegada.</li><li><b>Achicador:</b> lámina doble de goma y esponja; absorbe agua.</li><li><b>Limpiacristales:</b> lámina de goma con empuñadura.</li></ul>"}, {"t": "Monocepillo", "p": "<ul><li>Aparato eléctrico; frota cepillo o disco contra el suelo. Opciones: depósito líquido, espuma, aspiración.</li><li>Apoyar la máquina contra sí; cepillo gira <b>en contra de las agujas del reloj</b> (movimiento lateral sin esfuerzo).</li><li>Cepillos por uso; discos para decapar/pulir/lustrar.</li><li>Mantenimiento: desinfectar cepillos en <b>alcohol</b>, <b>inyectar desinfectante</b> en conductos, revisar filtros.</li></ul>"}, {"t": "Aspiradoras", "p": "<ul><li><b>De polvo:</b> en seco.</li><li><b>Mixtas:</b> polvo y líquido cambiando un filtro; retirar y secar el depósito.</li><li><b>Alta velocidad (>300 rpm):</b> superficies vitrificadas, selladas o enceradas: mucho brillo y resistencia.</li></ul>"}, {"t": "Barredoras · Aspirantes · Autolavadoras", "p": "<ul><li><b>Barredoras:</b> grandes superficies, todo tipo de residuos; conductor sentado o de empuje.</li><li><b>Cepillos aspirantes:</b> cepillado + aspiración; limpiar y sustituir cepillos.</li><li><b>Autolavadoras:</b> cepillado, lavado y aspirado; superficies abiertas.</li><li><b>Detergente espumoso:</b> moquetas; limpiar depósito y cepillos, tubos sin obstruir.</li></ul>"}, {"t": "Presión · Vapor · Enceradoras", "p": "<ul><li><b>Alta presión:</b> agua a presión; a veces con vapor.</li><li><b>Vapor:</b> desprende suciedad adherida; se retira con bayeta.</li><li><b>Enceradoras rodillo</b> (2–6 cepillos): parquets, <b>en dirección de la madera</b>.</li><li><b>Enceradoras platillo</b> (1–3 cepillos planos): todos los suelos.</li><li>Limpieza cepillos: bencina 10–15 min y al aire, o agua caliente + sosa (hasta 24 h de secado).</li></ul>"}, {"t": "Pulidora · Abrillantadora · Lijadora · Vaporosa", "p": "<ul><li><b>Pulidora:</b> corrige y pule con pequeña capa de barniz.</li><li><b>Abrillantadora:</b> saca brillo.</li><li><b>Lijadora:</b> lijar madera (discos, cilindros o correas de lija).</li><li><b>Vaporosa:</b> vapor a alta temperatura; máxima capacidad limpiadora; ecológica.</li></ul>"}, {"t": "EPIs", "p": "<ul><li>Ropa cómoda: batas, guardapolvos, buzos.</li><li><b>Guantes</b> con cáusticos/corrosivos o cortes.</li><li><b>Cinturón de seguridad o arnés</b> en altura.</li><li><b>Mascarilla</b> con polvo/contaminantes.</li><li><b>Gafas o pantalla facial</b> ante salpicaduras.</li><li>Calzado que sujete el pie y limpio.</li><li>Tapones/orejeras con ruido alto.</li><li>Ropa de abrigo y alta visibilidad en exteriores nocturnos.</li></ul>"}, {"t": "Guantes · Normas", "p": "<ul><li>Limpios, no estériles, ante riesgo de contacto con sangre/fluidos/secreciones y antes de tocar mucosas o piel no intacta.</li><li>Higiene de manos <b>antes y después</b> de colocarlos.</li><li><b>No sustituyen la higiene de manos.</b></li><li>Retirar tras el uso, antes de tocar superficies no contaminadas y antes de otro paciente.</li></ul>"}, {"t": "Mascarillas, ocular y bata", "p": "<ul><li>Mascarilla quirúrgica/gafas/careta: mucosas ante aerosoles y salpicaduras.</li><li><b>Bata:</b> limpia, manga larga, no estéril; si se mancha, cambiar inmediatamente + higiene de manos.</li></ul>"}]}, {"t": "Parte 2 · Limpieza de los Suelos", "cards": [{"t": "Clasificación por dureza", "p": "<ul><li><b>DUROS:</b> resistentes al desgaste; admiten agua y hasta los productos más corrosivos. Piedras naturales (mármol, granito, pizarra, travertino); artificiales (terrazos, azulejos, porcelana, mosaico, baldosas); arcillosos (ladrillo, gres, florentino); arcilloso pulido (cerámica, gres esmaltado, baldosas esmaltadas); cemento (lavado o blindado).</li><li><b>MEDIOS:</b> madera y corcho; sellado previo (cera líquida, cera en pasta o barniz de vitrificación). Madera blanda y resinosa (abeto, pino), dura (encina, haya), extradura (panga-panga, wenge). Corcho: desmenuzado y comprimido. Mantenimiento: paño humedecido.</li><li><b>BLANDOS:</b> confortables, pierden resistencia y se ensucian más (porosos); aislantes. Textiles: animal (lana), vegetal (algodón, coco, yute), química (acetato...), sintética (PVC, nilón...), mixtos; mojar poco, productos neutros. Resistentes: linóleo, termoplásticos, vinílicos-amianto, goma/Rubcor/Tartán (admiten humedad; salvo disolventes petrolíferos).</li></ul>"}, {"t": "Según el tipo de material", "p": "<ul><li><b>POROSOS:</b> mármol, terrazo, travertino, baldosas de arcilla, cemento, hormigón, madera/corcho. Duros y fríos; la suciedad se incrusta → tratamiento de base. Madera: aislante; enemigo nº 1 = <b>el agua</b>.</li><li><b>HOMOGÉNEOS:</b> poco peso. <b>Linóleo</b>: bacteriostático (hospitales), pH ≤ 10. <b>PVC</b>: resistente, sensible a anilina y quemaduras. <b>Goma</b>: sensible a solventes, alcalinos y a la luz (decolora); nunca solventes. <b>Duros homogéneos</b>: granito, gres, plaquetas, azulejos.</li><li><b>TEXTILES:</b> alfombras y moquetas. 3 tipos: lana con pelo, sintética con pelo, sintética sin pelo (Taiposom). Colocación: pegadas (sintéticas), tensadas (lana), sueltas.</li></ul>"}, {"t": "Mantenimiento de moquetas", "p": "<ul><li>Aspirar a diario, cepillar con regularidad, quitar manchas sin demora, champú \"dilatándolo\" lo más posible.</li><li><b>NTP 52 (INSHT):</b> la moqueta emite <b>COV</b> (contaminantes que se acumulan en la atmósfera).</li></ul>"}, {"t": "Características de los suelos", "p": "<ul><li><b>Seguridad (fundamental), resistencia, facilidad de mantenimiento.</b></li><li>Humedad y polvo facilitan <b>deslizamientos</b>; el <b>brillo NO influye</b> en el deslizamiento.</li></ul>"}, {"t": "La suciedad", "p": "<ul><li>Formas: <b>objetos</b>, <b>partículas</b>, <b>manchas</b> y <b>microbios</b> (requieren desinfectantes).</li></ul>"}, {"t": "Barrido y fregado", "p": "<ul><li><b>Barrido en seco:</b> suciedad poco adherida, manual o mecánico (aspirador).</li><li><b>Barrido húmedo:</b> con la menor cantidad de agua (mopa, gasas).</li><li><b>Fregado manual:</b> DÚO-MOP + producto.</li><li><b>Fregado mecánico:</b> máquina fregadora + discos PAD.</li></ul>"}, {"t": "Tratamiento base", "p": "<ul><li>Fregado mecánico profundo + producto que forma <b>pantalla</b> entre suciedad y suelo (brillante, homogéneo, impermeable).</li><li>Requisitos: aplicar fácilmente, eliminación con decapante, <b>autobrillante y antideslizante</b>.</li></ul>"}, {"t": "Fregado a fondo · Decapado", "p": "<ul><li>2 personas: fregadora (depósito + decapante + plato arrastre + disco negro/marrón/verde) y aspiradora de agua con boquilla de mano.</li><li>Procedimiento: extender, dejar actuar, <b>mín. 3 pasadas</b>, aspirar, aclarar con neutralizante. Bordes: <b>rascador de bordes</b> + estropajo marrón/negro.</li><li>Suciedad general → detergente <b>alcalino</b> + <b>vinagre</b> en el aclarado (neutraliza). Suciedad mineral → detergente <b>ácido</b> + <b>bicarbonato</b>.</li><li><b>Decapado:</b> levantar viejas ceras/emulsiones (alcalino o decapante); suelo bien neutralizado.</li></ul>"}, {"t": "Cristalización (piedras calcáreas)", "p": "<ul><li>Solo mármol, terrazo, travertino. Máquina rotativa + <b>lana de acero</b> (más fina en mármol) + producto con <b>fluosilicatos</b> o ceras.</li><li>Zonas de <b>9 m²</b>; pulverizar y pasar la máquina hasta secar y brillar; zócalos de <b>derecha a izquierda</b>.</li><li>Salpicaduras: solo en seco y con alambre. No insistir tras conseguir brillo. Vida: <b>1 mes a 1 año</b>.</li></ul>"}, {"t": "Aplicación de emulsiones", "p": "<ul><li>Suelo fregado, neutralizado, aclarado, secado; capas <b>finas</b> y <b>secar entre capas</b>. 1.ª capa a <b>un palmo</b> del zócalo; 2.ª a <b>medio palmo</b>; 3.ª <b>todo</b>.</li><li><b>Con mopa:</b> algodón usado, emulsión pura, escurrir sin que gotee, secar entre capas; limpiar el material (no dejar duro).</li><li><b>Con aplicador:</b> palo con pinza + piel sintética + espuma; charcos pequeños; óvalos alargados; 2.ª capa <b>cruzando el sentido</b>; no presionar; remojar el material.</li><li><b>Conservación:</b> semibrillantable = barrido húmedo + <b>spray diario</b> (con operario); autobrillante lavable = barrido húmedo + fregado con mopa y <b>detergente neutro</b>.</li></ul>"}, {"t": "Suelos de centros hospitalarios", "p": "<ul><li>Eliminar <b>totalmente el barrido en seco</b>; una gasa por habitación/dependencia.</li><li>Doble cubo en zonas de <b>alto riesgo</b>; cubo sencillo en menor riesgo.</li><li><b>Código de colores:</b> azul = en seco mobiliario · roja = sanitarios · verde = zonas nobles · blanca = zonas especiales · amarilla = húmeda mobiliario.</li><li>Bolsas <b>rojas</b> = basura séptica (contenedor especial); <b>negras</b> = resto. Cuidar la galga. Servicios: escrupulosos cada día.</li></ul>"}, {"t": "Tres sistemas de limpieza", "p": "<ul><li>Barrido húmedo · Fregado con mopa · Método spray.</li><li>Requieren <b>adiestramiento previo</b> (mín. media hora antes del puesto).</li></ul>"}, {"t": "Barrido húmedo · Mopsec", "p": "<ul><li>Objeto: eliminar el polvo <b>sin remover el aire</b>. Soporte trapezoidal + gasa de <b>nilón expansionadas</b> (lavable, resistente a desinfección).</li><li>Var. flecos de algodón con <b>capta-polvo 10 min antes</b> (menor riesgo); gasa sin tejer humedecida (medio/menor riesgo).</li><li>Suelo liso y tratado → <b>soporte barrido húmedo</b>; suelos rugosos y con tierra → <b>mopsec</b> (trapecio + gasa humedecida tipo Vileda; capta-polvo 10 min). Tamaños según el local (55 cm pasillo aeropuerto vs 1,50 m hab. enfermo).</li><li><b>Conclusión:</b> el barrido en seco es <b>irracional</b> (eleva el polvo, lento, dolores de espalda); el húmedo, bien usado, elimina el polvo y evita fatiga.</li></ul>"}, {"t": "Fregado con mopa", "p": "<ul><li>Diario con <b>detergente desinfectante</b>; doble cubo en alto/medio riesgo, cubo sencillo en el resto.</li><li>Equipo: carro con cubo azul y rojo de <b>14 L</b>, prensa, cubo de aluminio con pinza, fleco (algodón o sintético).</li><li><b>Opciones de cubos:</b> A) azul agua+detergente+desinfectante / rojo agua · B) azul agua+desinfectante / rojo agua+detergente · C) ambos agua+detergente+desinfectante.</li><li><b>Técnica:</b> pasillos por mitades señalizando; habitaciones desde <b>rincones a la puerta</b>, interior a exterior, <b>zonas menos sucias primero</b>; habitaciones: 2 cubetas 3-5 L (azul limpia/roja sucia), vaciar inmediatamente la de bayetas del baño.</li><li><b>Procedimiento:</b> cubo azul = 9 L agua + desinfectante; cubo rojo = 3 L (sucio/aclarar), prensa encima; mopa en azul → exprimir sobre rojo → fregar → enjuagar en rojo → exprimir en prensa → sumergir en azul → escurrir jabón superfluo y seguir; cambiar agua al vaciar azul/llenar rojo.</li></ul>"}, {"t": "Método spray", "p": "<ul><li>Abrillantadora ≥ <b>35 gr/cm²</b> + disco + producto. Discos de nilón/poliéster; agresividad por <b>color</b> (más claro = menos abrasivo, salvo Spontex); <b>no pasar de 60 ºC</b> (encoje).</li><li>4 funciones: extender, ayudar a la acción química, recuperar suciedad disuelta, abrillantar.</li><li>Emulsión vaporizada con detergentes + solventes + ceras. Ideales: máquinas de alta velocidad.</li><li><b>Spray cleaner:</b> superficies de emulsiones acrílicas/ceras; quita <b>rayas negras de tacones</b>; + brillo.</li><li><b>UHS (ultravelocidad):</b> regenera arañazos sobre emulsión acrílica o cera (producto + máquina super alta velocidad + disco).</li><li><b>Impermeabilizado:</b> cierre de la porosidad con capa impermeable.</li></ul>"}, {"t": "Productos de limpieza", "p": "<ul><li>Misión: eliminar suciedad y manchas + proporcionar brillo o desinfección.</li><li><b>Detergentes:</b> tensoactivos (bajan la tensión superficial; <b>amonios cuaternarios</b> = bactericidas); conservación (<b>neutros pH 6-8</b>, poca espuma); amoniacados (disuelven grasa, atacan la emulsión protectora); decapantes (eliminan emulsiones, <b>aclarar</b> después); solventes (manchas de grasa); espumosos (textiles).</li><li><b>Emulsiones de protección:</b> acuosas de ceras y polímeros, uso <b>puro</b>; forman capa protectora con brillo. Pulibles (ricas en ceras, hay que pulir); no pulibles (ricas en polímeros, brillan solas pero <b>se rayan</b>; proteger con metalizadas); pulibles a medias.</li><li><b>Mixtos:</b> tensoactivos + solventes + ceras; puros, pulverizados sobre revestimientos duros.</li></ul>"}, {"t": "Cristalización y vitrificación", "p": "<ul><li><b>Cristalización:</b> mármol, marmolina, terrazos, calizas duras; máquina + cristalizadores + disco de lana de acero → película de alto brillo.</li><li><b>Vitrificación:</b> revestimientos de mármol; <b>polvos vitrificadores</b> esparcidos en seco + máquina → película vitrificadora.</li></ul>"}, {"t": "Tratamiento de manchas en suelos", "p": "<table><tr><th>Mancha</th><th>Tratamiento</th></tr><tr><td>Alquitrán</td><td>Hielo seco / cubos sobre plástico; raspar</td></tr><tr><td>Café</td><td>Agua+glicerina a partes iguales; agua caliente, frotar en seco</td></tr><tr><td>Cera</td><td>Raspar; papel secante + plancha caliente</td></tr><tr><td>Grasa/aceite</td><td>Pasta de tiza+amilacetato+acetona; dejar secar y raspar</td></tr><tr><td>Orín</td><td>Oxalato de potasa (<b>venenoso</b>)+agua caliente</td></tr><tr><td>Sangre</td><td>Reciente: agua fría. Vieja: agua oxigenada / malta-diatasa</td></tr><tr><td>Tinta</td><td>Alcohol o oxalato de potasa (<b>venenoso</b>); lavar con agua</td></tr><tr><td>Yodo</td><td>Amoniaco</td></tr></table><ul><li><b>Anti-polvo sobre cemento:</b> resinas/pinturas que penetran los poros; cepillo o rodillo; secar horas; varios colores.</li></ul>"}, {"t": "Madera y corcho", "p": "<ul><li><b>Cera líquida:</b> spray, <b>inflamable</b>, diaria. <b>Cera en pasta:</b> en caliente (funde en poros), más duradera, no diaria. <b>Barniz de vitrificación:</b> resina+endurecedor (se unen al usarse), película brillante y muy dura.</li><li><b>Conservación:</b> barrido húmedo con disolución específica; spray con máquina y disco; cera caliente/líquida periódica + abrillantado.</li><li><b>Precauciones:</b> parquet sin sellar → <b>nunca agua</b>/detergentes/emulsiones; parquet pegado antiguo → no ceras líquidas ni disolventes; entarimado no agua; corcho: solo sellar losetas no enceradas; gimnasios: no encerar, sellar; no emulsiones de cera autobrillantes.</li></ul>"}, {"t": "Partes de un suelo", "p": "<ul><li><b>Armazón:</b> vigas/viguetas (madera o prefabricadas) y cuerpos huecos de cerámica/hormigón unidos por hormigón armado.</li><li><b>Revestimiento:</b> parquet, plástico, mármol, terrazo, etc.</li></ul>"}, {"t": "Mármol · Gres", "p": "<ul><li><b>Mármol:</b> sencillos / veteados / arborescentes / lumaquelas (fosilíferos). Cualidades: pulido, incombustible, no retiene polvo, lavable. Defectos: <b>se raya</b> (sin abrasivos) y es <b>atacado por ácidos</b>, amoniaco, jabón de potasa y alcohol. Rayas de zapatos en claros: frotar con bastante cera.</li><li><b>Gres:</b> arcilla natural. Positivo: resistente a desgaste/aplastamiento/choque, impermeable, higiénico, resistente a ácidos/alcalinos/grasas/hidrocarburos. Negativo: frialdad, sonoro, deslizante. Limpieza: agua+jabón o detergente y lejía. Juntas ennegrecidas: <b>blanco de España</b>.</li></ul>"}, {"t": "Suelos de madera", "p": "<ul><li>Chopo, pino, abeto, castaño, roble; <b>no en cocina ni aseos</b>. Parquet = \"conjunto de maderas ensambladas\" (barniz o cera).</li><li><b>Barnizada:</b> diario bayetas de lana; semanal bayeta húmeda muy escurrida; agua/cera en cantidades pequeñísimas.</li><li><b>Encerada:</b> fregar una vez al año con <b>aguarrás</b>; cera de pavimento + máquina enceradora; olor fuerte.</li><li>Manchas: grasa/cera de vela = gasolina o aguarrás; vino = estropajo aluminio fino; tinta reciente = agua y papel secante; tinta antigua = leche cruda.</li></ul>"}, {"t": "Linóleo y plásticos", "p": "<ul><li><b>Linóleo:</b> sin ruido, resiste el uso, aislante, impermeable al agua y grasas, lavable, decorativo, higiénico; <b>se raya</b> y se despega por junturas. Limpieza: agua templada + jabón; evitar infiltración → <b>bayeta húmeda diaria</b>; encerar y pulir para que se ensucie menos.</li><li><b>Plásticos:</b> fácil con detergente + agua clara; terminar con productos emulsionados.</li></ul>"}, {"t": "Moquetas", "p": "<ul><li>Aspirador relativamente potente; el polvillo daña las fibras; los vahos consolidan partículas; manchas orgánicas → microorganismos.</li><li><b>Nueva:</b> NO aspirador ni champú; barrer a favor del pelo o barredora mecánica a máxima altura; penachos enrasados con tijeras.</li><li>Diario barredora (vaivén); aspirador 2-3 veces/semana (última pasada a favor del pelo); <b>champú 2 veces/año</b> (la tarde anterior, secar toda la noche, aspirar al día siguiente).</li></ul>"}, {"t": "UPEC y Etiqueta T", "p": "<ul><li><b>UPEC</b> (0-4, más valor = más resistente): <b>U</b> desgaste mecánico · <b>P</b> punzamiento · <b>E</b> agua/humedad · <b>C</b> agentes químicos.</li><li>Tránsito: al menos <b>U3 P3</b>. Salas/dormitorios: <b>U2 P2</b>. Baño y cocina: <b>mínimo U2 P2 E2 C1</b>.</li><li><b>Etiqueta T (ICCO):</b> T2 dormitorios · T3 salones/despachos · T4 vestíbulos/zona de juego/silla de ruedas · T5 mucho tránsito (escaleras, descansillos, halls).</li><li><b>Scotchgard:</b> tratamiento anti-manchas, invisible e inodoro; reduce la adhesión del polvo y retarda la penetración de líquidos.</li></ul>"}, {"t": "Fichas de mantenimiento", "p": "<ul><li><b>Linóleo:</b> detergente disuelto 80 veces su volumen; jabón suave + agua templada; diario bayeta húmeda.</li><li><b>Mosaico:</b> agua y jabón en pasta.</li><li><b>Granito:</b> no mojar (se oscurece), puliéndolo se evita; escoba de palma; cepillo de raíces + detergente.</li><li><b>Goma y plástico:</b> fregar con fregona seca (evita empapar juntas).</li><li><b>Terrazo:</b> NO ácidos/lejía/vinagre/limón (manchan); agua + detergente con fregona o mopa.</li></ul>"}, {"t": "Otros tratamientos", "p": "<ul><li><b>Diamantado:</b> suelos viejos sin brillo; rebajar la capa superficial <b>con diamantes</b> (mármol, terrazo, granito); después <b>cristalizar</b>.</li><li><b>Film:</b> recubrimiento plástico protector e impermeabilizante; se aplica con <b>rotativa</b>.</li></ul>"}]}, {"t": "Parte 3 · Limpieza en Planta Noble", "cards": [{"t": "Equipo de planta noble", "p": "<ul><li>Empieza <b>a la hora más temprana posible</b>, al comenzar la jornada.</li><li>Horario establecido por la <b>gobernanta</b>.</li><li>Razón: momento en que los departamentos están <b>desalojados de afluencia</b> de personal.</li></ul>"}, {"t": "La entrada", "p": "<ul><li>Inmediaciones del <b>acceso principal</b>.</li><li><b>Barrido:</b> que el polvo no se introduzca ni se extienda a dependencias adyacentes.</li><li><b>Fregado:</b> hilos de algodón = más superficie por pasada; <b>cambiar el agua con frecuencia</b>; agente limpiador eficaz; <b>carrito</b> para evitar acarreo excesivo de agua.</li></ul>"}, {"t": "El vestíbulo", "p": "<ul><li>Amplia sala de entrada; <b>recepción y conserjería</b>.</li><li>Áreas públicas: limpieza por <b>sistemas secos</b> (suelos tratados, aspecto brillante).</li><li>Operaciones: <b>barrido → fregado en seco → aspiración → aspiración y pulido</b>.</li></ul>"}, {"t": "Escaleras", "p": "<ul><li>Comienzan en el vestíbulo; subida y bajada a plantas superiores.</li><li><b>Alfombrada → aspiradora</b>; si no, procedimiento normal.</li><li>Después: <b>balaustre, pasamanos y barandilla</b> — limpieza <b>diaria</b>.</li><li>Metal dorado → <b>sidol</b>; madera → <b>quitar el polvo</b>.</li></ul>"}, {"t": "Salones", "p": "<ul><li>Atención distinta por la <b>decoración</b> y el <b>material del suelo</b> (madera, mármol o nobles).</li><li>Terminado el suelo: limpiar accesorios — <b>muebles, metales, lámparas, cristales, verjas</b>.</li></ul>"}, {"t": "Mesas, escritorios, tocadores", "p": "<ul><li>Limpiar: tablero, laterales, frente, atrás, patas, travesaños, interior de cajones y listones.</li><li>En habitación de salida: <b>cajones y armarios primero</b> (dentro y fuera).</li><li>Cajones forrados en <b>papel blanco satinado</b> (mesillas, mesas, armarios).</li></ul>"}, {"t": "Armarios", "p": "<ul><li>Primero <b>interior</b> (cajones, estanterías, barras, perchas), luego <b>exterior</b>.</li><li>Sensación de nuevo: sin arañazos dentro ni manchas de líquidos.</li><li>Perchas de un lado (o mitad a cada lado), <b>ganchos hacia dentro</b>; todas iguales; <b>nunca <6 por persona</b>.</li><li>Colocar <b>manta y almohada de reserva con funda limpia</b>; manta desdoblada (posible uso sucio).</li></ul>"}, {"t": "Puertas y bisagras", "p": "<ul><li><b>Puertas:</b> dentro y fuera con <b>bayeta húmeda</b> + desmanchador, o jabón <b>sin abrasivos</b> (dañan pintura).</li><li><b>Bisagras:</b> con <b>limpiacristales</b>; restos de pintura → <b>palo húmedo y polvos de piedra pómez</b>.</li></ul>"}, {"t": "Enfermería", "p": "<ul><li>Diferenciar áreas: habitaciones, zonas comunes, consulta, laboratorio, almacenes, baños.</li><li><b>No mezclar</b> productos de limpieza con productos sanitarios.</li><li><b>Ropa exclusiva</b> (batas, monos, pijamas) + <b>guantes de goma impermeables</b>; <b>mascarillas</b> (lejía).</li><li>Basuras: bolsas plástico/papel <b>especiales</b>, más grandes y gruesas; <b>pinchazos</b> (jeringuillas); <b>contenedores rígidos con tapaderas</b> no abribles por el público; <b>esterilizar antes</b> de recogida municipal; retirada <b>mín. mañana y tarde</b>.</li><li>Decoración <b>sencilla</b> (sin cuadros que dificulten).</li><li><b>Conclusión:</b> limpieza <b>profunda, diaria y cuidada</b> para preservar la salud.</li></ul>"}, {"t": "Zócalos", "p": "<ul><li>Cuidado de <b>no rozar</b> al limpiar el suelo (máquina, bayetas).</li><li>La mayor parte del polvo está en el borde más horizontal.</li><li>Habitualmente <b>plumero</b>; muy de tarde en tarde un <b>pincel</b>.</li></ul>"}, {"t": "Paredes", "p": "<ul><li><b>Yeso:</b> no en húmedas (aseos/baños/cocina); <b>plumero fino</b>, no mojar; escobón con paño limpio.</li><li><b>Azulejo y gres:</b> agua, jabón o detergente y <b>lejía</b>; frotar en seco para brillo.</li><li><b>Mármol:</b> plumero + paño de lana (periódico); extraordinario (2-3 veces/año): agua caliente + bayeta de lana; o <b>cera virgen</b> + paño de lana.</li><li><b>Piedra porosa:</b> no mojar en diario; grasa → <b>agua + ácido muriático</b>.</li><li><b>Ladrillo:</b> plumero diario; manchas como la piedra.</li><li><b>Madera:</b> barnizada → producto especial; sin barnizar → trapo con <b>aguarrás + cera</b>, bayeta de lana.</li></ul>"}, {"t": "Cristales y ventanas", "p": "<ul><li>Diario: cristal y marco; trapo frotando señales/huellas.</li><li><b>Alcohol o limpiacristales</b>; el <b>amoniaco NO es adecuado</b> (se evapora rápido, hay que secar mucho).</li><li>No transparentes → <b>agua jabonosa</b> y aclarar.</li><li>Trapos <b>blancos sin pelusa</b>.</li><li><b>3 paños:</b> quitar polvo → limpiar tras pulverizar → <b>gamuza</b> para abrillantar.</li><li>No limpiar con <b>sol reflejado</b>; siempre <b>de arriba hacia abajo</b>.</li><li>Pintura → raspar + <b>esencia de trementina</b>; insectos → <b>alcohol de quemar</b>.</li></ul>"}, {"t": "Cristaleras y ventanales", "p": "<ul><li>Cepillos con <b>tubos enlazados</b>; pulverizar con <b>agua y alcohol a partes iguales</b>.</li><li>Esponja suave de fibra; paño seco en marcos; <b>goma limpiacristales</b> desde ángulo superior, presionando y hacia abajo (tramos).</li><li>Limpiar <b>raíles, canales o molduras</b> (acumulan polvo exterior).</li><li><b>Opacos:</b><b>1 L agua + vaso pequeño de salfumán</b>; o papel de periódico (brillo, sin sombra).</li><li><b>Grandes ventanas:</b> mango largo articulado; <b>esponja + labio de goma</b>; retirar jabón con la goma.</li><li><b>Granulados:</b> limpiacristales + <b>cepillo de la ropa</b>; paño limpio.</li><li><b>Cocina con grasa:</b> alcohol de quemar + amoniaco, estropajo; si no, <b>cuchilla de afeitar</b> sin rayar.</li></ul>"}, {"t": "Bombillas y tubos", "p": "<ul><li>Apagar luz y esperar <b>fríos</b>; trapo seco; mezcla <b>agua+amoniaco</b> o agua + alcohol de quemar (a partes iguales); secar, volver a colocar y esperar a que enfríe.</li><li><b>Halógenas: NO se limpian</b> (se funden al tocarlas).</li></ul>"}, {"t": "Bronce", "p": "<ul><li><b>Muy sucio:</b> petróleo + agua templada jabonosa; secar al aire sin sol.</li><li><b>Medio:</b> 1/3 agua + 1/3 amoniaco + 1/3 vinagre.</li><li><b>Ligero:</b> agua tibia jabonosa + gotas de alcohol de quemar.</li></ul>"}, {"t": "Cobre", "p": "<ul><li>General: <b>vinagre de vino + sal gorda</b> o <b>zumo de limón + sal + ceniza de tabaco</b>.</li><li>Muy sucio: agua tibia jabonosa + cucharillas de alcohol de quemar.</li><li><b>Pequeños muy sucios:</b> hervir <b>vinagre con sal gorda</b>, sumergir cubierto, apagar, enfriar sumergido, secar, abrillantar con <b>cera de silicona</b>.</li><li><b>Grandes:</b> solución de amoniaco + pasta <b>vinagre, sal y harina</b> a partes iguales.</li><li>Corrosión: <b>leche, vinagre o limón con sal</b>; aclarar y secar.</li><li><b>Baterías:</b> vinagre hirviendo + <b>puñado de sal gorda por 2 L</b>; introducir, apagar, enfriar, extraer y secar frotando enérgicamente.</li></ul>"}, {"t": "Pantallas de lámparas", "p": "<ul><li><b>Cristal/plástico:</b> agua + detergente lavavajillas.</li><li><b>Tela:</b> cepillar.</li><li><b>Papel:</b> plumero.</li><li><b>Papel metálico:</b> parafina + aguarrás, paño seco.</li><li><b>Pergamino:</b> vinagre + agua.</li><li><b>Seda:</b> quitar polvo.</li><li><b>Acrílicas:</b> paño antiestático; se electrizan, <b>no frotar</b>.</li></ul>"}, {"t": "Latón · Hierro", "p": "<ul><li><b>Latón barnizado:</b> sin atención especial; agua con detergente.</li><li><b>Latón viejo:</b> no abrillantar; paño húmedo.</li><li><b>Sucio:</b> solución de amoniaco o frotar con limón y sal / vinagre, sal, harina / vinagre, limón, sal.</li><li><b>Hierro:</b><b>NUNCA agua</b> (oxida); algodón con <b>aguarrás</b>; pintado → producto que no ataque pintura y secar bien; óxido → <b>estropajo de alambre en parafina</b> + capa de <b>cera líquida</b>.</li></ul>"}, {"t": "Cuadros y marcos", "p": "<ul><li><b>Con cristal:</b> marco con limpiacristales.</li><li><b>Al óleo:</b> plumero; <b>nunca mojar ni productos</b>; evitar contacto con la pintura.</li><li><b>Marcos:</b> madera → como los muebles; bronce → <b>cebolla cortada</b>, luego trapo húmedo; dorados → <b>trapito mojado</b> y dejar secar.</li></ul>"}]}], "ncards": 75}, {"key": "4", "num": "Tema 4", "name": "Limpieza de oficinas y despachos y limpieza de habitaciones", "hue": "#3f6fd6", "sections": [{"t": "Parte 1 · Limpieza de Habitaciones", "cards": [{"t": "Aspectos generales", "p": "<ul><li>Habitaciones <b>MIXTAS</b>: espacio de la cama + <b>aseo</b>.</li><li><b>Cama:</b> al menos <b>90 cm de ancho</b> y <b>2,15 m de largo</b>; fuerte y robusta; ruedas <b>no pequeñas, antiestáticas y anti-pelusa</b>; frenos de fácil manejo; limpieza fácil y <b>esterilizable</b>; topes con <b>protección de goma</b>.</li></ul>"}, {"t": "Elementos de la cama", "p": "<ul><li><b>Somier:</b> planos y movimientos — <b>elevación dorsal, flexión de piernas, tren anti-tren, elevación de pies</b>. Forma de mando: <b>manual, semimanual hidráulica o motor eléctrico</b>.</li><li><b>Cabecero:</b> de <b>fácil abatimiento</b>; permite acceso a la cabeza y <b>maniobras de reanimación</b>.</li><li><b>Accesorios:</b> barandillas, incorporadores, goteros y arcos balcánicos; <b>solo si son necesarios</b>.</li><li><b>Mesillas:</b> con cajón; sobre ellas el <b>teléfono</b>. <b>Mesa de cama:</b> con pies para las comidas.</li><li><b>Armario con cerradura:</b> ideal <b>empotrado</b>; ropa y objetos de poco valor. <b>Cubo o papelera.</b></li><li><b>Equipamiento:</b> según plan; <b>un sillón por usuario</b>.</li></ul>"}, {"t": "Aseo", "p": "<ul><li><b>Ducha:</b> a ras del suelo (acceso en silla de ruedas); suelo antideslizante; <b>asiento plegable</b> (de pie o transferencia); controles en la pared <b>frente al asiento</b>; puertas o cortinas.</li><li><b>Manguera:</b> al menos <b>1,53 m</b>; algunos usuarios hasta <b>1,83 m</b>.</li><li><b>Repisa:</b> amplia de una sola pieza (jabón, champú); latón, plástico o acero inoxidable.</li><li><b>Espejo:</b> bajo; parte inferior <b>≤ 1 metro</b> del suelo.</li><li><b>Lavamanos:</b> a <b>86 cm</b> (silla de ruedas, de pie y niños).</li></ul>"}, {"t": "Hab. desocupada", "p": "<ol><li>Polvo de muebles, lámparas, apliques, manecillas y pomos (palos especiales)</li><li>Baño: interruptores, lámparas, espejo, toallero, tubos bajo el sumidero</li><li><b>Barrido húmedo</b> con mopas especiales</li><li>Techos y paredes: cepillo + <b>paño limpio atado</b></li><li>Revisar cortinas (interior/exterior ventanas), lámparas</li><li><b>Fregar suelos</b> con detergente-desinfectante <b>desde la parte opuesta a la entrada</b></li></ol>"}, {"t": "Hab. ocupada", "p": "<ul><li><b>1)</b> Vaciar papeleras. <b>2)</b> Polvo con bayeta + detergente-desinfectante. <b>3)</b> Baño (interruptores, lámparas, espejo, toallero, sumidero). <b>4)</b> Vaciar y limpiar estanterías.</li><li><b>5)</b><b>Desinfectar taza del wáter</b>: cepillo con energía el interior; exterior y asiento. <b>6)</b> Fregar habitación y baño. <b>7)</b> Quitar manchas de paredes y puertas. <b>8)</b> Techos y cortinas. <b>9)</b> Colocar muebles. <b>10)</b> Reponer papel, toallas y jabón.</li></ul>"}, {"t": "Tras desocupar el usuario", "p": "<ul><li>Igual que la ocupada: <b>1)</b> vaciar papeleras, <b>2)</b> polvo con bayeta húmeda, <b>3)</b> limpiar <b>cama y muebles</b> (dar la <b>vuelta al colchón</b>; armario, mesilla, estanterías, teléfonos), <b>4)</b><b>abrillantar</b> muebles y metales (paño + líquido, frotar para brillo), <b>5)</b> baño, <b>6)</b> desinfectar wáter, <b>7)</b> barrido húmedo, <b>8)</b> techos y paredes, <b>9)</b> revisar toda la habitación, <b>10)</b> reponer, <b>11)</b><b>comunicarlo a enfermería y a la gobernanta</b> para volver a ocuparla.</li></ul>"}, {"t": "Orden de limpieza", "p": "<ul><li><b>ARRIBA → ABAJO</b></li><li><b>DENTRO → FUERA</b></li><li><b>ZONA MÁS LIMPIA → MÁS SUCIA</b> o contaminada</li></ul>"}, {"t": "Piezas de lencería", "p": "<ul><li><b>Cubierta de colchón:</b> funda <b>impermeable</b> contra la humedad.</li><li><b>Sábanas:</b> bajera y encimera. La <b>entremetida</b> va entre la <b>pelvis y el hule</b> (menor que la bajera); sirve para <b>proteger</b> y para <b>desplazar al usuario</b> hacia la cabecera (2 personas).</li><li><b>Hule impermeable:</b> entre bajera y entremetida; protege; plástico = incomodidad; puede sustituirse por <b>pañales de celulosa</b>.</li><li><b>Mantas:</b> lana (más caliente y ligera), color claro, <b>nunca en contacto con la piel</b>.</li><li><b>Colcha:</b> cubre la manta; generalmente blanca.</li><li><b>Funda de almohadas:</b> cambiar <b>al menos diariamente</b> y cada vez que se necesite.</li><li><b>Frazada:</b> manta gruesa y peluda, mucho calor; se echa sobre la cama.</li></ul>"}, {"t": "Orden en la cama", "p": "<ul><li><b>1</b> Colchón y su funda · <b>2</b> Bajera · <b>3</b> Hule · <b>4</b> Entremetida · <b>5</b> Encimera · <b>6</b> Manta · <b>7</b> Colcha · <b>8</b> Almohada y su funda</li></ul>"}, {"t": "Cómo se dobla", "p": "<ul><li><b>Bajera</b> → a lo <b>largo</b>, <b>derecho hacia adentro</b>.</li><li><b>Encimera</b> → a lo <b>ancho</b>, <b>revés hacia adentro</b>.</li><li><b>Entremetida y hule</b> → a lo <b>ancho</b>, derecho hacia adentro.</li><li><b>Manta y colcha</b> → a lo <b>ancho</b>, derecho hacia adentro.</li></ul>"}, {"t": "Sábana bajera", "p": "<ol><li>Ropa sobre el <b>sillón</b> del usuario</li><li>Colcha: doblar parte superior al centro, igual el borde inferior, retirar; si no se vuelve a usar, a la bolsa <b>sin airearla</b></li><li>Manta y sábana superior igual que la colcha</li><li>Entremetida: coger por el <b>centro de los bordes superior e inferior</b></li><li>Bajera: mismo procedimiento que la entremetida</li><li><b>Lavarse las manos</b></li><li>Extender <b>sin pliegues ni arrugas</b> (úlceras por presión); esquinas en <b>mitra, inglete o pico</b>; remeter los lados</li></ol>"}, {"t": "Esquina de mitra/inglete", "p": "<ul><li><b>1)</b> Remeter la sábana en la zona de la esquina · <b>2)</b> Levantar la sábana → <b>triángulo</b> · <b>3)</b> Bajar la parte superior del triángulo · <b>4)</b> Remeter la parte que queda <b>debajo del colchón</b></li></ul>"}, {"t": "Colocación demás piezas", "p": "<ul><li><b>Hule</b> transversal en el centro; borde superior a <b>30-37 cm</b> de la cabecera; lados remetidos.</li><li><b>Entremetida</b> encima cubriéndolo <b>completamente</b>.</li><li><b>Encimera</b> de cabecera a pies; <b>cama cerrada</b> = mitras + laterales remetidos; <b>cama abierta</b> = solo esquina en mitra.</li><li><b>Pliegue a los pies</b> (o aflojar) para mover los pies.</li><li><b>Manta</b> con mitras y pliegue; borde superior a <b>15 cm</b> del cabecero.</li><li><b>Colcha:</b> el pliegue superior <b>2,5 cm</b> más allá de la manta; borde superior remetido bajo la manta; igual en los laterales.</li><li><b>Embozo</b> de la sábana superior sobre la colcha ≈ <b>15 cm</b>.</li><li><b>Funda de almohada.</b> Cama asignada → doblar ropa de arriba hacia un lado/centro.</li><li>Eliminar la bolsa de ropa sucia según política. <b>Lavarse las manos / cambiar guantes</b> (evitar microorganismos).</li></ul>"}]}, {"t": "Parte 2 · Limpieza de Oficinas", "cards": [{"t": "Dependencias administrativas", "p": "<ul><li>Dos categorías: <b>PURAS</b> (edificios de uso administrativo) y <b>zonas administrativas en edificios destinados a otros fines</b>.</li><li>Muchas mesas, máquinas de escribir, <b>ordenadores</b>, archivadores y armarios.</li><li>Menos labores pero ejecución difícil: <b>papeles no deben traspapelarse ni destruirse</b> (responsabilidad patrimonial de la Administración).</li><li>Limpieza diaria de la <b>ofimática</b> = su mantenimiento. Material específico (ordenadores, fotocopiadoras) → <b>técnica más esmerada</b>.</li></ul>"}, {"t": "Material necesario", "p": "<ul><li><b>Carro de limpieza</b> con bolsa de basura.</li><li><b>Tres bayetas</b>: muebles lavables · no lavables · ceniceros.</li><li><b>Estropajos, guantes, productos:</b> detergente neutro/multiusos en pulverizador y producto <b>capta-polvo</b>.</li><li><b>Dos cubos pequeños</b> para aclarar bayetas.</li><li><b>Dos mop-sec</b>: 55 cm entre muebles / 75 cm-1 m pasillos.</li><li><b>Recogedor y escoba</b>; <b>carro mopa</b> para fregar.</li></ul>"}, {"t": "Limpieza de despachos (1 vez/día)", "p": "<ul><li><b>1)</b> Comprobar luces (funcionamiento y apagadas al final) · <b>2)</b> Desconectar aire acondicionado · <b>3)</b> Vaciar papeleras · <b>4)</b> Abrir ventanas <b>con puertas cerradas</b> (sin corrientes) · <b>5)</b> Polvo del alfeizar · <b>6)</b> Polvo a los muebles · <b>7)</b> Repasar puertas y paredes · <b>8)</b> Aspirar alfombras · <b>9)</b> Fregar con <b>doble cubo</b> · <b>10)</b> Todo en su sitio y en orden.</li><li><b>Techos:</b> tapar <b>siempre</b> ordenadores y aparatos eléctricos (se estropean con la humedad).</li></ul>"}, {"t": "No lavable (madera)", "p": "<ul><li>Bayeta de <b>microfibra o gamuza</b> + <b>atrapa-polvo 10 min antes</b> (elimina el polvo por completo).</li><li><b>Procedimiento:</b> guantes → pulverizar atrapa-polvo → doblado de bayeta. Si no se pliega bien → <b>sombras</b> y repetir.</li></ul>"}, {"t": "Lavable", "p": "<ul><li>Agua + <b>detergente neutro</b> + bayeta (a veces estropajo); aclarar la bayeta las veces necesarias.</li><li><b>Procedimiento:</b> guantes → añadir solución al agua → mojar → escurrir → doblar → recoger la mancha. Sin plegado la mancha <b>se extiende</b>.</li></ul>"}, {"t": "Al limpiar un mueble", "p": "<ul><li>Polvo empezando por los <b>más altos</b>, de <b>arriba hacia abajo</b>.</li><li><b>Doblar la bayeta</b> → <b>16 caras</b> limpias; usar ambos lados y una cara limpia al llenarse.</li><li>Objetos <b>pesados</b> que no rayen → deslizar; <b>ligeros</b> → levantar y volver a colocar.</li></ul>"}, {"t": "Archivos · Sillas · Puertas", "p": "<ul><li><b>Archivos:</b> como mobiliario lavable; <b>cuidado al abrirlos</b> (pueden caer). Estanterías metálicas: <b>secar</b> (no coja humedad el material).</li><li><b>Sillas de cuero:</b> bayeta atrapa-polvo + capta-polvo 10 min; <b>crema incolora 4 veces/año</b> + brillo.</li><li><b>Sillas tapizadas:</b> aspirar <b>quincenal</b>; manchas con <b>espuma seca</b>; patas/ruedas con bayeta + <b>detergente multiusos</b> (barro, betún).</li><li><b>Puertas:</b> lavables → bayeta + detergente neutro; no lavables → atrapa-polvo 10 min antes.</li></ul>"}, {"t": "Frecuencias", "p": "<ul><li><b>DIARIA:</b> polvo mobiliario, material informático, vaciado y limpieza de papeleras, <b>baños a fondo</b>, recogida de basuras.</li><li><b>SEMANAL:</b> vaciado de polvo de radiadores, polvo de <b>puertas y marcos</b>.</li><li><b>MENSUAL:</b> limpieza <b>a fondo del mobiliario</b>.</li><li><b>TRIMESTRAL:</b> limpieza a fondo del <b>material informático</b>.</li></ul>"}, {"t": "Acondicionamiento del centro", "p": "<ul><li><b>Entorno:</b> afluencia de personal; zonas de producción vs tránsito; índice de ocupación (máquinas, muebles); servicios accesorios (papel, toallas); muebles fijos o móviles; servicio dentro o fuera de la jornada; edificio diseñado para su uso; nuevo o antiguo. Todo influye en la <b>organización</b> y la <b>calidad</b>.</li><li><b>Con personas presentes:</b> las operaciones no deben ser fuente de riesgo ni para nosotros ni para terceros; en los momentos, forma y medios adecuados. Dos aspectos: <b>SEGURIDAD</b> y <b>IMAGEN</b> (calidad del servicio).</li></ul>"}, {"t": "Pautas de comportamiento", "p": "<ul><li><b>1)</b> Limpiar periódicamente y siempre que sea necesario (condiciones higiénicas). <b>2)</b> El lugar del personal de limpieza ordenado: utensilios en carros, cada elemento en su sitio. <b>3)</b> Vías y salidas (evacuación) <b>libres de obstáculos</b>; carros y cubos sin interferir los pasos. <b>4)</b> Método más adecuado para cada situación. <b>5)</b> Tras fregar → cartel <b>«suelo mojado»</b>. <b>6)</b> Si se derrama líquido, recoger y limpiar <b>rápidamente</b>. <b>7)</b> Zonas de acceso restringido (servicios públicos): comprobar que no hay personas.</li><li><b>Perturbación:</b> si olores/ruidos/restricciones pueden impedir la actividad → <b>coordinar los trabajos</b> con precauciones para no molestar.</li></ul>"}, {"t": "Hoja de registro", "p": "<ul><li>Control de <b>frecuencias</b> para no olvidar nada y obtener resultados óptimos.</li><li><b>Mesas (D):</b> bayeta de polvo + atrapa-polvo; bayeta y detergente neutro. <b>Sillas (D):</b> bayeta, detergente neutro, aspirador. <b>Material informático (D, apagado):</b> bayeta, detergente neutro, <b>alcohol 70º</b>. <b>Teléfonos (D):</b> bayeta + detergente neutro. <b>Archivadores (S)</b> y <b>Puertas (S):</b> bayeta + detergente neutro. <b>Espejos, azulejos, paredes, puertas (M):</b> limpiacristales, mojador, rastrillo o bayeta + detergente neutro.</li></ul>"}, {"t": "Aceros de puertas y ascensores", "p": "<ul><li>Los sprays aceitosos fijan <b>huellas</b> y forman <b>capas de suciedad grasa</b>.</li><li><b>Material:</b> cubo con <b>agua caliente</b> + trozo de <b>jabón natural</b>; bayeta suave y bayeta de secado.</li><li><b>Procedimiento:</b> disolver jabón en el agua → limpiar con la bayeta <b>de un lado a otro, nunca en círculos</b> (o de abajo a arriba) → secar igual.</li><li><b>8-10 días</b> hasta eliminar los restos inadecuados; después <b>mantenimiento:</b> pulverizar detergente neutro → frotar sin círculos → secar → aclarar la bayeta. Herramientas: <b>mojador y rastrillo</b>.</li></ul>"}, {"t": "Ordenadores · normas", "p": "<ul><li><b>Solo apagados y desconectados</b>; bayeta de <b>tela sin tejer</b> con <b>detergente neutro</b>.</li><li><b>NO son nuestro trabajo:</b> ranuras USB, accesos e interior → personal especializado.</li><li><b>Pantallas:</b> apagado; productos <b>antiestáticos</b> (transparente como cristal, intervalos mayores).</li><li><b>Pantalla LCD (TFT):</b> celulosa suave ligeramente humedecida en <b>agua</b>.</li><li><b>Carcasas (torres e impresoras):</b> tela sin tejer + <b>detergente multiusos</b> (o neutro de espuma controlada).</li><li><b>Teclados:</b> apagados y desconectados → <b>sacudir</b> suavemente → limpiar con bayeta + neutro → secar; cepillo de cerdas semirrígidas para lo pegado.</li></ul>"}, {"t": "Fax · Teléfonos · Fotocopiadora", "p": "<ul><li><b>Fax</b> (moderno): apagado y desconectado; tela sin tejer + detergente neutro; secar. <b>Fax</b> (antiguo): <b>plumero</b>; limpieza mayor con <b>alcohol</b> o alcohol+agua; <b>evitar que gotee</b> por las ranuras.</li><li><b>Teléfonos:</b> atención al <b>micrófono</b> (germenes). Carcasa: paño + detergente neutro. Micrófono: <b>semanal</b> con desinfectante o <b>alcohol 70º</b>.</li><li><b>Fotocopiadora:</b> exterior con bayeta humedecida; cristal con paño/bayeta <b>secos</b> (sin grapas u objetos que rayen); interior → profesional.</li></ul>"}, {"t": "Máquina escribir · Impresora", "p": "<ul><li><b>Máquina de escribir:</b> mantener mesa limpia y teclas sin polvo; interior → profesional; teclas sucias: bayeta con <b>agua con alcohol o solo alcohol</b>.</li><li><b>Impresora:</b> evitar que el <b>polvo se acumule</b>; al <b>cambiar el cartucho</b> limpiar con trapo ligeramente humedecido (exterior); interior con paño <b>seco sin pelusa</b>; <b>cepillo</b> para el espejo interno; <b>NO amoniaco</b>; no tocar el <b>rodillo de transferencia</b> (grasa de la piel → mala calidad de impresión).</li></ul>"}, {"t": "Sala de estar", "p": "<ul><li>Lugares de mucho tránsito: <b>1-2 veces al día</b>.</li><li><b>1)</b> Vaciar papeleras · <b>2)</b> Abrir ventanas sin corrientes · <b>3)</b> Polvo del alfeizar · <b>4)</b> Polvo a los muebles · <b>5)</b> Repasar puertas, paredes e <b>interruptores</b> · <b>6)</b> Barrer en húmedo · <b>7)</b> Fregar con <b>doble cubo</b> · <b>8)</b> Todo colocado y en orden.</li><li>Techos, paredes y ventanas: periodicidad fijada; puertas/paredes a menudo <b>diarias</b>.</li></ul>"}, {"t": "Limpieza de mobiliario", "p": "<ul><li><b>Lavable:</b> agua + detergente neutro + bayeta que se pueda mojar (a veces estropajo); aclarar la bayeta las veces necesarias.</li><li><b>No lavable:</b> bayeta de polvo + producto <b>capta-polvo</b>.</li><li><b>Procedimiento:</b> plegar la bayeta (reemplazar la parte usada; tratada) → polvo de los más altos, arriba a abajo → volver a plegar al llenarse → mover objetos (pesados deslizar, ligeros levantar) → seguir en orden sin volver a sitios limpios → <b>guardar el material</b> una vez limpio (salvo continuar en otro lugar).</li></ul>"}, {"t": "Laboratorios", "p": "<ul><li><b>1)</b> Vaciar papeleras · <b>2)</b> Encimeras y fregaderos con detergente neutro o <b>desinfectante</b> · <b>3)</b> Mobiliario con tela sin tejer + neutro o trapo con capta-polvo · <b>4)</b> Recoger desperdicios y barrido húmedo · <b>5)</b> Fregar zócalos y suelo con fregona industrial, <b>desde la zona más alejada de la puerta</b>, cuidando las esquinas · <b>6)</b> Cuando el suelo esté seco: cerrar ventanas, apagar luces, cerrar con llave.</li><li><b>Seguridad:</b> puerta sin bloquear (salida de urgencia); <b>vidrio roto</b> en contenedores especiales; ropa: guantes, calzado cerrado antideslizante, <b>manga larga</b>.</li><li><b>No levantar polvo:</b> partes elevadas con bayeta húmeda; barrido con mopa + <b>capta-polvo</b>.</li></ul>"}]}], "ncards": 31}, {"key": "5", "num": "Tema 5", "name": "Preparación, montaje, servicio y recogida del comedor", "hue": "#8a4fd3", "sections": [{"t": "El Comedor", "cards": [{"t": "Establecimientos", "p": "<ul><li><b>Bares y cafeterías:</b> bebidas y comidas rápidas. <b>Restaurantes:</b> comidas en mesa. <b>Salones de banquetes:</b> grupos.</li><li>Restaurantes por <b>tenedores</b>: 5=lujo · 4=1ª · 3=2ª · 2=3ª · 1=4ª.</li><li>Cafeterías por <b>tazas</b>: 3=especial · 2=1ª · 1=2ª.</li></ul>"}, {"t": "Brigada", "p": "<ul><li><b>Maître</b>: jefe del comedor.</li><li><b>Jefe de sector (2º maître)</b>: parte del comedor.</li><li><b>Jefe de rango / camarero</b>: grupo de mesas.</li><li><b>Commis / ayudante</b>: apoya al rango.</li><li><b>Sumiller</b>: vinos.</li></ul>"}, {"t": "Local + limpieza", "p": "<ul><li>Junto al <b>office</b>, <b>opuesto a la cocina</b>; iluminación, ventilación, aislamiento; superficies <b>lisas</b>.</li><li>Limpiar desde la zona <b>más lejana → la puerta</b>.</li><li>Mesas <b>no se mueven</b>; sillas se agrupan. Madera: bayeta húmeda + limpiador. <b>Desinfección tras cada servicio</b>.</li><li>Calzar mesas con <b>rodajas de corcho</b>. Puertas abatibles con <b>ventana</b>.</li></ul>"}, {"t": "Mesas y sillas", "p": "<ul><li><b>Cuadradas</b> 0,80×0,80 y 1×1 (2–4 comensales; ≈60 cm/cliente).</li><li><b>Redondas</b> 1 / 1,25 / 1,60 (2–8/10).</li><li><b>Rectangulares</b> 1,25×1,75 y 2,60×0,80 (6–10, común). <b>Ovaladas</b> 8–20.</li><li>Sillas: sin brazos grandes, patas con fieltro/goma, asiento <b>0,45 m</b>.</li></ul>"}, {"t": "Banquetes y formas", "p": "<ul><li>Tableros con patas (~3 m); grandes: <b>trípodes</b>; ancho <b>0,80 m</b>/comensal; ventaja: apilar tableros.</li><li><b>U</b>: jefatura 60–80, resto 60. <b>E</b>: 70–80/60. <b>T</b>: 30–50. <b>Peine</b>: 80–90. <b>Americano, espiga, imperial</b> (cabecera 40–100, resto máx 60).</li></ul>"}, {"t": "Lencería", "p": "<ul><li><b>Muletón:</b> absorbe, amortigua, fija el mantel, protege la madera; cambiar si se mancha.</li><li><b>Manteles:</b> blancos; caída <b>mín 30 / máx 45 cm</b>; doblez central, sin pasar la mano; esquinas sobre patas, anagrama al centro; mín 3/mesa.</li><li><b>Tiras</b>: buffets. <b>Melba</b>: pan de molde tostado. <b>Blondas</b>: debajo de tartas.</li><li><b>Paños de repaso</b>: algodón/hilo sin pelusas 0,50×0,50; más grandes para cristal y loza.</li></ul>"}, {"t": "Lito · muleta · cubres · servilletas", "p": "<ul><li><b>Lito/brazal</b> (del camarero): antebrazo <b>izquierdo</b>; nunca en bolsillo ni secarse la frente; platos calientes, fuentes, vinos. Medidas: 0,60×0,40 · 0,75×0,50 · 0,80×0,60 · 0,80×1 m.</li><li><b>Muleta:</b> plato con servilleta en bolsillo; lleva la cubertería; <b>cuchillos debajo de los tenedores</b>.</li><li><b>Cubres:</b> mismo tejido, borde de la mesa <b>libres las esquinas</b>, caen <b>0,10 cm</b>.</li><li><b>Servilletas:</b> comida 50×50 / 40×45 / 60; desayuno 30×30; té 0,25.</li></ul>"}, {"t": "Menú", "p": "<ul><li>Del latín «minuta»; lo elabora el <b>Jefe de Cocina</b> según precios.</li><li>1º entremeses/sopas · 2º huevos/arroces/pescados/pastas · 3º carnes/aves/asados/caza · 4º postres.</li></ul>"}, {"t": "Orden de montaje (11)", "p": "<ol><li><b>Calzado de mesas</b> (asiento, soportes regulables)</li><li><b>Muletón</b> (elásticos/anudado, estirado)</li><li><b>Mantel</b> (de voleo, esquinas en patas, anagrama al centro)</li><li><b>Cubremantel</b> (mismo volado; vestir la mesa)</li><li><b>Plato base</b> a 2 cm del borde (referencia)</li><li><b>Cubertería</b>: empezar por
