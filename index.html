 último plato del menú; tenedor izq, cuchillo der <b>filo dentro</b> (2–4 cm); cuchara consomé der; plato de pan izq (5–7) con cuchillo mantequilla; postres delante (mango cuchara/cuchillo der, tenedor izq)</li><li><b>Cristalería</b>: agua delante del plato base (~2 cm); vino a la derecha</li><li><b>Centro</b>: ceniceros y pimenteros</li><li><b>Servilleta</b> (sobre el plato si ocupada)</li><li><b>Flores</b> naturales, sin tapar el campo visual, agua diaria</li><li><b>Aparador</b>: vajilla, cubiertos, mantelería, calientaplatos; trinchero al sentarse</li></ol>"}, {"t": "Montaje según servicio", "p": "<ul><li><b>A la carta:</b> solo copa de agua y vino; cuchillo filo hacia el plato, tenedor izq; misma altura, no escondidos; resto según pedidos.</li><li><b>Menú conocido:</b> cubiertos 1º y 2º (a veces solo 1º); a veces postres; dos vinos → blanco junto al tinto.</li><li><b>Plato de pan:</b> mejor después de cubiertos; borde alineado con el plato base.</li><li><b>Junta de Extremadura:</b> asentar mesa → muletón → mantel → cubremantel → plato base (concertado=todos, carta=solo base) → cubiertos (filo dentro, cóncava arriba) → postres atravesados → cristalería → plato de pan + cuchillo postre → servilletas sobre platos o copas → ceniceros.</li></ul>"}, {"t": "Office de comedor", "p": "<ul><li><b>Fuera de la cocina</b>, contiguo; agua fría/caliente, pilas de acero/aluminio, estanterías.</li><li>Airear armarios; baldas <b>no duras</b>; cristalería sin amontonar.</li><li><b>Marmitón</b>: batería de cocina. <b>Fregadores</b>: vajilla, cristalería, fuentes, cubiertos (si solo platería, = marmitón). <b>Camareros</b>: no lavan; sí <b>repasan</b>.</li></ul>"}, {"t": "Vajilla", "p": "<ul><li><b>Plato de entremeses NO es de vajilla</b> (se usa el trinchero).</li><li>Piezas: presentación/base, pan, sopero, <b>trinchero</b>, postre, consomé, café, té, moka, bol.</li><li><b>Lavado:</b> espátula, agua caliente + detergente, aclarado, escurridor con muletón, <b>≤15 platos</b>, teteras/jarras en pilas distintas.</li><li><b>Repaso:</b> sin vapor, paño de hilo, dos manos girando, sin huellas.</li><li><b>Transporte:</b> lomo del pulgar, nunca dedo dentro, máx 10–15; platos calientes con lito.</li></ul>"}, {"t": "Cristalería", "p": "<ul><li>Piezas: agua, <b>vino</b> (igual o menor), <b>cava</b> (tulipán/flauta/Rose Marie), borgoña, balón (coñac), catavinos, licor, cóctel, cerveza, jarra, long drink, zumo, <b>on the rock</b> (baja y ancha, mucho hielo), goblet, old fashioned.</li><li><b>Lavado:</b> coger por el <b>pie</b>, sumergir inclinado 90º, boca abajo en muletón, paño de algodón/hilo.</li><li><b>Repaso:</b> en comedor con <b>rechaud</b> + boca ancha (vapor); coger por la base, borde abajo sobre el vapor; paño de hilo blanco; atención a bordes.</li></ul>"}, {"t": "Cubertería", "p": "<ul><li><b>Personal:</b> cuchara sopera, tenedor y cuchillo trinchero, tenedor y pala de pescado, tenedor/cuchillo/cuchara de postre, tenedor y cuchillo de principios o lunch, cuchara de consomé.</li><li><b>Colectivo:</b> cazos, pala de huevos, pala de trinchar, cucharas de salsa, pala de pastelería, cacillo.</li><li><b>Lavado:</b> piezas una a una, estropajo que no roce, secar <b>paño entre púas</b>.</li><li><b>Repaso:</b> por el mango, agua tibia, paño húmedo, paño blanco, bandejas cubiertas; <b>nunca en presencia del cliente</b>.</li><li><b>Transporte:</b> sobre la muleta, nunca suelta.</li></ul>"}, {"t": "Petit menaje", "p": "<ul><li><b>Salero:</b> vaciar a diario; cristal agua+jabón, secar en calientaplatos/horno; sal pierde humedad en <b>horno</b>; <b>no arroz</b>; vinagre caliente + sal; tapa metálica polvos en seco; porcelana/cristal/cerámica <b>alcohol de quemar</b>.</li><li><b>Pimentero:</b> sacar la pimienta; madera gamuza+brillo; molinillo desmontar y trapo; metal limpiametales; comprobar aroma.</li><li><b>Vinagreras:</b><b>a diario</b> (ácido acético/nata); agua muy caliente; vinagre = sal gorda + vinagre agitando.</li><li><b>Azucarero:</b> a diario. <b>Tarrinas:</b> orificios, cuellos, tapaderas; vidrio/porcelana; no <b><1/3</b> de contenido.</li></ul>"}, {"t": "Carros y utensilios", "p": "<ul><li><b>Gueridón:</b> carro del jefe de rango; lleva el rechaud.</li><li><b>Rechaud:</b> preparación a la vista; limpiametales o blanco de España + alcohol; desmontar a diario; cambiar mechas; depósito óptimo.</li><li><b>Calientaplatos:</b> 20–25 platos; interior tras cada servicio; estática atrae polvo; encender 15 min antes.</li><li><b>Carro caliente:</b> limpiametales o pasta + alcohol, brillo gamuza; revisar depósito de agua.</li><li><b>Cona:</b> café a la vista; desmontar, enjabonar, aclarar, escurrir, paño de hilo.</li><li><b>Entremeses/postres:</b> fijo, torno o noria (engrasar); campana transparente.</li></ul>"}, {"t": "Carros (II)", "p": "<ul><li><b>Quesos:</b> campana transparente (solo retirar para partir); muletón humedecido, cambio diario.</li><li><b>Bebidas:</b> paño humedecido; arriba botellas + hielo, abajo vasos.</li><li><b>Prensa de jugos:</b> plata/alpaca, peana de madera, arandela 2 asas, eje roscado, grifo inferior, campana.</li><li><b>Calientacopas:</b> agua dentro, sin tocar la llama; brandis y coñacs (balón).</li><li><b>Fuente con campana:</b> nunca fritos; lito rodeando, lito mayor que la campana.</li><li><b>Pies y cubos:</b> agua hasta la mitad + hielo, botella inclinada, lito dejando etiqueta visible.</li><li><b>Cestas de vino:</b> grandes reservas, mimbre/junco; descorcha el sumiller en presencia del cliente.</li></ul>"}, {"t": "Aparador", "p": "<ul><li>Zonas: manteles sucios/limpios, cristalería, vajilla, cubertería, menaje, ceniceros.</li><li>Cajones cubertería (orden): cucharas soperas → cuchillos trincheros → tenedores trincheros → pala y tenedor pescado → cuchara postre → cuchillo postre → tenedor postre → cacillos/cucharas café; <b>encantaradas de izq a der</b>, concavidades iguales.</li><li>Vajilla: entrepaño bajo, pilas de <b>12–15</b>, de izq a der: soperos, trincheros, postres, consomé, pan (pequeños a la derecha).</li><li>Mantelería stock = <b>mitad de la montada</b> (6 mesas → 3 manteles, 3 cubres, par de litos, 12 servilletas).</li><li>Petit menaje en mesa: salero, pimentero, cenicero y número. Resto en aparador.</li><li>Copas de izq a der: agua, tinto, blanco. Ceniceros en filas. Reposición mañana, mediodía y en el servicio.</li></ul>"}, {"t": "Clases de servicios", "p": "<ul><li><b>Inglés:</b> la fuente la sirve el camarero al plato · por la <b>izquierda</b>.</li><li><b>Francés:</b> se presenta la fuente para que el cliente se sirva · izquierda.</li><li><b>Emplatado / al plato:</b> desde cocina · por la <b>derecha</b>.</li><li><b>Gueridón / a dos manos / ruso:</b> fuente con campana → quitar campana → rechaud → pinzas · derecha.</li><li><b>Residencia/hospitales:</b> carro caliente o camareta.</li><li><b>Autoservicio:</b> colegios, residencias, cinta.</li><li><b>Cliente de mesa:</b> pasante vs fijo (pensión completa/media).</li></ul>"}, {"t": "Autoservicio y catering", "p": "<ul><li><b>Libre:</b> público; bandeja al principio, platos fríos/calientes, pan, postres, bebidas, tique.</li><li><b>Restringido:</b> clientela fija con reservas; pasantes si hay espacio.</li><li><b>Exclusivo:</b> empresa, colegios, hospitales, residencias; cada uno su lugar.</li><li><b>Asistido:</b> brigada tras los expositores; camarero lleva los platos y comanda el vino.</li><li><b>Catering:</b> encimera de poliéster homologada; detergentes bactericidas; bancadas fijas al suelo; limpieza general/profunda tras el servicio.</li></ul>"}, {"t": "Vino: introducción", "p": "<ul><li><b>Vino:</b> fermentación alcohólica total o parcial de uva fresca o mosto. <b>Grado: 9–15 % vol.</b></li><li><b>Extremeños:</b> Ribera del Guadiana (D.O.) y vino de mesa (sin D.O.) → estos dos se sirven en residencias de la Junta; graneles/pitarras no.</li><li><b>Destilados:</b> ron (caña), güisqui (cebada/centeno/trigo/maíz/avena), tequila (magüe), vodka (trigo), coñac (vino uva blanca), grog, egg-nog.</li><li><b>Sin destilar:</b> vino, sidra, cerveza, sake.</li></ul>"}, {"t": "Tipos de vinos", "p": "<ul><li><b>De mesa:</b> pastos (mismo año) · nobles de mesa (baja graduación).</li><li><b>Generosos:</b> finos, manzanillas, amontillados, olorosos.</li><li><b>Licorosos:</b> mistelas, malsavias, lágrima, moscatel, pedro ximénez.</li><li><b>Espumosos:</b> cava y gran reserva.</li><li><b>Especiales:</b> aguja, rancio, chacolín, gasificados, enverados.</li><li><b>Espumoso por azúcar:</b> brut nature (sin azúcar) · brut (<10 g/L) · seco (0–30) · semiseco (30–50) · dulce (+50).</li></ul>"}, {"t": "Servir el vino", "p": "<ul><li>Presentar la botella con <b>etiqueta hacia el cliente</b>; tomarla por la <b>parte baja</b>.</li><li>Sacacorchos al <b>centro del tapón</b>, gira el sacacorchos (no la botella), sin sacudir, poco ruido; presentar el corcho y limpiar la boca.</li><li>Algo de vino al <b>anfitrión</b> para probar → señoras → caballeros → anfitrión · por la derecha.</li><li>Llenar hasta la mitad (2/3 en grandes); terminar con <b>giro a la derecha</b>; solo se repite si la copa está vacía.</li><li>Grandes reservas en canastillos horizontales; fríos en cubos-champaneras.</li></ul>"}, {"t": "Temperaturas (°C)", "p": "<table><tr><th>Vino</th><th>ºC</th></tr><tr><td>Blanco / blanco seco del año</td><td>6</td></tr><tr><td>Blanco añejo</td><td>10</td></tr><tr><td>Rosado / fino</td><td>8</td></tr><tr><td>Tinto ligero-joven</td><td>10</td></tr><tr><td>Tinto ambiente</td><td>15–18</td></tr><tr><td>Tinto crianza</td><td>15</td></tr><tr><td>Tinto viejo</td><td>17</td></tr><tr><td>Cava/sidra/champán/espumoso</td><td>6</td></tr><tr><td>Dulces postre, cerveza, refrescos</td><td>Muy fríos</td></tr></table>"}, {"t": "Maridaje", "p": "<table><tr><th>Plato</th><th>Vino</th></tr><tr><td>Entrantes</td><td>cava, fino, manzanilla</td></tr><tr><td>Marisco/pescado</td><td>cava, fino, manzanilla, albariño, blancos secos</td></tr><tr><td>Huevos</td><td>cava, rosados, blancos con cuerpo</td></tr><tr><td>Ternera / cerdo</td><td>tintos ligeros</td></tr><tr><td>Vaca / caza mayor</td><td>tintos viejos con cuerpo</td></tr><tr><td>Cordero lechal</td><td>cava, tintos jóvenes y viejos</td></tr><tr><td>Caza menor</td><td>tintos ligeros, viejos</td></tr><tr><td>Queso fresco</td><td>cava, blancos con cuerpo, jóvenes</td></tr><tr><td>Queso curado</td><td>cavas, sauternes, tintos ligeros/viejos</td></tr><tr><td>Sopas/cremas</td><td>cava, blancos con cuerpo</td></tr><tr><td>Legumbres</td><td>cava, tintos jóvenes</td></tr><tr><td>Arroz/pastas</td><td>cava, rosados, tintos ligeros</td></tr><tr><td>Fiambres</td><td>cavas, blancos con cuerpo, fino</td></tr><tr><td>Ensaladas/gazpacho</td><td>no se suele servir</td></tr><tr><td>Postre</td><td>cavas, licores, oporto</td></tr></table>"}, {"t": "Almacenaje y botellas", "p": "<ul><li><b>Almacenaje:</b> sótano fresco, ni claro ni seco, ventilado pero <b>sin corrientes</b>; botellas <b>tumbadas</b> (el corcho no se seca; el vino respira por él).</li><li><b>Calientacopas:</b> infiernillo + soporte; copas balón; girar lento sin tocar la llama.</li><li><b>Botellas:</b> alsaciana (estilizada, verde 7,2) · bordalesa (hombros altos, 7,2–7,6) · borgoña (hombros caídos, oscura) · boxbeutel/franconia (plana, verde) · champagne (paredes gruesas) · fiasco (paja, Chianti) · jerezana (cilíndrica oscura cuello largo) · renana (estilizada, verde Mosela/marrón Rin).</li></ul>"}, {"t": "Tabla de comidas", "p": "<table><tr><th>Comida</th><th>Servicio</th><th>Cliente</th><th>Temp.</th><th>Vino</th></tr><tr><td>Croquetas / Gambas a la gabardina / Crudités</td><td>Nada</td><td>Tenedor de principios · plato trinchero o postre</td><td>Muy caliente / muy caliente / frío</td><td>Aperitivo cava / cava / aperitivo</td></tr><tr><td>Alcachofas rellenas</td><td>Plato trinchero caliente</td><td>Tenedor y cuchillo trinchero</td><td>Caliente</td><td>Rosado</td></tr><tr><td>Gratinado de cebolla</td><td>Trinchero caliente · cazuela · sopero caliente · queso rallado</td><td>Cuchara sopera y tenedor trinchero</td><td>Muy caliente</td><td>Blanco afrutado · cava</td></tr><tr><td>Consomé con yema</td><td>Taza y plato de consomé calientes</td><td>Cuchara sopera y tenedor trinchero</td><td>Caliente</td><td>Blanco con cuerpo · cava</td></tr><tr><td>Espárragos en salsa menestra</td><td>Trinchero · pinzas · salsas · lavadedos</td><td>Cuchillo y tenedor trinchero</td><td>Fríos con mayonesa/vinagreta; calientes con holandesa</td><td>Rosado (plato difícil)</td></tr><tr><td>Consomé moscova</td><td>Consomé frío · caviar · crema agria · limones · molinillo</td><td>Cuchara de consomé y tenedor de postre</td><td>Frío</td><td>Vodka</td></tr><tr><td>Gazpacho</td><td>Consomé frío o sopero · bol · guarnición</td><td>Taza: cuchara de consomé; plato: cuchara sopera</td><td>Frío</td><td>No lleva (vinagre)</td></tr><tr><td>Spaguetti napolitana</td><td>Sopero caliente · tomate concassé · queso · mantequilla clarificada</td><td>Cuchara sopera izq y tenedor der</td><td>Caliente</td><td>Tinto joven</td></tr><tr><td>Paella</td><td>Trinchero caliente</td><td>Tenedor y cuchillo trincheros</td><td>Caliente</td><td>Tinto joven y rosados</td></tr><tr><td>Revuelto de ajetes</td><td>Trinchero caliente</td><td>Tenedor der · molinillo</td><td>Caliente</td><td>Rosado · cava · blanco</td></tr><tr><td>Lenguado a la parrilla</td><td>Trinchero caliente · pala y cuchara de pescado (izquierda)</td><td>Tenedor de pescado y pala de salsas</td><td>Caliente</td><td>Cava · blanco seco (albariño)</td></tr><tr><td>Huevos poché florentina</td><td>Trinchero caliente</td><td>Cuchara de postre der, tenedor izq</td><td>Caliente</td><td>Rosado</td></tr><tr><td>Rodaballo con azafrán</td><td>Pinzas · trinchero caliente</td><td>Tenedor de pescado · pala de salsas</td><td>Caliente</td><td>Blancos en barrica · cava</td></tr><tr><td>Ostras al natural</td><td>Plato de ostras con hielo pilé + limón · lavadedos</td><td>Tenedor/cuchara de ostras · melbas · tartinas</td><td>Frío</td><td>Blanco seco (albariño)</td></tr><tr><td>Vieiras al champán</td><td>Trinchero</td><td>Tenedor de pescado y pala</td><td>Caliente</td><td>Cava · blanco afrutado</td></tr><tr><td>Solomillo Wellington / Manitas a la plancha</td><td>Trinchero caliente</td><td>Tenedor y cuchillo trinchero</td><td>Caliente</td><td>Tinto de reserva / tinto joven</td></tr><tr><td>Mollejas braseadas</td><td>Trinchero caliente</td><td>Tenedor y cuchillo trinchero</td><td>Caliente</td><td>Tinto de crianza</td></tr><tr><td>Riñones al jerez</td><td>Trinchero caliente</td><td>Tenedor trinchero der</td><td>Caliente</td><td>Tinto ligero</td></tr><tr><td>Pato a los higos</td><td>Trinchero caliente</td><td>Tenedor y cuchillo trinchero</td><td>Caliente</td><td>Tinto de reserva</td></tr><tr><td>Hígado de oca</td><td>Trinchero caliente · tabla de trinchar · pinzas</td><td>Tenedor y cuchillo trinchero</td><td>Caliente</td><td>Cava y tinto ligero</td></tr><tr><td>Venado al oporto</td><td>Emplatado con campana</td><td>Tenedor y cuchillo trinchero</td><td>Caliente</td><td>Tinto de reserva con cuerpo</td></tr><tr><td>Crepes suzette</td><td>Fuente · sauté · rechaud · flamear (curasao, zumo)</td><td>Cuchara y tenedor de postre</td><td>Recién hechas</td><td>Pedro Ximénez · moscatel · oporto</td></tr><tr><td>Coronel de limón</td><td>Plato de postre · copa ancha · servilleta</td><td>Cuchara de té</td><td>Muy frío</td><td>Ninguno</td></tr><tr><td>Banana Singapur</td><td>Se sirve en el plato</td><td>Cuchara y tenedor de postre</td><td>Muy frío</td><td>Ninguno</td></tr></table>"}]}], "ncards": 27}, {"key": "6", "num": "Tema 6", "name": "Lavado, planchado y conservación de ropas y tejidos", "hue": "#3e9c35", "sections": [{"t": "1 · Lavandería, maquinaria y fibras", "cards": [{"t": "Definición", "p": "<p>Lugar de los grandes centros residenciales donde la ropa sucia recibe <span class=\"h\">lavado, secado y planchado</span>. Zonas: <span class=\"h\">lavado y secado</span> · <span class=\"h\">planchado y doblado</span>. Maquinaria <span class=\"h\">moderna y no complicada</span>; personal con nociones de maquinaria y detergentes.</p>"}, {"t": "Maquinaria", "p": "<p>Lavado: lavadoras (industriales y caseras), pilas/lavaderos, centrifugadoras, secadora.</p><p>Planchado: planchadora de rodillo, plancha, plancha de vapor, gorrero.</p><p>Otros: mesas clasificadoras, barreños, <b>pesebres</b> (ropa sucia), cestos, almohadillas. Planchado fijo: mesa doblado/planchado, estanterías, colgadores; móvil: mangueros, gorreros.</p>"}, {"t": "Fibras: clasificación", "p": "<p>Naturales → vegetales (lino, algodón), animales (lana, angora, seda), minerales (amianto, telas metálicas).</p><p>Químicas → artificiales (rayón, viscosa), sintéticas (poliéster, nylon, licra).</p>"}, {"t": "Vegetales", "p": "<p><b>Algodón:</b><span class=\"r\">encoge con agua muy caliente</span>; <span class=\"h\">resiste la plancha</span>. <b>Lino:</b> siempre <span class=\"h\">a mano</span>, <span class=\"r\">nunca centrifugar</span>; resiste la plancha.</p>"}, {"t": "Animales", "p": "<p>Característica: <b>albúmina</b>. <b>Lana:</b><span class=\"r\">encoge a calor</span>, <span class=\"r\">se deforma</span> al centrifugar o colgar; se apolilla; plancha con <b>paño húmedo templado</b>. <b>Seda:</b> sin temperaturas extremas <span class=\"r\">ni centrifugado</span>; plancha sin vapor a baja temp.</p>"}, {"t": "Minerales", "p": "<p>Amianto (aislante de calor/sonido), telas de vidrio (incombustibles, cortinas), metálicas (oro, plata, cobre).</p>"}, {"t": "Artificiales y sintéticas", "p": "<p><b>Rayón/viscosa</b>: sin centrifugado; planchar como la seda. <b>Sintéticas</b>: <span class=\"r\">sensibles al calor</span> → agua tibia, plancha baja sin vapor.</p>"}, {"t": "Lejía por tejido", "p": "<p><span class=\"r\">NUNCA lejía</span> en <b>color · lana · seda · fibras</b>. Soportan bien: <span class=\"v\">algodón · lino · hilo · cáñamo</span>.</p><p><b>Algodón:</b> más temperatura, tiempo, jabón y aclarado. <b>Sedas/tergal:</b> agua tibia, menos tiempo, mitad de jabón, aclara fácil.</p>"}]}, {"t": "2 · Clasificación, agua y lavado", "cards": [{"t": "Clasificación de la ropa", "p": "<p>Separa por <b>sectores</b>; <span class=\"r\">nunca mezclar comedor con cama</span>; por tamaños y grado de suciedad; manchas especiales antes del lavado; <b>contar y anotar</b> en impresos; pesebres.</p><p>Por servicios: plantas (sábanas, toallas, fundas, colchas) · comedor y cocina (manteles, servilletas, litos, paños) · áreas públicas (visillos, estores, cortinas) · residentes (interiores, lana, seda) · personal (uniformes, delantales).</p>"}, {"t": "4 factores de lavado", "p": "<p><b>Mecánica 25%</b> + <b>Tiempo 25%</b> + <b>Temperatura 25%</b> + <b>Química 25%</b>. Si falta uno → <span class=\"h\">aumentan los otros tres</span>.</p>"}, {"t": "Dureza del agua", "p": "<p>Por <b>sales cálcicas y magnésicas</b>: blandas 0–10 · semiblandas 11–20 · semiduras 21–30 · duras 31+.</p><p><span class=\"r\">Dura:</span> precipita el jabón, tejidos incrustados, ataca la celulosa; hierro → amarilleo (ácido oxálico, hiposulfito/dihidrosulfito sódico). <span class=\"v\">Descalcificada</span> + detergente + perborato/agua oxigenada/lejía a baja temp → más duración.</p>"}, {"t": "Vida útil (lavados)", "p": "<table><tr><td><b>Sábanas</b></td><td>225–250</td><td><b>Fundas</b></td><td>120–180</td></tr><tr><td><b>Mantelería</b></td><td>125–180</td><td><b>Toallas felpa</b></td><td>140–160</td></tr></table>"}, {"t": "Colchones / almohadas", "p": "<p>Aspirador, <b>no lavar</b>. Mancha → pasta de almidón y agua, se cepilla seca. Niño enfermo → <b>hule</b> entre colchón y muletón. Cuadrantes 60×60. Almohada ~35 cm.</p>"}, {"t": "Elementos del lavado", "p": "<p><b>Agua</b> (transporta detergente y arrastra suciedad) · <b>temperatura</b> (facilita la acción y desprende la suciedad) · <b>detergentes</b> (empapan y ablandan) · <b>lejía/blanqueadores</b> (blanquean a baja temp).</p>"}, {"t": "Detergentes y jabón", "p": "<p>Naturales (jabonosos) y sintéticos (tensoactivos, emulsionantes, humectantes). <span class=\"r\">Mayor alcalinidad → mayor desgaste</span>. Más usados: <b>sintéticos aniónicos</b>.</p><p>Jabón: duro (<b>sosa</b>), blanco (<b>potasa</b>), en polvo, de escamas, sólido. Tensioactivo: parte <b>hidrófoba</b> (grasa) + <b>hidrófila</b> (agua).</p>"}, {"t": "Lejía", "p": "<p>Blancura y quita manchas. <span class=\"v\">Uso:</span> baja temperatura, <b>segundo aclarado</b>, diluida. <span class=\"r\">Nunca</span> junto al jabón ni sobre color/lana/seda. Aclarar hasta perder olor a cloro. Ataca la celulosa, sobre todo a <b>60 ºC</b>. A 80–90 ºC reduce mucho la vida del tejido.</p>"}, {"t": "Blanqueadores", "p": "<p><b>Perborato sódico y agua oxigenada</b>: más blancura y conservación; no en lavadoras con bomba de cobre; perborato de sosa apto para <b>lana y seda</b>. <b>Lejía con cloro</b>: <span class=\"r\">destruye el algodón</span>.</p>"}]}, {"t": "3 · Lavado a mano, máquinas y secado", "cards": [{"t": "Lavado a mano", "p": "<p>Ropa del cliente, prendas finas y que destiñen/encojan. <b>Agua abundante + jabón neutro</b>, frotado suave; secar respetando la forma (delicadas en horizontal).</p>"}, {"t": "Lavadoras", "p": "<p>Industriales y caseras. El tambor lava, aclara y centrifuga. Preparación: vaciar bolsillos, separar blanco/color, no sobrecargar, programa adecuado a cada tejido.</p>"}, {"t": "Cuidados de la lavadora", "p": "<p>Limpiar <b>filtro</b> y gomas tras cada uso; dejar la puerta abierta; comprobar manguitos, cierre y correa; revisiones periódicas del técnico.</p>"}, {"t": "Lavado óptimo (normas)", "p": "<p>① Agua en condiciones adecuadas ② detergente apropiado ③ controlar temperatura y tiempo ④ respetar capacidad ⑤ aclarado abundante y centrifugado suave ⑥ sacar la ropa mojada cuanto antes ⑦ secar y planchar según tejido.</p>"}, {"t": "Centrífugas (hidroextractoras)", "p": "<p>Eliminan agua por fuerza centrífuga. Carga <b>equilibrada</b>; <span class=\"r\">no centrifugado de lana/seda/fibras</span>; vigilar embrague y freno.</p>"}, {"t": "Secadoras y tiempos", "p": "<table><tr><th>Ropa</th><th>Temp</th><th>Tiempo</th></tr><tr><td>Algodón y lino</td><td><b>Alta</b></td><td><b>45–60 min</b></td></tr><tr><td>Sintéticas</td><td><b>Baja</b></td><td><b>25–35 min</b></td></tr><tr><td>Seda y lana</td><td>Nunca en secadora</td></tr></table>"}, {"t": "Lavado de color", "p": "<p><span class=\"r\">Nunca lejía</span>. Agua tibia, no mezclar colores intensos con claros, dar la vuelta a la prenda, acabado a baja temperatura.</p>"}, {"t": "Blanqueo", "p": "<p>Solo <span class=\"v\">algodón y lino</span>; <span class=\"r\">nunca en color/lana/seda/sintéticos</span>. Preferible perborato y agua oxigenada (conservan); lejía con cloro a baja temp.</p>"}, {"t": "Temperaturas de lavado", "p": "<table><tr><th>Agua</th><th>Indicada para</th></tr><tr><td>80–90 ºC</td><td>Blanco de algodón muy sucio; lejía aquí reduce la vida</td></tr><tr><td>60–70 ºC</td><td>Ropa blanca de algodón, toallas</td></tr><tr><td>37–40 ºC</td><td>Sintéticas, color, sedas, tergal</td></tr><tr><td><30 ºC fría</td><td>Muy delicadas y que destiñen</td></tr></table>"}, {"t": "Secado al aire libre", "p": "<p>Sol blanquea el blanco; lana/seda y color a la <b>sombra</b>; colgar por la forma; abrir bien antes de tender; secas delicadas en horizontal.</p>"}]}, {"t": "4 · Símbolos, manchas, mantas y visillos", "cards": [{"t": "Símbolos de lavandería", "p": "<p>Palangana: lavado; número = máx. temp. en ºC; con línea bajo el cazo = lavado delicado; con mano = <b>a mano máx. 40 ºC</b>; tachada = <b>no lavar</b> (limpieza en seco).</p><p>Triángulo: blanqueo con cloro; tachado = no blanqueador; con <b>CL</b> = lejía permitida (agua fría).</p><p>Cuadrado: secado. Con círculo = <b>secadora</b> (1 punto suave · 2 normal); tachado = no secadora; con línea horizontal = <b>en plano</b>; vertical = en percha; con arco = <b>a la sombra</b>.</p><p>Círculo solo: limpieza en seco. Plancha: 1 punto baja · 2 media · 3 alta; tachada = no planchar.</p><p>Una barra bajo el símbolo = tratamiento suave; dos barras = muy suave.</p>"}, {"t": "Manchas: normas", "p": "<p>Localizarlas <b>antes del lavado</b>; tratar <b>cuanto antes</b>; trabajar <b>detrás de la mancha</b>, de fuera hacia dentro; trapo absorbente debajo; probar el producto en sitio poco visible; aclarar al final; respetar tiempos.</p>"}, {"t": "Naturaleza", "p": "<p><b>Vegetales</b> (frutas, cacao, salsas) · <b>animales</b> (sangre, orina, huevo, lácteos) · <b>minerales</b> (óxido, barro, tinta) · <b>grasa</b> (aceite, maquillaje) · <b>especiales</b> (alquitrán, barniz, cera, chicle).</p>"}, {"t": "Disolventes orgánicos", "p": "<p><b>Tetracloruro de carbono</b> y bencina: grasa/aceite (ventilar) · <b>aguarrás/éter de petróleo</b>: pintura al óleo · <b>alcohol</b>: tintas, esmalte · <b>acetona</b>: esmalte de uñas (probar antes) · <b>amoniaco y vinagre</b>: neutralizan olores/acidez.</p>"}, {"t": "Simples y compuestas", "p": "<p><b>Simple</b>: una sustancia, un disolvente (café, aceite). <b>Compuesta</b>: varias sustancias, varios disolventes (salsa cacao, chocolate con leche).</p>"}, {"t": "Productos según la tela", "p": "<p>Algodón y lino: productos fuertes y agua caliente. <span class=\"r\">Lana: suaves y tibios. Seda: muy suaves, nada alcalino.</span> Sintéticas: no agresivos, sin calor.</p>"}, {"t": "Precauciones", "p": "<p><span class=\"r\">No frotar en seco</span>, no verter el producto a chorro, no mezclar incompatibles (lejía + amoniaco = gases), no demorar. Ventilar los volátiles.</p>"}, {"t": "Recetas rápidas", "p": "<table><tr><td><b>Grasa</b></td><td>Tetracloruro/bencina</td></tr><tr><td><b>Sangre</b></td><td>Agua fría (nunca caliente)</td></tr><tr><td><b>Óxido</b></td><td>Ácido oxálico / limón + sal</td></tr><tr><td><b>Cera / chicle</b></td><td>Hielo + raspado suave</td></tr><tr><td><b>Esmalte</b></td><td>Acetona (probar antes)</td></tr><tr><td><b>Tinta</b></td><td>Alcohol, trapo absorbente</td></tr><tr><td><b>Vino</b></td><td>Agua fría y sal</td></tr><tr><td><b>Café/té</b></td><td>Agua tibia + jabón; agua oxigenada diluida</td></tr><tr><td><b>Pintura óleo</b></td><td>Aguarrás</td></tr></table>"}, {"t": "Mantas y visillos", "p": "<p><b>Mantas:</b> agua templada y jabón neutro, sin calor fuerte, sin retorcer, tender en horizontal, no planchar. <b>Visillos:</b> bolsa de malla, agua tibia, sin centrifugar, colgar húmedos. <b>Estores:</b> aspirador y limpieza localizada / en seco.</p>"}]}, {"t": "M2 · Condiciones y técnicas", "cards": [{"t": "Zona de planchado y doblado", "p": "<p>Para planchar: <b>perfecto lavado y mejor aclarado</b>. Restos de jabón → prenda <b>amarilla</b>. Toda prenda con <b>cierto grado de humedad</b>: el mantel más húmedo que una sábana fina. Algodón: más humedad en calandra, menos en rodillo, menos aún a mano.</p>"}, {"t": "Selección de la ropa", "p": "<p>Llega <b>por prendas iguales</b> por servicios (plantas, restaurante, comedor). Las máquinas se programan para un tejido y humedad y <b>no se cambian hasta terminar el lote</b>; sin mezclar grandes con pequeñas (manteles ≠ servilletas). La ropa debe estar <b>cosida o reparada</b>.</p>"}, {"t": "Clasificación post-lavado", "p": "<p>Para <b>coser y planchar</b> · para <b>humedecer</b> · para <b>almidonar</b>.</p><p>Prendas que <b>no precisan plancha</b>: sintéticas, nylon (inarrugables) y tergal en perfectas condiciones.</p>"}, {"t": "Doblado", "p": "<p><b>Sábanas</b>: entre dos personas, orillas estiradas, orillas y embozo hacia dentro. <b>Toallas de felpa</b>: por norma no se planchan. Abiertas → mesa; cerradas → tabla.</p>"}, {"t": "Nociones de planchado", "p": "<p>Por el <b>derecho</b>; <span class=\"r\">lanas y negros por el revés</span> (evitan brillo). Apoyar en la <b>parte de atrás</b>, no en la punta. Piezas grandes de arriba hacia abajo. <b>Desabotonada</b>. Elásticos, telas elásticas y puntos elásticos: <b>no se planchan</b>.</p>"}, {"t": "Casos especiales", "p": "<p><b>Bieses</b>: suave, sin presionar, al hilo. <b>Plisados</b>: al aire, presionando poco. <b>Cuellos huecos</b>: almohadilla detrás o bies en tres partes. <b>Volantes</b>: girando la plancha entre los frunces.</p>"}, {"t": "Técnicas", "p": "<p>Suavizante en el aclarado → mejor planchado y olor. Tender estirando y dejando humedad agiliza la plancha.</p>"}]}, {"t": "M2 · Prendas concretas", "cards": [{"t": "Ropa interior de señora", "p": "<p>Empezar por <b>bordados y encajes</b>, al hilo; doblar con el <b>menor número de pliegues</b>.</p>"}, {"t": "Ropa interior de caballero", "p": "<p>Calzoncillos/slips: plancha ligera, doblar todos en el mismo sentido, último plegado por el centro. Pijama: el pantalón doblado va <b>dentro de la chaqueta</b>.</p>"}, {"t": "Forradas · faldas · chaquetas", "p": "<p><b>Forradas:</b> primero el forro, luego sarga al derecho. <b>Faldas y chaquetas no se doblan</b>: cuelgan en perchas hasta la habitación.</p>"}, {"t": "Planchado de CAMISAS", "p": "<p>① Cuello y canesú ② Puños y mangas ③ Delantero ④ Espalda ⑤ Repasar, <b>abrochar botones de abajo hacia arriba</b>, colocar el cuello ⑥ Boca abajo, laterales y mangas hacia dentro, <b>última doblez por la mitad</b>.</p>"}, {"t": "Planchado de PANTALONES", "p": "<p>① Forros y bolsillos ② Pletina (cinturilla por el revés) ③ Costura de atrás ④ <b>Abrochar la cremallera</b> ⑤ Delantera con pinzas/pliegues (almohadilla).</p><p>La raya coincide con la pinza más cercana a la cremallera; sin pinza, con la trabilla.</p>"}, {"t": "Planchado de VESTIDO lavable", "p": "<p>Del <b>revés</b>: bolsillos, cintura, volantes, cuellos, puños, mangas (en el manguero), delanteros, espalda y falda.</p>"}, {"t": "Mesa de planchar", "p": "<p>Una o dos mantas de algodón + sabanilla. Superficie <b>1,20 × 0,80 m</b>, altura 0,80 m. Sobre la mesa: plancha, azulejo + trapito mojado, almohadilla (bordados/botones/hombreras). Ropa especial: sarga, franela (camisas), manguero, gorrero. Tablero: muletón doble + sábana.</p>"}, {"t": "Tablas de planchar", "p": "<p>Para prendas <b>cerradas</b>: 30 cm ancho × 1,60 m largo, muletón y tela blanca clavados al borde.</p>"}]}, {"t": "M2 · Máquinas y útiles de plancha", "cards": [{"t": "Planchadora, rodillo o rulo", "p": "<p>Perfecto para sábanas, fundas, manteles y servilletas con <b>humedad muy baja</b>. Partes: <b>cubeta</b> (suela de mayor superficie, con <b>2+ termostatos</b> de regulación gradual y constante), <b>rodillo o cilindro giratorio</b> (motor, 30 cm, revestido de lana, yute, muletón y algodón) y <b>mandos</b>.</p>"}, {"t": "Temperaturas", "p": "<p><b>Más bajas</b>: fibras artificiales · <b>más altas</b>: hilo.</p><p>Algunas máquinas planchan y <b>secan a la vez</b>.</p>"}, {"t": "Calandras", "p": "<p><b>Secado + planchado simultáneo</b> de ropa lisa; sin pasar por secadora; salen listas para doblar (hay calandras <b>plegadoras</b>). Disco: lenta, normal, retroceso. Personal: <b>4 personas</b> (2 maquinistas fijos + 2 recogedoras-dobladoras). Ropa lisa llega en <b>borriquetas</b>.</p>"}, {"t": "Prensa de vapor", "p": "<p>Vapor de red o <b>calderín eléctrico</b>: americanas, pantalones, abrigos.</p>"}, {"t": "Prensa eléctrica", "p": "<p>Prendas confeccionadas (camisas, batas, pijamas); en lana, <b>tela humedecida</b> entre prenda y prensa.</p>"}, {"t": "Las planchas", "p": "<p><b>Normal</b>: sin termostato, apenas se usa. <b>Automática</b>: temperatura constante; suela/calefactor, <b>termostato</b>, piloto; guardar limpia por debajo. <b>De vapor</b>: cámara de evaporización; agua dura → <b>destilada o hervida</b>; vaciar y conectar 2–3 min al terminar; limpiar conductos <b>1 vez al mes</b>. Oxidada → petróleo + cera en caliente.</p>"}, {"t": "Condiciones de la plancha", "p": "<p>Peso <b>1,5–2 kg</b> (sentada) a 3 kg (de pie); mango cómodo; suela lisa y pulida con <b>2 ranuras</b> cerca de la punta para los botones.</p>"}, {"t": "Zona de doblado", "p": "<p><b>Mesa de doblado</b> (grande, entre rodillo y empleado) · <b>burrillas</b> (sábanas planchadas, para 1 persona) · <b>estanterías</b> (ropa doblada) · <b>colgadores</b> (barra para perchas).</p>"}, {"t": "Útiles · vocabulario", "p": "<p><b>Mangueros</b> 55–60 cm (mangas) · <b>gorreros</b> 56×21 (gorros con almidón) · <b>almohadillas</b> (botones por el revés) · <b>sargas</b> (paños húmedos) · <b>cestos</b>.</p><p><b>«Tirar la prenda»</b> = meter ropa en máquinas para plancharla. <b>«Ropa menuda»</b> = doblado de la ropa lisa del restaurante.</p>"}]}, {"t": "M2 · Lavado, oxidantes y seguridad", "cards": [{"t": "Fases generales del lavado", "p": "<p>Recepción → clasificación → <b>pesar</b> → lavar → secar → recogida → transporte para planchar → clasificar (plancha / no plancha) → planchado → plegado correcto → estanterías o armarios → distribución. Pesar y anotar peso y tipo de lavado; seleccionar el programa en el bombo; cerrar compuerta; termina con centrifugado.</p>"}, {"t": "Oxidantes (redox)", "p": "<p>El oxidante toma electrones (se reduce); la otra sustancia los cede (se oxida). Sobre la prenda: las manchas se oxidan → se eliminan mejor y el tejido blanquea.</p><table><tr><td><b>Perborato sódico</b></td><td>Libera oxígeno, pH alcalino; elimina manchas <b>sin decolorar</b></td></tr><tr><td><b>Agua oxigenada</b></td><td>Oxida sin gran deterioro</td></tr><tr><td><b>Oxígeno activo</b></td><td>Con celulosa puede formar <b>oxicelulosa</b></td></tr><tr><td><b>Clorito de sodio</b></td><td>Blanquea sintéticas y celulósicas (ácido acético protector)</td></tr></table>"}, {"t": "Fibras frente al calor", "p": "<p><b>Celulósicas</b>: arden, no funden ni encogen. <b>Proteicas</b>: funden y arden lentamente. <b>Poliamida/poliéster</b>: funden y encogen. <b>Acrílicas</b>: funden y se derriten.</p>"}, {"t": "pH, cloruros y hierro", "p": "<p>pH ideal <b>7 neutro</b>; 6 = corrosiva para conducciones; alcalina = problemas de aclarado y en la calandra. <b>Cloruros</b>: incrustaciones; máx. <b>1,5 mg/l</b>. <span class=\"r\">Hierro</span>: daños catalíticos al algodón en el blanqueo; amarillea, agujeros y pérdida de resistencia; máx. <b>0,1 mg/l (0,1 ppm)</b>.</p>"}, {"t": "Blanqueantes y aditivos", "p": "<p><b>Ópticos</b>: UV → luz azul, más blancura y brillo; se acumulan en el tejido. <b>Químicos</b>: perborato. <b>Activador del perborato</b>: blanquea a baja temp. <b>Enzimas</b>: manchas biológicas, soportan 70 ºC. <b>Bactericidas</b>: higiene y desodorante (sintéticas). <b>Silicatos sódicos</b>: anti-corrosión. <b>Antirredeposición</b>: solo en celulosa. <b>Reguladores de espuma</b>: mucha espuma impide aclarado (agrisa). Perfume y auxiliares de presentación.</p>"}, {"t": "Orden de los productos", "p": "<p><span class=\"r\">Lejía nunca en la fase de lavado</span>: primer aclarado. <b>Suavizante</b>: último aclarado. <b>Blanqueantes en polvo</b>: con el detergente. <b>Vinagre</b>: últimos aclarados (aviva el color).</p>"}, {"t": "Accidentes y soluciones", "p": "<p><b>Amarillenta</b>: exceso de detergente/lejía → lavado con descalcificador de lavavajillas; aclarados 4–5 máquina / 3 mano. <b>Agrisada</b>: exceso de suavizante → lavados sin suavizante. <b>Desgarros/en ganchones</b>: lavar en red, del revés si hay relieve. <b>Avivar color</b>: detergente sin blanqueantes + vinagre en el último aclarado. <b>Desteñidos</b>: probar solidez; agua con sal y hielo · hirviendo con vinagre o cáscaras de huevo · desmanchante.</p>"}, {"t": "Carga de la lavadora", "p": "<p><span class=\"r\">Menos ropa</span> → misma máquina, misma agua, misma dosificación: <b>perdemos tiempo y agua</b>. <span class=\"r\">Más ropa</span> → máquina forzada, ropa aprisionada, productos que no penetran, ropa queda <b>más sucia</b>; más producto <b>no implica más limpieza</b>.</p>"}]}], "ncards": 68}, {"key": "7", "num": "Tema 7", "name": "Aspectos ecológicos en la limpieza", "hue": "#d1485f", "sections": [{"t": "1 · Dto 109/2015: residuos sanitarios", "cards": [{"t": "Definiciones", "p": "<p><b>Residuo sanitario</b>: sustancia u objeto generado en actividades sanitarias o tratamientos de <b>cuidado y mejora estética</b> (implantación capilar, micropigmentación, tatuajes, perforación cutánea) que se desecha. <b>Operaciones internas</b>: manipulación, clasificación, segregación, envasado, etiquetado, acopio, traslado y almacenamiento dentro del centro.</p><p><b>Gestión</b>: recogida, transporte y tratamiento, incluida la vigilancia y las labores de <b>negociante o agente</b>.</p>"}, {"t": "GRUPO I · Domésticos y similares", "p": "<p>Similares a los de hogares; <span class=\"r\">sin riesgo de infección</span>; cocinas, cafeterías, oficinas, jardinería.</p>"}, {"t": "GRUPO II · Sin riesgo de infección", "p": "<p>No peligrosos, sin requisitos especiales: vendas, gasas, algodón, vaciados de yeso, sondas, guantes, ropa desechable, compresas/pañales con restos de sangre, bolsas de sangre vacías, restos anatómicos sin identidad suficiente. <b>Asimilables a domésticos</b>.</p>"}, {"t": "GRUPO III · Riesgo de infección", "p": "<p><span class=\"r\">Peligrosos</span>. Agujas y cortantes/punzantes · vacunas vivas y atenuadas · cultivos infecciosos · fluidos, sangre y hemoderivados transmisores · filtros de diálisis (hepatitis B/C, VIH) · restos anatómicos transmisores · animales infectados · residuos de pacientes en aislamiento.</p>"}, {"t": "GRUPO IV · Citotóxicos", "p": "<p>Medicamentos <b>citotóxicos y citostáticos</b> y material en contacto.</p>"}, {"t": "GRUPO V · Químicos", "p": "<p><b>Peligrosos</b>: químicos con sustancias peligrosas + <b>mercurio de amalgamas dentales</b>. <b>No peligrosos</b>: sin sustancias peligrosas, medicamentos no citotóxicos.</p>"}, {"t": "GRUPOS VI–VIII", "p": "<p><b>VI</b> peligrosos no específicos (aceites industriales, baterías). <b>VII</b> anatómicos humanos (normativa mortuoria). <b>VIII</b> radiactivos (normativa radiactiva).</p>"}]}, {"t": "2 · Operaciones, recipientes y almacenaje", "cards": [{"t": "Operaciones internas", "p": "<p>Segregar, acumular, identificar y codificar <b>en origen</b>; EPIs; evitar manipulaciones que aumenten infección/peligrosidad; responsable de organización y supervisión que colabora con la inspección.</p>"}, {"t": "Segregación", "p": "<p>PROHIBIDO mezclar o diluir residuos de <b>diferentes grupos</b> ni de distintos tipos del mismo grupo.</p><p>II, III y IV: recipientes exclusivos <b>en el lugar de producción</b>. III y IV: acumular lo antes posible (<b>inmediata</b> punzantes). V: separados por tipo · peligrosos por <b>compatibilidad química</b>.</p>"}, {"t": "Recipientes", "p": "<p><b>II:</b> sin señalizar, un solo uso, opacos e impermeables. <b>III y IV:</b> un solo uso, rígidos, <b>estanqueidad total</b>, opacos, resistentes, sin punzantes en el exterior, máx. <b>70 L</b>, cierre hermético sin reapertura, señalizados («riesgo de infección» / «citotóxico»). <b>V peligrosos:</b> régimen de residuos peligrosos.</p>"}, {"t": "Almacenamiento: periodos", "p": "<table><tr><th>Alcance</th><th>Tiempo</th></tr><tr><td>Intermedio (hasta almacén)</td><td><b>12 h</b></td></tr><tr><td>III ≥ 3 t/año</td><td><b>72 h</b> · <b>1 sem</b> refrigerado ≤4 ºC</td></tr><tr><td>III < 3 t/año</td><td><b>1 sem</b> · <b>2 sem</b> refrigerado</td></tr><tr><td>Cortantes</td><td><b>Mensual</b> ≥3 kg/mes · <b>trimestral</b> <3 kg</td></tr><tr><td>Resto peligrosos</td><td><b>6 meses</b></td></tr></table><span class=\"r\">Prohibido almacenar peligrosos fuera de los locales habilitados.</span>"}, {"t": "Incidentes y archivo cronológico", "p": "<p>III y IV: protocolos de actuación, sistema de comunicación, <b>registro documental de incidencias</b>.</p><p>Productores de <b>peligrosos</b>: archivo cronológico (cantidad, naturaleza, origen, destino, tratamiento, transporte, frecuencia) guardado <b>≥ 3 años</b>.</p>"}, {"t": "Recogida y transporte", "p": "<p>Estanqueidad, seguridad, higiene y asepsia · <span class=\"r\">prohibido trasvase de peligrosos entre contenedores</span> · I y II como residuos domésticos · transportistas <b>registrados</b> · documento de identificación.</p>"}]}, {"t": "3 · Tratamiento de residuos sanitarios", "cards": [{"t": "Por grupo", "p": "<table><tr><th>Grupo</th><th>Tratamiento</th></tr><tr><td><b>III</b></td><td>Incineración o <b>autoclave + trituración</b> irreconocible</td></tr><tr><td><b>Priones (CJK)</b></td><td>Solo incineración</td></tr><tr><td><b>IV</b></td><td>Neutralización química o incineración total</td></tr><tr><td><b>V y VI</b></td><td>Según naturaleza · <span class=\"r\">prohibida incineración de mercurio de amalgamas</span></td></tr></table>"}, {"t": "Requisitos de la autoclave", "p": "<p>Eliminar vegetativas, micobacterias, hongos, virus y esporas de <i>Bacillus anthracis</i> · aire extraído en varias fases (mín. <b>2 fases vacío-vapor</b>) · filtración en la salida · <b>llenado < 2/3</b> · medir presión, temperatura y tiempos · pruebas con <i>Bacillus stearothermophilus</i> · registros <b>≥ 3 años</b> · sin manipulación previa.</p>"}, {"t": "Jerarquía", "p": "<p>Se aplica la jerarquía de residuos del <b>art. 8 de la Ley 22/2011</b> (hoy Ley 7/2022).</p>"}, {"t": "Ley 7/2022 · Definiciones I", "p": "<p><b>Residuo</b>: material que se desecha. <b>Recogida</b>: acopio + clasificación inicial profesionales. <b>Recogida separada</b>: flujo separado por tipo. <b>Gestión</b>: recogida, transporte, valorización y eliminación. <b>Valorización</b>: el residuo sustituye a otros materiales. <b>Reciclado</b>: transformación en productos (no energética ni relleno). <b>Preparación para reutilización</b>: comprobación, limpieza o reparación.</p>"}, {"t": "Definiciones II", "p": "<p><b>Domésticos</b>: hogares + similares (aceite cocina, RAEE, textil, pilas, muebles, escombros, limpieza de vías, animales muertos, vehículos abandonados). <b>Municipales</b>: mezclados + recogida separada doméstica; <span class=\"r\">NO</span> producción, agricultura, pesca, fosas, lodos, RCD ni vehículos. <b>Peligroso</b>: Anexo II. <b>Biorresiduo</b>: biodegradable. <b>Basura dispersa</b>: abandonada. <b>Compost</b>: higienizado y estabilizado (aerobio termófilo). <b>Punto limpio</b>: instalación local de almacenamiento de residuos separados.</p>"}, {"t": "Definiciones III", "p": "<p><b>Productor</b>: quien produce o cambia la naturaleza; el <b>titular catastral</b> responde de la basura dispersa salvo que se identifique al autor. <b>Poseedor</b>: productor u otra persona. <b>Negociante</b>: compra/vende residuos. <b>Agente</b>: organiza valorización por terceros. <b>RAP</b> (responsabilidad ampliada del productor). <b>Plástico biodegradable</b>: se descompone en CO₂, biomasa y agua. <b>Plástico oxodegradable</b>: se fragmenta en microfragmentos (cuestionado). <b>Plástico de un solo uso</b>.</p>"}, {"t": "Ámbito (art. 2)", "p": "<p>Aplica:</p><p>Todos los residuos + plásticos de un solo uso del Anexo IV + suelos contaminados.</p><p>NO aplica:</p><p>Emisiones atmosféricas, suelos excavados no contaminados, radiactivos, explosivos, cadáveres (UE 1069/2009), minería, materia fecal agrícola, piensos.</p>"}]}, {"t": "4 · Ley 7/2022: protección y plazos", "cards": [{"t": "Art. 7 · Protección", "p": "<p>Sin riesgo para el agua, aire, suelo, fauna ni flora · sin ruidos, olores ni humos · sin perjuicio a paisajes y espacios protegidos · coherente con el cambio climático y la salud pública.</p>"}, {"t": "Art. 8 · Jerarquía", "p": "<p>① <b>Prevención</b> ② <b>Preparación para la reutilización</b> ③ <b>Reciclado</b> ④ <b>Otra valorización</b> (incl. energética) ⑤ <b>Eliminación</b>. Otro orden si el mejor resultado ambiental global lo justifica por <b>enfoque de ciclo de vida</b>.</p>"}, {"t": "Art. 25 · Recogida separada", "p": "<p>Prohibido incinerar o depositar en vertedero los residuos recogidos separadamente.</p><table><tr><th>Flujo</th><th>Plazo</th></tr><tr><td>Papel, metales, plástico, vidrio</td><td>Recogida separada estable</td></tr><tr><td><b>Biorresiduos</b> >5.000 hab</td><td><b>30-06-2022</b></td></tr><tr><td><b>Biorresiduos</b> resto</td><td><b>31-12-2023</b></td></tr><tr><td>Textiles · aceite de cocina · domésticos peligrosos · voluminosos</td><td><b>31-12-2024</b></td></tr><tr><td>Aceite de cocina (comerciales/industriales)</td><td><b>30-06-2022</b></td></tr></table><p><b>Impropios en biorresiduos:</b><b>20 %</b> (2022) → <b>15 %</b> (2027). <b>2035:</b> ≥ <b>50 %</b> de municipales recogido separadamente. Modelos eficientes: <b>puerta a puerta</b> y <b>contenedores cerrados/inteligentes</b>.</p>"}, {"t": "Anexo I · Características HP", "p": "<p><b>HP1 Explosivo · HP2 Comburente · HP3 Inflamable</b> (p. infl. <60 ºC) · <b>HP4 Irritante</b> · <b>HP5 STOT/aspiración</b> · <b>HP6 Toxicidad aguda</b> · <b>HP7 Carcinógeno</b> · <b>HP8 Corrosivo</b> · <b>HP9 Infeccioso</b> · <b>HP10 Reprotox</b> · <b>HP11 Mutagénico</b> · <b>HP12 Gas tóxico agudo</b> · <b>HP13 Sensibilizante</b> · <b>HP14 Ecotóxico</b>.</p>"}, {"t": "Anexo IV · Plásticos de un solo uso", "p": "<table><tr><th>Medida</th><th>Productos</th></tr><tr><td><b>Reducción</b></td><td>Vasos · recipientes comida consumo inmediato</td></tr><tr><td><b>Restricción mercado</b></td><td>Bastoncillos, cubiertos, platos, pajitas, agitadores, palitos de globos, EPS (poliestireno expandido)</td></tr><tr><td><b>Ecodiseño</b></td><td>Botellas ≤ 3 L (tapas ancladas)</td></tr><tr><td><b>Marcado</b></td><td>Compresas/tampones, toallitas húmedas, tabaco con filtro, vasos</td></tr><tr><td><b>Recogida separada</b></td><td>Botellas ≤ 3 L</td></tr><tr><td><b>RAP</b></td><td>Recipientes, envases flexibles, botellas, vasos, <b>bolsas ligeras</b>; toallitas, globos, tabaco</td></tr></table>"}]}, {"t": "5 · Contenedor amarillo y azul", "cards": [{"t": "AMARILLO · envases", "p": "<p>Entra:</p><p>Plástico (botellas, tapas, bolsas <b>excepto las de basura</b>, tarrinas, tubos pasta, bandejas corcho blanco) · metales (latas, aerosoles, papel alu, bandejas) · <b>briks</b> · envases cerámica y madera.</p><p>No:</p><p>Juguetes y biberones, utensilios/cubos, vasos de papel de cafetería, tupper, Pringles, cápsulas de café, termos, CDs/casetes, bolígrafos, mecheros, envases de medicamentos.</p><p><b>6 briks = caja de zapatos · 40 botellas = forro polar · 80 latas = llanta · 22 botellas = camiseta.</b></p>"}, {"t": "AZUL · papel y cartón", "p": "<p>Entra:</p><p>Envases alimentación, cajas de calzado y cereal, congelados, papel de envolver y de uso diario. Dóblalo y comprímelo. <b>80 %</b> de hogares recicladores.</p><p>No:</p><p>Brik (→ amarillo) · servilletas y papeles con aceite (→ orgánico) · pañales y compresas (→ restos).</p>"}, {"t": "Reciclaje del papel", "p": "<p>① Pastificar con disolventes ② Separar impurezas + centrifugar ③ Lavar y <b>quitar la tinta con burbujas de aire</b> ④ Blanquear (peróxido de H o hidrosulfito).</p><p>El papel recicla hasta 7 veces.</p>"}]}, {"t": "6 · Contenedor verde, marrón y gris", "cards": [{"t": "VERDE · vidrio", "p": "<p>Iglú; 1 contenedor por 213 hab; el primero en España: <b>Barcelona 1982</b>; gestión <b>Ecovidrio</b>.</p><p>Entra:</p><p>Botellas, frascos de perfume/cremas, tarros de alimentos.</p><p>No (cristal → punto limpio):</p><p>Bombillas, espejos, ceniceros, vasos y vajillas.</p><p><b>Proceso:</b> quitar impurezas → separador magnético → clasificar con chorros de agua → <b>triturar → calcín</b>. Reciclable <b>infinitamente</b>.</p>"}, {"t": "MARRÓN · orgánico", "p": "<p>Entra:</p><p>Pieles y fruta, espinas, plantas, cáscaras de huevo, posos de café/té, <b>servilletas y papel de cocina usados</b>.</p><p>No:</p><p>Cerámica, pañales, colillas, chicles, toallitas, arena, pelo, polvo.</p><p><b>Compost:</b> fermentado con materias minerales; con O₂ = compost, sin O₂ = turba. <b>4–6 meses</b> hasta compost listo. Pioneras: Euskadi, Navarra, Cataluña, Madrid. >40 % de la basura es biorresiduo aprovechable.</p>"}, {"t": "GRIS · restos", "p": "<p>No reciclables ni compostables → vertedero o <b>relleno sanitario</b> (suelo impermeabilizado, capas compactadas).</p><p>Entra:</p><p>Pañuelos, juguetes, biberones, utensilios, cerámica, pañales, arena, pelo, colillas.</p><p>No:</p><p>Orgánicos (→ marrón) · pilas, muebles, espejos, aparatos (→ punto limpio) · fármacos (→ farmacia).</p>"}]}, {"t": "7 · Punto limpio y aceite usado", "cards": [{"t": "Punto limpio", "p": "<p>Recoge y almacena temporalmente residuos que <b>por tamaño o peligrosidad</b> no caben en contenedores. Solo <b>particulares</b>, <b>sin coste</b>.</p><p><b>Tipos:</b> fijos · mini puntos de barrio · <b>móviles</b> (vehículos).</p><p><b>Requisitos:</b> fácil acceso, buen estado, contenedores identificados, técnico informador. RAEE (RD 110/2015): priorizar reutilización, almacenar etiquetado, <b>báscula</b> y <b>justificante</b>.</p>"}, {"t": "Qué se lleva", "p": "<p>Pilas, baterías, electrodomésticos, móviles, PCs, CDs, pinturas, escombros, aceites, fluorescentes, aerosoles, químicos, medicamentos, muebles, chatarra, colchones, termómetros, radiografías, espejos, cartuchos.</p>"}, {"t": "Qué NO", "p": "<p>Orgánicos · radiactivos · infecciosos · neumáticos · explosivos · sin identificar.</p>"}, {"t": "Datos España", "p": "<p><b>1.739 puntos fijos</b> + <b>189 móviles</b> · ratio <b>24.445 hab/punto</b> · mayor flujo por peso: <b>escombros</b>. Más puntos: Cataluña y Castilla-La Mancha.</p>"}, {"t": "Aceite usado (ECOGIDA)", "p": "<p>El aceite por el fregadero contamina las aguas y encarece depuradoras.</p><p>Recogida de gestores autorizados en <b>restaurantes, comedores, bares, churrerías</b> y contenedores municipales.</p><p><b>Destino:</b> fabricación de <b>biodiésel</b> · en casa, <b>jabón</b>.</p>"}]}, {"t": "8 · Contaminación y alternativas ecológicas", "cards": [{"t": "Problemas ambientales (hostelería)", "p": "<p><b>Grupo I (aire):</b> CFC y halones → <b>capa de ozono</b> · CO₂, CO, NOₓ, COV → <b>cambio climático</b> y smog · SO₂ → <b>lluvia ácida</b>.</p><p><b>Grupo II (agua):</b> fósforo y nitrógeno → <b>eutrofización</b> · tóxicos y patógenos en aguas residuales.</p>"}, {"t": "Reciclaje de materiales", "p": "<p>Recupera solo el <b>5 %</b> de la energía original. Papel 5–7 usos · plástico (CCI, mucha agua) · vidrio → calcín, infinito · <b>aluminio</b> 100 % reciclable, funde a 660 ºC · chatarra a altos hornos.</p>"}, {"t": "Alternativas ecológicas", "p": "<p><b>Vinagre blanco</b>: desinfecta y disuelve cal (no mármol). <b>Bicarbonato</b>: desodoriza, blanquea, desengrasa. <b>Lavandina</b>: blanquea. <b>Limón</b>: desengrasante, desinfectante. <b>Jabón de Marsella</b>: biodegradable. Reducir dosis, reutilizar enjuagues, sustituir cloro por <b>agua oxigenada</b>.</p>"}, {"t": "Tipos de contaminación", "p": "<p><b>Física</b> (ruido, calor, luz, radiaciones, radiactividad) · <b>Química</b> (productos, concentraciones alteradas) · <b>Biológica</b> (virus, bacterias, hongos, protozoos, helmintos; riesgo principal en alimentación; <b>bioaerosoles</b>).</p>"}, {"t": "Aire · cambio climático · ozono", "p": "<p>Composición: N₂ 78 %, O₂ 21 %, CO₂ 0,03 %. Contaminantes: CO, CO₂, NOₓ, SO₂, partículas, COV, CFC. Cambio climático = gases de efecto invernadero → deshielo y subida de nivel del mar. Ozono <b>estratosférico</b> filtra las UV; los <b>CFC</b> lo destruyen (Protocolo de Montreal).</p>"}, {"t": "Suelo · acústica · lumínica", "p": "<p><b>Suelo:</b> tóxicos que pasan a la <b>cadena trófica</b>; pierde fertilidad. <b>Acústica:</b> oído soporta hasta <b>80 dB</b>; ><b>120 dB</b> = migrañas y sordera irreversible. <b>Lumínica:</b> exceso de luz artificial: afecta ecosistemas y sueño.</p>"}, {"t": "Agua y productos de limpieza", "p": "<p><b>DBO</b>: O₂ que consumen los microorganismos al degradar materia orgánica; <b>DQO</b>: medida química. DBO alta → agua con poco oxígeno. <b>Eutrofización</b>: exceso de nutrientes (fosfatos y nitratos). Los <b>fosfatos</b> de detergentes la provocan → sustituir por <b>zeolitas</b>.</p>"}]}], "ncards": 43}, {"key": "8", "num": "Tema 8", "name": "Manipulación de alimentos", "hue": "#1286c8", "sections": [{"t": "1 · Alteración y contaminación", "cards": [{"t": "Alterado vs contaminado", "p": "<p><b>Alterado</b>: deterioro del valor nutritivo y organoléptico (olor, color, sabor) por causas naturales o mala manipulación → <span class=\"h\">apto para el consumo</span>. Se detecta con los sentidos. Causas: falta de higiene y conservación inadecuada (altas temperaturas, suciedad, humedad).</p><p><b>Contaminado</b>: contiene microorganismos peligrosos/toxinas (microbiológica) o sustancias tóxicas (química). <span class=\"r\">NO se detecta a simple vista → más peligroso.</span></p>"}, {"t": "Microorganismos", "p": "<p>Seres vivos unicelulares visibles solo con microscopio. Tipos: <b>virus, bacterias, protozoos, hongos</b> (levaduras = unicelulares; mohos = pluricelulares). Sin microorganismos solo el <b>material estéril</b>.</p>"}, {"t": "Clases de microorganismos", "p": "<p><span class=\"v\">Beneficiosos</span>: necesarios (yogur → <i>Lactobacillus</i>). <span class=\"h\">No patógenos o comensales</span>: alteran sin enfermar. <span class=\"r\">Patógenos</span>: enferman antes de la alteración visible.</p>"}, {"t": "ToxiINfección / INtoxicación", "p": "<p><b>Toxiinfección</b>: microorganismo está en el alimento, se ingiere y se multiplica <b>dentro del cuerpo</b>. <b>Intoxicación</b>: el microorganismo crece <b>en el alimento antes</b> de consumirlo y libera toxinas.</p>"}, {"t": "Fuentes de contaminación", "p": "<p>Manos sin lavar (agua caliente + jabón; tras el servicio) · tos/estornudos · heridas infectadas · ropa y utensilios sucios · almacenes sin limpieza/DDD · <b>agua no potable</b> · insectos y roedores.</p>"}, {"t": "Crecimiento bacteriano", "p": "<p><b>Temp:</b> óptimo ≈ <b>37 ºC</b>; frío retrasa/paraliza; calor elimina. <b>Humedad:</b> más agua = más gérmenes (secas: legumbres, aceite, leche en polvo, bacalao salado). <b>pH:</b> neutro = 7; gérmenes crecen cerca de 7; <b>mohos</b> pH 3–4 (tomate, cítricos); <b>bacterias</b> en neutro (leche, carne, pescado). <b>Nutrientes:</b> hongos → azúcares (frutas, pasteles); bacterias → proteínas (carne, huevos, leche).</p>"}, {"t": "Tóxicos químicos", "p": "<p>Naturales (setas tóxicas) o externos (almacenamiento, pesticidas, mala higiene). <span class=\"r\">Aflatoxinas/micotoxinas</span> (mohos; cereales, cacao, frutos secos; cancerígenas) · <span class=\"r\">Dioxinas</span> (ahumados y altas temperaturas; cancerígenas) · <span class=\"r\">Nitrosaminas</span> (embutidos con nitritos; OK a dosis permitidas) · <span class=\"r\">Pesticidas</span> (fruta/hortaliza sin lavar) · <span class=\"r\">Metales</span> (plomo en latas y conducciones; mercurio en pesticidas).</p>"}]}, {"t": "2 · Conservación de alimentos", "cards": [{"t": "Ventajas", "p": "<p>Económicas (excedentes/déficit) · Nutritivas (todo el año, sin pérdida) · Sanitarias (menos infecciones).</p>"}, {"t": "Por CALOR", "p": "<table><tr><th>Método</th><th>Temp · tiempo</th></tr><tr><td><b>Pasteurización</b></td><td>75–90 ºC · segundos → elimina patógenos; leche en bolsa, refrigerar</td></tr><tr><td><b>Esterilización</b></td><td><b>120 ºC · 20 min</b> → todos; conservas, ambiente</td></tr><tr><td><b>Uperización UHT</b></td><td><b>140 ºC · 2 s</b> → todos; leche brick, meses</td></tr></table>"}, {"t": "Por FRÍO", "p": "<p><b>Refrigeración</b> 2–8 ºC · <b>Congelación</b> ≤ <b>−18 ºC</b> (rápida; a −10 ºC se paraliza todo; verduras: escaldado previo; grasas pueden enranciarse; <span class=\"r\">no recongelar descongelado</span>) · <b>Ultracongelación</b> −35 a <b>−150 ºC</b> breve.</p>"}, {"t": "Eliminando AGUA", "p": "<p><b>Secado</b> (aromáticas, especias) · <b>Concentración</b> (zumos) · <b>Liofilización</b> (congelación rápida + sublimación a baja presión; verduras, carnes).</p>"}, {"t": "Por ADITIVOS", "p": "<p><b>Vinagre</b> (pH bajo) · <b>Azúcar</b> (concentración alta) · <b>Salazón</b> (retira agua) · <b>Ahumado</b> (sustancias conservantes + secado) · <b>Conservantes autorizados</b> (inocuos en las concentraciones legales).</p>"}, {"t": "Por IRRADIACIÓN", "p": "<p>Radiaciones ionizantes (<b>rayos X o gamma</b>) destruyen gérmenes.</p>"}, {"t": "Tipos de enfermedades", "p": "<p>Víricas (hepatitis A, Norwalk) · bacterianas (salmonelosis, carbunco, TBC, cólera) · parasitarias (triquinelosis, toxoplasmosis, hidatidosis) · metales (Pb, Hg) · plaguicidas/fertilizantes · toxiinfecciones · Creutzfeldt-Jakob (vacas locas).</p>"}, {"t": "SALMONELOSIS", "p": "<p>«Salmonella» en intestino. Huevos y <b>huevo crudo</b> (mayonesas, cremas, salsas), carnes poco hechas, natas. Incubación <b>12–36 h</b>: vómitos, dolor abdominal, diarrea, fiebre. Mortal en niños/ancianos. <span class=\"r\">Mayonesas caseras PROHIBIDAS en comedores colectivos.</span></p>"}, {"t": "CAMPYLOBACTER", "p": "<p>Huevos y carne; cualquier alimento contaminado por heces. <b>Más frecuente y más grave</b> que la salmonelosis. Dolor muscular, diarrea, vómitos, fiebre; deja <b>portador sano</b>.</p>"}, {"t": "BOTULISMO", "p": "<p><i>Clostridium botulinum</i> (tierra, polvo), sin O₂ → toxina, <b>veneno natural más potente</b>; termolábil. <span class=\"r\">Conservas caseras peligrosas</span>, embutidos, envasados sin O₂. 12–36 h: síntomas <b>nerviosos</b>: visión borrosa, pupilas dilatadas, parálisis respiratoria.</p>"}]}, {"t": "3 · Enfermedades y prevención", "cards": [{"t": "INTOXICACIÓN ESTAFILOCÓCICA", "p": "<p><i>Staph. aureus</i> en piel, fosas nasales, heridas y granos del manipulador → llega por manos/tos/estornudos. Toxina <b>resistente al calor</b>. Salsas, natas, cremas pasteleras. Vómitos, diarrea, dolor abdominal <span class=\"r\">SIN fiebre</span>.</p>"}, {"t": "E. COLI", "p": "<p>En intestino de animales y hombre → su presencia = <b>contaminación fecal</b>. Prevención: <span class=\"h\">lavarse las manos al trabajar, especialmente tras el servicio.</span></p>"}, {"t": "HIDATIDOSIS", "p": "<p>Gusano plano en intestino del <b>perro</b>; huevos en heces → <b>quiste hidatídico</b>. Verduras crudas mal lavadas (agua de riego), manos, agua contaminada.</p>"}, {"t": "BRUCELOSIS (fiebre de Malta)", "p": "<p><i>Brucella</i> por <b>leche cruda y quesos frescos caseros</b>. Tras curación larga, los quesos no transmiten. <span class=\"r\">Quesos frescos caseros MUY peligrosos.</span></p>"}, {"t": "TRIQUINELOSIS y TBC", "p": "<p><b>Triquinelosis</b>: parásito en musculatura de cerdo, jabalí, caballo; matanzas domiciliarias (análisis). <span class=\"r\">Chacinas de matanzas domiciliarias: no vender.</span><b>Tuberculosis</b>: leche cruda o productos. <span class=\"r\">La leche nunca debe tomarse cruda.</span></p>"}, {"t": "Alimentos implicados", "p": "<p><b>Leche</b>: TBC, brucelosis, salmonelosis, hep. A, estafilococia, enterovirosis. <b>Carne</b>: botulismo, Campylobacter, carbunco, brucelosis, estafilocócica, <i>C. perfringens</i>, TBC, hep. A, toxoplasmosis, triquinelosis, teniasis. <b>Pescado/marisco</b>: gastroenteritis, botulismo, <i>C. perfringens</i>, estafilo, salmonelosis, micobacteriosis, hep. A, anisakiasis, ictiotoxismo. <b>Huevos</b>: estafilo, salmonelosis, pasterelosis. <b>Vegetales</b>: botulismo, colibacilosis, pasterelosis, hidatidosis. <b>Agua</b>: salmonelosis, cólera, leptospirosis, hep. A, disentería amebiana, ascaridiasis.</p>"}, {"t": "Medidas preventivas", "p": "<p>Control e inspección de la Administración (<b>Facultativos de Salud Pública</b>) · autocontrol sanitario del establecimiento · medidas del manipulador: higiene personal, deberes, formación, responsabilidad sobre la salud.</p>"}]}, {"t": "4 · Instalaciones y suministros", "cards": [{"t": "Superficies", "p": "<p><span class=\"v\">Lisos, impermeables, fácilmente lavables</span> (aluminio, acero inoxidable). <span class=\"r\">NO madera</span> (acumula suciedad y gérmenes). Materiales <b>no tóxicos</b>. Buen estado de conservación.</p>"}, {"t": "Locales", "p": "<p>Dimensiones suficientes; <b>separados de viviendas, comedores, dormitorios</b>; pisos con pendiente a sumideros; luz eléctrica protegida; <b>aparatos antiinsectos</b> en entradas y salidas; ventanas con mallas y mosquiteras; ventilación natural o mecánica; <b>agua potable fría y caliente</b>; servicios y vestuarios separados sin comunicación directa.</p>"}, {"t": "Maquinaria y equipos", "p": "<p>Lisa, impermeable, fácil limpieza; materiales no tóxicos, no alterables por los productos, sin olores/sabores; separados de suelo y paredes; <b>desmontables</b>; almacenados limpios y protegidos; <b>motores fuera</b> de las zonas de alimentos.</p>"}, {"t": "Agua", "p": "<p><b>Potable</b> siempre. Red pública → certificado del <b>Ayuntamiento</b>. Pozo → analítica inicial + equipo de desinfección (N.º registro sanitario). Tomas de agua fría y caliente + <b>lavamanos de accionamiento no manual</b>.</p>"}, {"t": "Residuos", "p": "<p>Contenedores con <b>tapa permanente</b>, retirados al finalizar la jornada · plásticos, limpios y desinfectados · local específico sin insectos ni roedores · retirada periódica.</p>"}, {"t": "Recepción", "p": "<p>Vehículos exclusivos, lisos e impermeables, limpios y desinfectados; temperatura adecuada; alimentos <b>etiquetados</b>; descarga sin arrastre ni contacto con el suelo. <span class=\"r\">Rechazo</span> si transporte incorrecto, sin etiqueta o frescura inadecuada.</p>"}, {"t": "Almacenamiento", "p": "<p>Locales específicos a <b>temperatura y humedad adecuadas</b>; sin contacto entre alimentos ni con el suelo. <b>Incompatibilidades en refrigeración</b> (salvo envasados): materias primas/elaborados; animal/vegetal; y entre lácteos, huevos, aves, caza, canales, pescados, équidos y tripas. <b>En congelación</b>: carne de caballo, pescados, caza, despojos y tripas. <b>Rotación</b> de productos; retirar caducados.</p>"}, {"t": "Preparación y transporte", "p": "<p><b>Preparación:</b> riesgo por superficies, útiles, manos y ropa; locales limpios y desinfectados. <b>Transporte:</b> superficies lisas e impermeables con <b>desagües</b>; limpieza tras cada servicio; nunca otros productos; temperatura adecuada + termómetro; no transportar incompatibles ni mezclar alimentos y no alimenticios sin separación efectiva; sin retrasos.</p>"}]}, {"t": "5 · Higiene personal", "cards": [{"t": "El manipulador", "p": "<p>Principal responsable de intoxicaciones/toxiinfecciones por manipulación incorrecta. Riesgos: a) padecer enfermedad, b) ser <b>portador</b> (elimina gérmenes estando sano), c) <b>intermediario</b>. Los gérmenes viven en intestino (heces), salen por orina, tos, saliva y heridas.</p>"}, {"t": "Vías de transmisión", "p": "<p>Directa (hablar/toser/estornudar) · <b>manos</b> (¡tras el servicio!) · polvo · agua · insectos y roedores · animales de compañía · utensilios mal lavados · <b>cubos de fregar y de basura</b> (lavado profundo y desinfección diaria).</p>"}, {"t": "Lavado de manos", "p": "<p>Agua <b>caliente</b> (abre poros) → enjabonar y <b>frotar 15 segundos</b> hasta espuma → aclarar con <b>agua fría</b> (cierra poros) → secar con <b>toallas de papel desechables</b>. Al iniciar la jornada, tras el servicio y al cambiar de tarea.</p>"}, {"t": "Aseo, uñas y adornos", "p": "<p>Buen aseo personal. <b>Uñas cortas y limpias, sin esmalte</b> (puede caer al alimento). <span class=\"r\">Sin anillos ni relojes</span> (suciedad y riesgo de caerse).</p>"}, {"t": "Heridas", "p": "<p>Fuente importantísima (sangre, pus, gérmenes). <span class=\"r\">No basta el vendaje</span>: proteger con <b>guantes de látex</b>.</p>"}, {"t": "Ropa y gorro", "p": "<p>Ropa <b>exclusiva de trabajo, color claro</b> (se ven manchas), siempre limpia, nunca a la calle; nadie con ropa de calle junto a los alimentos. <b>Gorro</b> (redecilla si pelo largo).</p>"}, {"t": "Prohibiciones", "p": "<p><span class=\"r\">No fumar, no comer, no beber, no chicle</span> (migas y saliva). Tos/estornudos: <b>pañuelo de un solo uso o mascarilla</b>; lavarse manos; <b>vitrinas</b> para alimentos sensibles. Descanso para comer/servicio: fuera del puesto.</p>"}, {"t": "Limpieza y D.D.D.", "p": "<p>Utensilios siempre limpios (obligatorio al final de jornada). Barrer/fregar contaminan → con aspiradora mejor y <b>sin alimentos cerca</b>. Productos de limpieza en <b>armario con llave</b>. Agua <b>clorada</b> o de red pública; ensaladas: gotas de <b>lejía alimentaria</b>. Insecticidas en aerosol <span class=\"r\">PROHIBIDOS</span>. <b>D.D.D.</b> (desinfección, desinsectación, desratización) periódicas. <span class=\"r\">No animales de compañía</span> (ni enjaulados).</p>"}, {"t": "Separación, cámaras, fechas", "p": "<p>Separar alimentos (<b>recipientes estancos</b>). Cámaras: controlar temperatura, líneas de llenado máximo, estiba, sin contacto con paredes/techos. <span class=\"r\">Nunca</span> vender o usar producto con <b>fecha superada</b>; leer etiquetado.</p>"}]}, {"t": "6 · APPCC · prerrequisitos", "cards": [{"t": "APPCC", "p": "<p><b>Análisis de Peligros y Puntos de Control Crítico</b>: identifica, evalúa y previene peligros físicos, químicos y biológicos en todas las etapas. Objetivo: alimentos seguros. <b>Obligatorio</b> (Reglamento 852/2004) en grandes y pequeños establecimientos. GPCH: guías de prácticas correctas, uso <b>voluntario</b>.</p>"}, {"t": "Dos fases", "p": "<p>① <b>Prerrequisitos</b> (status sanitario mínimo) ② <b>7 principios</b> (peligros y PCC). Todo documentado, archivado y con registros: ¿qué? ¿cómo? ¿cuándo? ¿dónde? ¿en qué registro? ¿quién?</p>"}, {"t": "8 prerrequisitos", "p": "<p>① Limpieza y desinfección ② Control de plagas ③ Mantenimiento de instalaciones, equipos y útiles ④ <b>Formación del personal</b> (inicial + continuada, adaptada al puesto y nivel cultural) ⑤ Control del agua (cloro y pH, plan de potabilidad) ⑥ Eliminación de subproductos y residuos ⑦ Control de proveedores (homologación, NRGSA) ⑧ <b>Trazabilidad</b> (Reglamento 178/2002: hacia atrás = proveedores, hacia delante = clientes, de proceso = lotes).</p>"}, {"t": "Limpieza vs desinfección", "p": "<p><b>Limpieza</b> = eliminar suciedad con agua y detergente. <b>Desinfección</b> = destruir gérmenes con productos específicos. Pasos: ① Acondicionamiento en seco ② Prelavado ③ Lavado con detergente ④ <b>Cepillado</b> ⑤ Aclarado ⑥ Desinfección ⑦ Aclarado final. Verificación diaria + registro.</p>"}, {"t": "Desinsectación", "p": "<p>Métodos <b>pasivos</b>: evitar focos; construcción sin grietas; sifones; mosquiteras, cortinas de lamas, ventiladores; <b>atrapainsectos eléctricos</b> (UV + electrocución); inspección de materias primas y rincones. Métodos <b>activos</b>: <b>empresa autorizada de control de plagas</b> (diagnóstico + tratamientos certificados y registrados). <span class=\"r\">Aerosoles automáticos prohibidos.</span></p>"}, {"t": "Desratización", "p": "<p>Pasivos: eliminar puntos de atracción; sin grietas; desagües con sifones y rejillas; puertas hasta el suelo con chapa; inspecciones (huellas, pelos, deyecciones); <b>ultrasonidos</b>. Activos: empresa autorizada; <span class=\"r\">nadie del personal usa raticidas por su cuenta.</span></p>"}, {"t": "Otros programas", "p": "<p><b>Mantenimiento</b>: plano de instalaciones + especificaciones técnicas + periodicidad + registro. <b>Subproductos animales</b>: 3 categorías, no al contenedor → planta de tratamiento (cat. 3 puede ir a mascotas). <b>Proveedores</b>: solo autorizados sanitariamente (NRGSA), plan de autocontrol, albaranes archivados.</p>"}]}, {"t": "7 · Los 7 principios APPCC", "cards": [{"t": "1 · Análisis de peligros", "p": "<p>Con <b>diagrama de flujo</b> por producto: identificar peligros físicos, químicos y biológicos de cada etapa + medidas preventivas. Solo los peligrosos para el consumidor.</p>"}, {"t": "2 · Identificar PCC", "p": "<p><b>Índice de criticidad</b> = probabilidad + severidad + persistencia. <b>Árbol de decisión</b> (secuencia de preguntas). <b>PCC</b> = punto/operación/etapa que requiere control eficaz. Ni demasiados ni demasiado escasos.</p>"}, {"t": "3 · Límites críticos", "p": "<p>Parámetro <b>medible</b> (temperatura, concentración…). Fuera de límite = <b>desviación</b> = proceso fuera de control → producto peligroso.</p>"}, {"t": "4 · Vigilancia", "p": "<p>Acciones para saber si el proceso está bajo control; <b>frecuencias</b> y responsable por cada PCC.</p>"}, {"t": "5 · Medidas correctoras", "p": "<p>Cuando la vigilancia detecta un PCC fuera de control; especificar <b>responsable</b>; vuelven el proceso a la normalidad.</p>"}, {"t": "6 · Verificación", "p": "<p>Confirmar que el sistema APPCC funciona e identifica y reduce todos los peligros significativos.</p>"}, {"t": "7 · Registro", "p": "<p>Documentos y hojas de control <b>firmados</b> por el responsable. Lo importante: que sean <b>verdaderos</b> y que al desviarse se tomen medidas. Las inspecciones sanitarias se basan en la <b>supervisión de los registros</b>.</p>"}]}, {"t": "8 · Colectividades (bares, restaurantes)", "cards": [{"t": "Diagrama de flujo", "p": "<p><b>Recepción</b> → <b>Almacenamiento</b> (ambiental / refrigeración / congelación) → <b>Preparación</b> (con descongelación si procede) → <b>Crudo o cocinado</b> → <b>Conservación</b> en frío o en caliente → <b>Servicio</b> directo o envasado y expedición.</p>"}, {"t": "Riesgos frecuentes", "p": "<p>Gérmenes de origen o transporte · químicos (pesticidas, clembuterol) y físicos (tierra) · contaminación durante la manipulación · <b>proliferación</b> en almacenamiento · supervivencia de gérmenes/parásitos al tratamiento · <b>compuestos polares en aceites</b> de fritura.</p>"}, {"t": "Medidas preventivas", "p": "<p>Cumplir las condiciones técnico-sanitarias legales · programa eficaz de limpieza y DDD · Guía de Buenas Prácticas de Manipulación · condiciones y límites por fase (temperaturas, frescura, proveedores).</p>"}, {"t": "Proveedores y transporte", "p": "<p>Solo proveedores <b>autorizados sanitariamente</b> (NRGSA) con plan de autocontrol + albarán archivado. Vehículos <b>exclusivos</b> e inspeccionados; <span class=\"r\">prohibidos particulares</span>; comprobar temperaturas.</p>"}, {"t": "Recepción", "p": "<p>Verificar frescura, temperatura, integridad de envases, etiquetado y marca sanitaria; albarán; etiqueta con razón social y domicilio (NRSA solo aceite/yogur); rápido a refrigeración/congelación; separar tóxicos; <span class=\"r\">rechazar estropeados</span>.</p>"}, {"t": "Almacenamiento", "p": "<p>Temperatura según etiqueta; fechas; <b>separación</b> para evitar contaminación cruzada; estiba con circulación de aire sin superar capacidad; envases cerrados; <b>rotación</b> por orden de recepción.</p>"}, {"t": "Descongelación", "p": "<p><span class=\"r\">En la cámara de refrigeración, NUNCA a temperatura ambiente</span>; sin goteos; completa antes de preparar; <span class=\"r\">no volver a congelar</span>; solo cantidad del día.</p>"}, {"t": "Preparación y emplatado", "p": "<p>Separar crudos y cocinados (utensilios diferentes o lavar/desinfectar); elaborar cerca del consumo; tiempo y temperatura suficientes; recalentar bien (<span class=\"r\">cuidado microondas</span>); controlar aceites de fritura; emplatar/envasar en el menor tiempo y extremando la higiene.</p>"}, {"t": "Cuadro de gestión", "p": "<p><b>PCC 1 Proveedores:</b> peligro biol./quím./fís.; límites: autorización + autocontrol + albarán; correctora: apercibimiento, rechazo, baja. <b>PCC 2 Transporte:</b> vehículo autorizado, limpio y desinfectado. <b>Recepción:</b> rechazar si fuera de límites; registro firmado. <b>Almacenamiento:</b> límites = temperaturas + fechas; retirar producto. <b>Descongelación:</b> límite tiempo/temperatura; rechazar producto. <b>Elaboración:</b> tiempos y temperaturas por producto; aceite = % compuestos polares.</p>"}]}], "ncards": 64}, {"key": "9", "num": "Tema 9", "name": "Conceptos básicos en la prevención de riesgos laborales", "hue": "#e0762b", "sections": [{"t": "1 · Protección y evaluación", "cards": [{"t": "Colectiva vs individual", "p": "<p><b>Protección colectiva</b>: protege frente a riesgos no evitables/reducibles y <span class=\"h\">simultáneamente a más de una persona</span> (barandillas, interruptor diferencial, ventilación general). <b>Protección individual</b>: protege <b>solo al trabajador</b> que la usa; se usa cuando el riesgo no se controla con medios colectivos ni con métodos de trabajo adecuados.</p>"}, {"t": "MPI: parciales e integrales", "p": "<p><b>Parciales</b>: actúan sobre puntos o zonas concretas (guantes, gorro). <b>Integrales</b>: no actúan sobre zonas determinadas (ropa de trabajo, prendas de señalización).</p>"}, {"t": "Evaluación: probabilidad", "p": "<p><b>Alta</b>: todos los días, siempre o casi siempre. <b>Media</b>: todas las semanas, algunas ocasiones. <b>Baja</b>: esporádicamente (una o pocas veces al año), raras veces.</p>"}, {"t": "Consecuencia y conceptos", "p": "<p>Consecuencia: partes del cuerpo y naturaleza del daño → <b>ligeramente dañino → dañino → extremadamente dañino</b>. Ficha por <b>cada categoría profesional</b>.</p><ul><li><b>Riesgo</b>: combinación de probabilidad y consecuencias de la materialización de un peligro</li><li><b>Peligro</b>: fuente/situación con capacidad de daño</li><li><b>U.R.G.</b>: instalaciones, máquinas, equipos, áreas, materiales y productos</li><li><b>Causas</b>: propiedad de un bien/material/servicio que ocasiona riesgo potencial</li><li><b>Medidas preventivas</b>: inventario de acciones → Planificación (tipo de medida, fecha de implantación y de comprobación)</li></ul>"}]}, {"t": "2 · Condiciones de seguridad", "cards": [{"t": "Caídas mismo plano", "p": "<p><b>Causas</b>: suelos sucios/resbaladizos, obstáculos, falta de iluminación, suelos irregulares. <b>Prevención</b>: suelos antideslizantes y limpiables, zonas libres de obstáculos, desengrasar derrames, separar zonas de maquinaria, iluminación, señalizar suelos mojados, calzado cerrado, caminar despacio, mantener la visión al cargar.</p>"}, {"t": "Caídas de altura", "p": "<p><b>Causas</b>: escaleras, altillos, almacenajes elevados, huecos, distintos niveles. <b>Prevención</b>: escaleras limpias/secas/señalizadas, <b>barandillas</b>, cubrir aberturas o barandillas con barras intermedias y <b>plintos</b>, escaleras fijas/móviles aseguradas o ascensores.</p>"}, {"t": "Cortes (utillaje)", "p": "<p>Fuentes: cuchillos, picadoras, batidoras, vidrio con bordes cortantes. Las lesiones vienen del <b>uso inapropiado, utillaje defectuoso y almacenamiento incorrecto</b>. Prevención: resguardos con enclavamiento, solo personal designado/adiestrado, mangos antideslizantes, cuchillos enfundados/afilados, EPIs, cortar en superficies adecuadas, vaciar papeleras sin manos.</p>"}, {"t": "Maquinaria", "p": "<p>Equipos seguros con <b>marcado CE</b>, resguardos móviles con enclavamiento, solo personal designado, uso según instrucciones y <b>solo para los trabajos diseñados</b>.</p>"}, {"t": "Quemaduras", "p": "<p>Causas: recipientes, freidoras, hornos, fogones, vapores. Prevención: <b>no llenar hasta arriba</b>, comprobar termostato, mangos hacia el interior, <b>cambio de aceite en frío</b>, avisar al transportar objetos calientes, EPIs con CE (manoplas, delantales), no calentar vajilla no apta.</p>"}, {"t": "Electricidad", "p": "<p><b>Directo</b> (partes activas) · <b>Indirecto</b> (masas bajo tensión) · <span class=\"h\">las más peligrosas son las de BAJA FRECUENCIA</span>. <b>Directo</b>: control visual, alejar cables, obstáculos, material aislante, <b>< 25 V</b>. <b>Indirecto</b>: puesta a tierra + <b>interruptor diferencial</b> + calzado de goma. Normas: no aparatos en mal estado, clavijas normalizadas, no tirar del cable, no ladrones, desconectar antes de limpiar, cartel de primeros auxilios.</p>"}]}, {"t": "3 · Almacenamiento y señalización", "cards": [{"t": "Almacenes generales", "p": "<p>Mercancía en <b>sentido vertical</b>, sin sobresalir, no apoyar en paredes estructurales, no deshacer montones desde arriba/abajo, no superar carga de seguridad, <b>calzar</b> lo que pueda rodar, pesados cerca del suelo, proteger de humedad y calor, inspección periódica.</p>"}, {"t": "Puestos y transporte", "p": "<p>Retirar lo no en uso; solo materia prima de la jornada; bastidores con niveles y tarimas; «cada cosa en su lugar». <b>Transporte</b>: equipos revisados; la <b>elevación manual de cargas</b> es una de las mayores causas de lesiones → minimizarla.</p>"}, {"t": "Señalización", "p": "<p>Se usa cuando <b>no se puede eliminar</b> el riesgo, ni proteger con protección colectiva, ni con EPI; y como <b>complemento</b>. Tipos: <b>prohibición, obligación, advertencia, salvamento, indicación, adicional/auxiliar</b> (solo texto, fondo blanco y texto negro, rectangular, debajo de la señal).</p>"}, {"t": "Colores de seguridad", "p": "<table><tr><td><b>ROJO</b></td><td>Parada, prohibición, lucha contra incendios</td></tr><tr><td><b>AMARILLO</b></td><td>Atención, zona de peligro</td></tr><tr><td><b>VERDE</b></td><td>Situación de seguridad, primeros auxilios</td></tr><tr><td><b>AZUL</b></td><td>Obligación, indicaciones</td></tr></table><p><b>Combinación</b>: rojo/contraste blanco/símbolo negro · amarillo/contraste negro/símbolo negro · verde y azul/contraste blanco/símbolo blanco.</p>"}, {"t": "Agentes químicos", "p": "<p>Productos del trabajo más numerosos y dañinos. <b>Prevención</b>: leer etiqueta y guantes, productos menos tóxicos, locales ventilados, etiquetas legibles, fichas de seguridad, <span class=\"h\">no mezclar productos</span>, EPIs con CE. Vías de entrada: <b>inhalatoria, dérmica, digestiva, parenteral</b>. <b>No mezclar lejía y amoniaco</b>; verter <b>ácido sobre el agua</b>; envases originales; alejados de alimentos; no perforar aerosoles.</p>"}]}, {"t": "4 · Medio ambiente y psicosocial", "cards": [{"t": "Ruido y vibraciones", "p": "<p>Ruido = sonido no deseado: <b>65 dB día / 55 dB noche</b>; laboral 80 dB(A)/8 h, máx. 140 dB; bares 55 dB. <b>Vibraciones</b>: <b>alta (motosierras, martillos neumáticos)</b> → problemas articulares y vasomotores.</p>"}, {"t": "Radiaciones y calor", "p": "<p><b>No ionizantes</b>: UV → piel; infrarroja → retina, cristalino. <b>Ionizantes</b>: natural (radio, uranio) o artificial (rayos X); a largo <b>alteraciones irreversibles</b>, también en descendencia. <b>Calor</b>: golpe, desmayos, deshidratación. <b>Frío</b>: hipotermia, congelación. <b>Térmico</b>: sed. 17–27 ºC, ligeros 14–25 ºC, humedad 30–70 %.</p>"}, {"t": "Agentes biológicos", "p": "<p>Microorganismos y endoparásitos. Se clasifican por 4 características: gravedad, peligrosidad para expuestos, <b>capacidad de contagio</b> y <b>existencia de tratamiento</b>. Medidas: <b>certificado de manipulador de alimentos</b>, higiene de ropa de trabajo y utensilios.</p>"}, {"t": "Carga física", "p": "<p>Carga de trabajo = requerimientos psicofísicos. <b>Precisión</b> → plano alto (interviene la vista); <b>esfuerzo</b> → plano bajo (fuerza). <b>Alternar posiciones</b> para no acelerar el cansancio.</p>"}, {"t": "Manipulación de cargas", "p": "<p>Carga = <b>> 3 kg</b>; máx. <b>25 kg</b>; mujeres jóvenes/edad avanzada <b>< 15 kg</b>. Técnica: pies <b>≈ 50 cm</b>, doblar cadera y rodillas, pegada al cuerpo, <b>espalda recta</b>, cabeza levantada, dos manos, medios auxiliares, vigilar la salud.</p>"}, {"t": "Carga mental y burn out", "p": "<p>Factores: cantidad de información, complejidad, tiempo de respuesta, capacidades individuales. <b>Burn out</b>: agotamiento emocional, pérdida de autoestima, despersonalización y baja realización (quienes trabajan con personas).</p>"}, {"t": "Estrés y relaciones", "p": "<p><b>Causas</b>: jornada excesiva, imprevistos, acumulación de clientes, falta de cualificación. <b>Medidas</b>: reparto claro, planificar imprevistos, reforzar turnos, formación, descanso, seleccionar al trabajador. <b>Malas relaciones</b>: delimitar tareas, evitar competitividad, motivar.</p>"}, {"t": "Accidente y EPIs COVID", "p": "<p>Lesión <b>con ocasión o consecuencia</b> del trabajo por cuenta ajena. <b>In itinere</b> (ida/vuelta sin interrupciones), <b>en misión</b>, cargos sindicales, salvamentos, agravación, intercurrentes, imprudencia profesional. <b>COVID</b>: FFP1 78 %, FFP2 92 %, FFP3
