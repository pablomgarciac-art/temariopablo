 98 % (FFP2 < 2 m; aerosoles → FFP3); guantes con pictograma <span class=\"h\">«VIRUS»</span>; pantallas faciales no protegen de aerosoles; cubregafas no válidos.</p>"}]}, {"t": "5 · Fuego y detección", "cards": [{"t": "Factores de ignición", "p": "<p><b>Combustible</b> (sólido, líquido o gaseoso) + <b>comburente</b> (aire ≈ 21 % O₂) + <b>energía de activación</b> (calor) + <b>reacción en cadena</b> → <b>ignición</b>. Propagación <b>horizontal</b> (puertas, pasillos) y <b>vertical</b> (escaleras, huecos de ascensor).</p>"}, {"t": "Evitar el inicio", "p": "<p>Solo la cantidad necesaria de material inflamable; almacenar aislado y alejado; <b>recipientes herméticos</b>; <span class=\"h\">prohibir fumar</span>; alejar fuentes de calor; hermeticidad de gas; inst. eléctrica sin focos de calor y <b>desconectar al terminar</b>; <b>no mezclar químicos de reacción desconocida</b>.</p>"}, {"t": "Protección pasiva y activa", "p": "<p><b>Pasiva</b>: estructura del edificio, pasillos y escaleras que enlentezcan el fuego, alumbrado de emergencia. <b>Activa</b>: medios manuales/automáticos de <b>detección, control y extinción</b>, facilitando la evacuación.</p>"}, {"t": "Alarma e hidrantes", "p": "<p><b>Pulsadores</b>: recorrido ≤ <b>25 m</b>, altura <b>80–120 cm</b>. <b>ECI</b>: alarma perceptible en cada sector; visual si ruido > <b>60 dB</b>, otra legislación o sordos/protector auditivo. <b>Abastecimiento</b>: fuentes, impulsión y red. <b>Hidrantes</b> columna/bajo tierra; <b>racor</b> = pieza con dos roscas opuestas; recorrido < <b>100 m</b> zonas urbanas y <b>40 m</b> resto; al menos uno con salida <b>100 mm</b>; emplazados a <b>5–15 m</b> de la fachada.</p>"}, {"t": "Detectores", "p": "<p><b>Humo</b>: iónico («nariz electrónica», humo no visible, <b>1ª fase</b>, el más usado), óptico (humo visible, <b>2ª fase</b>, inst. eléctricas), barrera de infrarrojos. <b>Temperatura</b>: térmico (<b>últimas etapas</b>, aparcamientos, cocinas, talleres), termovelocimétrico (≤ <b>7–8 m</b>, alcance <b>40 m²</b>). <b>Llamas</b>: UV. <span class=\"h\">Limpiar ANUALMENTE · activar 1 vez cada 6 MESES · simulacro mínimo 1 AL AÑO.</span></p>"}, {"t": "Tipos de fuegos", "p": "<table><tr><th>Clase</th><th>Material</th></tr><tr><td><b>A</b></td><td>Brasas: madera, papel, tejido</td></tr><tr><td><b>B</b></td><td>Líquidos inflamables, sólidos licuables</td></tr><tr><td><b>C</b></td><td>Gases: butano, propano, etileno</td></tr><tr><td><b>D</b></td><td>Metales especiales (ácido sulfúrico, titanio)</td></tr><tr><td><b>F</b></td><td>Aceites y grasas de cocina</td></tr></table>"}]}, {"t": "6 · Extinción", "cards": [{"t": "Extintores: clasificación", "p": "<p><b>Portátil</b>: ≤ <b>20 kg</b>. <b>Móvil</b>: > <b>20 kg</b>, sobre ruedas. Presión interna por compresión previa o liberación de gas auxiliar.</p>"}, {"t": "Emplazamiento", "p": "<p>Visibles, accesibles, próximos a puntos de probable inicio y a <b>salidas de evacuación</b>; sobre soportes fijos, parte superior entre <b>80 y 120 cm</b>; recorrido máximo horizontal <span class=\"h\">≤ 15 m</span>. Si va en armario, la señalización va <b>junto al armario</b>, no sobre él.</p>"}, {"t": "Tipos por presión", "p": "<p><b>Presión permanente</b>: ① el agente da su propia presión (CO₂) ② agente líquido/gaseoso (hidrocarburos halogenados) con gas auxiliar ③ agente líquido/sólido pulverulento con gas inerte (nitrógeno o CO₂). <b>Presión no permanente</b>: agente a presión atmosférica. Elegir el agente según la <b>clase de fuego</b>.</p>"}, {"t": "BIE", "p": "<p>Manguera <b>plana (45 mm, 20 m)</b> o <b>semirrígida (25 mm, 30 m)</b>; alta presión ≤ <b>12 mm, 30 m</b>. Apertura del armario ≤ <b>1,50 m</b>; a ≤ <b>5 m</b> de las salidas del sector; separación entre BIE ≤ <b>50 m</b>. Señalización <b>junto al armario</b>, no sobre él.</p>"}, {"t": "Columna seca", "p": "<p>Toma en fachada «USO EXCLUSIVO BOMBEROS», racor <b>70 mm</b>, llave de purga 25 mm, columna <b>DN80</b> de acero galvanizado. <b>Ascendente</b>: racores 45 mm cada <b>4 plantas</b> con válvula por encima. <b>Descendente</b>: válvula y salida en cada planta, llave justo debajo, conexión siamesa. Bocas a <b>0,9 m</b>; entre columnas < <b>60 m</b>; toma independiente por columna.</p>"}, {"t": "Mantas y alumbrado", "p": "<p><b>Mantas ignífugas</b>: caducidad ≤ <b>20 años</b>, visibles, accesibles, próximas al uso y <b>señalizadas</b>. <b>Alumbrado de emergencia</b>: ilumina locales y accesos hasta las salidas si falla el normal; permite identificar equipos y medios.</p>"}, {"t": "Actuación ante incendio", "p": "<p>Localizar origen → clasificar (conato/parcial/general) → avisar al <b>Jefe de Emergencia</b> → apagar con extintor si se puede → no cortar vías de escape → <b>en parejas</b> → si se controla, avisar sin abandonar → con humo, <b>mojar la puerta</b> y toallas húmedas en los bajos.</p>"}]}, {"t": "7 · Emergencias y evacuación", "cards": [{"t": "Accidentes graves", "p": "<p>Fuego sin explosión · <b>fogonazo</b> de gas (combustión tan rápida que no da tiempo a huir) · <b>charco inflamado/dardo de fuego</b> (se evita alejándose) · <b>explosiones</b> (alta velocidad de combustión) · nubes de gases tóxicos · <b>derrames nocivos</b> · amenaza de bomba · fenómenos naturales (terremotos, inundaciones, rayos, huracanes).</p>"}, {"t": "Clasificación", "p": "<p><b>Conato</b>: se neutraliza con los medios del lugar. <b>Parcial</b>: no de inmediato, pide ayuda a un grupo más preparado. <b>General</b>: <span class=\"h\">supera los medios del centro</span>, altera toda la organización y exige <b>ayuda exterior</b>.</p>"}, {"t": "Evacuación", "p": "<p>Desalojar total o parcialmente de forma <b>ordenada y controlada</b>; la inicia el <b>CCE</b>. Primero <b>enfermos</b>, luego bienes (documentación, luego lo que agravaría el siniestro). Orden de enfermos: ① <b>desplazables solos</b> ② encamados <b>más alejados</b> ③ impedidos <b>más próximos</b>.</p>"}, {"t": "Planes", "p": "<p><b>Evacuación</b>: traslado ordenado a lugares seguros. <b>PEI</b> (interior): medios y procedimientos en una empresa o contiguas. <b>PEE</b> (exterior): agrupa varios PEI + <b>PAM</b> (municipal) + <b>PBEM</b> (básico municipal) + <b>PAGR</b> (grupos de intervención).</p>"}, {"t": "Actuación", "p": "<p><b>Conato</b> (EPI): usar medios, <b>no arriesgarse ni provocar riesgo mayor</b>, iniciar alarma al CCE, pedir ayuda, informar. <b>Parcial</b>: comunicar al centro (timbre/teléfono) y <b>confirmar que lo entendieron</b>; quedar alerta a megafonía o sonidos codificados. <b>General</b>: la declaran los autorizados; cada uno se incorpora a su grupo.</p>"}, {"t": "Evacuación parcial y total", "p": "<p><b>Parcial</b>: <b>sin correr, en grupo</b>, por vías señalizadas a los puntos de reunión, identificarse ante los responsables. <b>Total</b>: ídem pero el itinerario se alarga hasta un punto de reunión <b>en el exterior</b>.</p>"}, {"t": "Documentos, simulacros y equipos", "p": "<p><b>Manual de Emergencia</b> · <b>ficha individual</b> por puesto · <b>carteles</b> · <b>simulacros</b> mínimo <span class=\"h\">1 vez/año</span>. <b>Equipos</b>: <b>Jefe de Intervención</b>: dirige e informa al JE. <b>Jefe de Emergencia</b>: ayudas internas, externas, ordena evacuación. <b>EPI</b>: controla al inicio. <b>ESI</b>: si los EPI no bastan. <b>EAE</b>: evacuación. <b>EPA</b>: primeros auxilios.</p>"}]}, {"t": "8 · Primeros auxilios y organización", "cards": [{"t": "Primeros auxilios", "p": "<p>Atención inmediata hasta la asistencia médica para que las lesiones <b>no empeoren</b>. <b>Consejos</b>: calma, evitar aglomeraciones, <b>no mover</b>, tranquilizar, mantener caliente, avisar al sanitario, traslado adecuado, <b>no medicar</b>. <b>Precauciones</b>: lugar seguro, aflojar ropa, vías libres, posición lateral ante vómitos, inmovilizar si fractura, no líquidos ni licor a inconscientes.</p>"}, {"t": "PAS", "p": "<p><b>Proteger + Avisar + Socorrer</b> (conciencia, respiración, pulso). <b>Conocimiento</b>: rostro congestionado → boca arriba, cabeza elevada; pálido → cabeza baja; aflojar ropa. <b>Respiración</b>: cabeza atrás, mandíbula en alto. <b>Pulso</b>: índice y corazón sin presionar; <b>grave</b> si > <b>120</b> o < <b>45</b>. <b>Reanimar si no hay respiración.</b></p>"}, {"t": "Orden de atención", "p": "<p><b>1º</b> sangran abundantemente · <b>2º</b> sin señales de vida (muerte aparente) · <b>3º</b> quemaduras graves · <b>4º</b> fracturas · <b>5º</b> heridas leves. Objetivos: conservar la vida, evitar complicaciones, ayudar en la recuperación, asegurar el traslado.</p>"}, {"t": "Lesiones comunes", "p": "<p><b>Heridas</b>: no limpiar hacia dentro, no algodón, no pomadas, no manos/trapos sucios. <b>Hemorragias</b>: <span class=\"h\">no quitar gasas antes de 5 minutos</span> (nuevas encima y presionar), <b>no torniquete</b>. <b>Golpes</b>: hielo, reposo. <b>Quemaduras</b>: no perforar ampolla, no quitar ropa adherida. <b>Ojo</b>: golpe → médico; cuerpo extraño → no extraer; químicos → <b>lavado a chorro 20 min</b>.</p>"}, {"t": "Botiquín", "p": "<p>> <b>50</b> trabajadores (o > <b>25</b> por peligrosidad): local con botiquín, <b>camilla</b> y <b>fuente de agua potable</b>. En todo trabajo: <b>botiquín portátil</b> (desinfectantes/antisépticos, gasas estériles, algodón, venda, esparadrapo, apósitos, tijeras, pinzas, guantes).</p>"}, {"t": "Organización preventiva", "p": "<p>Empresario planifica desde la <b>evaluación inicial</b>; puede él mismo con <b>< 6 trabajadores</b> (no la vigilancia de la salud). <b>Servicio propio</b> obligatorio con <b>> 500</b>; <b>ajeno</b>: entidad especializada. <b>Comité</b> (≥ 50): delegados + empresario en igual número, <b>trimestral</b>. <b>Delegados</b> «por y entre» representantes: ≤ 30 → delegado de personal; 31–49 → 1; 50–100 → 2; 101–500 → 3; 501–1000 → 4; 1001–2000 → 5; 2001–3000 → 6; 3001–4000 → 7; 4001+ → 8. Evaluación revisada <b>cada 5 años</b>; ficha de riesgos al ingreso.</p>"}, {"t": "Limpieza y vocabulario", "p": "<p><b>Limpieza</b>: productos menos tóxicos, ventilación, etiquetas legibles, fichas, <b>no mezclar</b>, guantes; carros/cargas con formación; recoger vertidos, señalizar mojados. <b>Vocab.</b>: <b>Higiene</b> controla agentes · <b>Ergonomía</b> adapta el puesto · biológicos <b>I–IV</b> gravedad/contagio/tratamiento · lugar: <b>3 m</b> alto, <b>2 m²</b> y <b>10 m³</b>/empleado, barandillas <b>≥ 90 cm</b> desde <b>2 m</b> · equipo <b>marcado CE</b>; si la única energía es humana, no es máquina.</p>"}]}], "ncards": 50}, {"key": "10", "num": "Tema 10", "name": "Ley 8/2011, de 23 de marzo, de Igualdad entre mujeres y hombres y contra la violencia de género en Extremadura", "hue": "#b23b8e", "sections": [{"t": "1 · Ley, objeto y ámbitos", "cards": [{"t": "La ley", "p": "<p>Ley <b>8/2011, de 23 de marzo</b>, de <b>Igualdad entre mujeres y hombres y contra la violencia de género en Extremadura</b>.</p>"}, {"t": "Objeto", "p": "<p>Hacer efectivo el derecho a la <b>igualdad de trato y oportunidades</b> entre mujeres y hombres en la C. A. de Extremadura y combatir <b>integralmente</b> la violencia de género (sociedad <b>libre, justa, democrática y solidaria</b>). <b>a)</b> principios generales de actuación de los poderes públicos · <b>b)</b> medidas y recursos para la igualdad efectiva: autonomía personal y posición <b>social, laboral, económica y política</b> de las mujeres · <b>c)</b> medidas integrales de <b>sensibilización, prevención y detección</b> de la VG; derechos de <b>atención, asistencia, protección y recuperación integral</b> a las mujeres y su <b>núcleo familiar</b>.</p>"}, {"t": "Ámbitos", "p": "<p><b>Territorial</b>: C. A. de Extremadura · personas <b>físicas y jurídicas</b>. <b>a)</b> Admón. de la C. A., organismos autónomos, empresas de la Junta, consorcios y fundaciones con representación <b>directa mayoritaria</b> de la Junta · <b>b)</b> entidades de la <b>Admón. Local</b> (ídem) · <b>c)</b><b>Universidad de Extremadura</b> · <b>d)</b> entidades con actividades <b>educativas y de formación</b> (cualquier tipo, nivel, grado) · <b>e)</b> privadas con <b>contratos o convenios</b> con las AA.PP. o <b>beneficiarias de ayudas o subvenciones</b>.</p>"}]}, {"t": "2 · Principios generales I-IX", "cards": [{"t": "1-6", "p": "<p><b>1</b> Igualdad de <b>trato</b>: proscribe toda discriminación <b>directa o indirecta</b> por sexo (esferas económica, social, laboral, cultural, educativa). <b>2</b> Igualdad de <b>oportunidades</b>: medidas para el acceso y ejercicio efectivo de derechos políticos, civiles, económicos, sociales, laborales y culturales. <b>3</b> Ruptura de la <b>brecha de género</b> en la Sociedad de la Información, el Conocimiento y la Imaginación. <b>4</b> Respeto a la <b>diversidad y a la diferencia</b> (entre sexos y dentro de cada colectivo). <b>5</b> Eliminación de <b>roles y estereotipos</b> en función del sexo. <b>6</b><b>Maternidad como valor social</b> + paternidad en contexto de <b>corresponsabilidad</b>.</p>"}, {"t": "7-9", "p": "<p><b>7</b><b>Corresponsabilidad</b>: reparto equilibrado de responsabilidades familiares, tareas domésticas y cuidado de dependientes. <b>8</b><b>Acción positiva</b>: medidas específicas a favor de las mujeres, <span class=\"h\">razonables y proporcionadas</span>, aplicables <span class=\"h\">en tanto subsistan</span> las desigualdades. <b>9</b> Supresión del <b>uso sexista del lenguaje</b> e imagen de mujeres y hombres fundamentada en la igualdad.</p>"}]}, {"t": "3 · Principios X-XVIII y definiciones", "cards": [{"t": "10-18", "p": "<p><b>10</b><b>Perspectiva de género</b> en todas las políticas y fases. <b>11</b><b>Interseccionalidad</b>: género + otros factores. <b>12</b><b>Representación equilibrada</b> (decisiones y candidaturas a la <b>Asamblea</b>). <b>13</b><b>Medio rural</b>: vida laboral, formación, desarrollo sostenible. <b>14</b> Coordinación y colaboración. <b>15</b><b>Relaciones entre particulares</b>. <b>16</b> Empleo, formación, promoción, <b>igualdad salarial</b>. <b>17</b> Erradicación de la VG (<b>transversalidad</b>). <b>18</b><b>Proximidad, equilibrio y celeridad</b> (evitar victimización).</p>"}, {"t": "Definiciones", "p": "<p><b>Directa</b>: trato <b>menos favorable</b> que otra persona en situación <b>homóloga</b>. <b>Indirecta</b>: práctica <b>aparentemente neutra</b> que pone a un sexo en <b>desventaja particular</b> (salvo finalidad legítima y medios necesarios). <b>Embarazo/maternidad/paternidad</b> = <b>discriminación directa por razón de sexo</b>. <b>Representación equilibrada</b>: cada sexo <span class=\"h\">40-60 %</span>.</p>"}, {"t": "Violencia de género (LO 1/2004)", "p": "<p>Manifestación de la <b>discriminación</b>, la <b>desigualdad</b> y las <b>relaciones de poder de los hombres sobre las mujeres</b>, ejercida por quienes <span class=\"h\">sean o hayan sido cónyuges</span> o <span class=\"h\">estén o hayan estado ligados por relación similar de afectividad</span>, <span class=\"h\">aún sin convivencia</span>.</p>"}, {"t": "Acoso y lenguaje", "p": "<p><b>Acoso sexual</b>: comportamiento <b>verbal, no verbal o físico de índole sexual</b> contra la dignidad (entorno intimidatorio, hostil, degradante, humillante u ofensivo). <b>Acoso por razón de sexo</b>: comportamiento <b>relacionado con el sexo</b>, mismo efecto. <b>Condicionar un derecho</b> a aceptar acoso = <b>discriminación por razón de sexo</b>. <b>Lenguaje no sexista</b>: expresiones que no <b>invisibilizan el femenino</b>.</p>"}]}, {"t": "4 · VG y competencias", "cards": [{"t": "Art. 76 · Competencias", "p": "<p>La <b>Junta de Extremadura</b> es la Administración competente para regular y asegurar prestaciones y derechos, garantizando los servicios de la <b>Red Extremeña de Atención a Víctimas de la VG</b>; fija pautas, objetivos y líneas de intervención (prevención, sensibilización, detección). Garantiza la <b>accesibilidad</b> a todas las mujeres que habiten en Extremadura. Los <b>municipios</b>: competencias de la C. A. por <b>delegación</b> o <b>gestión conjunta</b>.</p>"}, {"t": "Art. 77.1 · Junta", "p": "<p><b>a)</b><b>Política general</b> (Planes de Sensibilización, Prevención y Erradicación de la VG) · <b>b)</b><b>Comisión Permanente para la Prevención y Erradicación</b> (finalidad, funcionamiento, composición) · <b>c)</b> coordinar la <b>Red</b> y los recursos con la <b>AGE</b> · <b>d)</b> adecuar y <b>compatibilizar recursos</b> (educación, trabajo, salud, servicios sociales) · <b>e)</b> colaboración con las <b>demás CC.AA.</b> · <b>f)</b> demás funciones.</p>"}, {"t": "Art. 77.2 · Local", "p": "<p><b>a)</b> Programar, prestar y gestionar servicios de <b>información, asesoramiento y prevención</b> y <b>derivación</b> a la Red · <b>b)</b> colaborar en la <b>gestión de la Red</b> (convenio) · <b>c)</b><b>Servicios Sociales de Base</b>: prestaciones económicas y subvenciones + sensibilización y prevención · <b>d)</b> demás competencias por disposición legal.</p>"}]}], "ncards": 12}, {"key": "CV", "num": "Convenio", "name": "Convenio Colectivo y Permisos", "hue": "#b3861a", "sections": [{"t": "Marco y estructura", "cards": [{"t": "Fuentes de derechos", "p": "<ul><li>EBEP y desarrollo; <span class=\"h\">V Convenio</span> personal laboral Junta.</li><li>Decreto 149/2013 (6-8-2013): jornada/horarios/permisos/vacaciones personal funcionario; <span class=\"h\">291/2015</span> (13-11) lo modifica.</li><li>Acuerdo Mesa Sectorial: flexibilización de jornada.</li></ul>"}, {"t": "Negociación y efectos", "p": "<ul><li>Junta + <span class=\"h\">FSP-UGT, FSAP-CCOO, CSI-CSIF</span>.</li><li>Obliga a Junta, trabajadores del ámbito y centrales firmantes.</li><li>Firmantes: no adoptar medidas que impidan su aplicación ni someterse a arbitrajes no acordados.</li></ul>"}, {"t": "Denuncia y vigencia", "p": "<ul><li>Denuncia <span class=\"h\">4 meses antes</span> del vencimiento; denunciado sigue <span class=\"h\">vigente</span> hasta aprobación/publicación en DO<span class=\"r\">E</span>.</li><li>Nueva Comisión Negociadora: <span class=\"h\">1 mes</span> desde la denuncia.</li><li>Acuerdo Comisión Negociadora VI (14-6-2013): se mantiene la vigencia del V Convenio hasta nuevo texto.</li></ul>"}, {"t": "Comisión Negociadora", "p": "<ul><li>Constituida la Paritaria, la Negociadora se extingue al finalizar la negociación; funciones → Paritaria.</li></ul>"}, {"t": "Comisión Paritaria", "p": "<ul><li>Se constituye en <span class=\"h\">15 días</span> desde publicación en DOE; <span class=\"h\">6</span> de Administración + <span class=\"h\">6</span> de centrales firmantes.</li><li>Reglamento propio; vela e interpreta el convenio; fija cuantía definitiva del traslado forzoso.</li><li>Prenegocia convocatorias de cobertura definitiva; conoce medidas de organización del trabajo.</li><li>Conflictos: vía arbitral/judicial; convocada en <span class=\"h\">10 días improrrogables</span>, informe en <span class=\"h\">5 días</span>.</li><li>Negocia retribuciones de la RPT (mín. 4 sindicalistas + 2 Administración).</li><li>Reunión ordinaria obligatoria cada <span class=\"h\">2 meses</span>; informes 15 días, acuerdos 15 días.</li></ul>"}, {"t": "Organización del trabajo", "p": "<ul><li>Facultad y responsabilidad de la <span class=\"h\">Junta</span>, con consulta/participación de las centrales firmantes.</li><li>Se inspira en: eficiencia del servicio, métodos, adecuación de plantillas y categorías, calidad del empleado (profesionalización/promoción/formación), desempeño, seguridad y salud.</li><li>Modelo: administración orientada al <span class=\"h\">ciudadano</span>, nuevas TIC, empleados como agentes.</li></ul>"}]}, {"t": "Clasificación y retribuciones", "cards": [{"t": "Grupos profesionales (por titulación)", "p": "<ul><li>I: grado superior (doctor/licen./ing./arq.). Titulado Superior, Jefe de Sala, Coord. ITV, Coord. socioeducativo, Informática, Veterinario, Psicólogo.</li><li>II: grado medio (tec. ing./diplomado/arq. téc.). Educador, Animador, Prof. actividades docentes, Téc. sup. ITV, Bombero forestal coord., ATS, Fisioterapeuta.</li><li>III: Bachillerato/FP GS / téc. especialista 2º. Encargado carreteras, Verificador, Encargado, TEI, Mayoral, Intendente.</li><li>IV: ESO/EGB/FP 1º. Oficial 1ª, Enc. almacén, Aux. enfermería, ATE cuidador, Monitor ocupacional, Bombero forestal, Cocinero, Oper. informática.</li><li>V: Cert. Escolaridad/Garantía Social. Ordenanza, Camarero limpiador, Ayud. cocina, Vigilante, Peón especializado.</li></ul>"}, {"t": "Retribuciones básicas", "p": "<ul><li><span class=\"h\">Sueldo</span>: unidad de tiempo, 12 mensualidades, según grupo.</li><li><span class=\"h\">Antigüedad</span>: cada <span class=\"h\">3 años</span> (misma relación laboral), cuantía <span class=\"h\">única</span> para todos los grupos, desde el mes siguiente. Complemento personal garantizado: servicios en esta/otra Admin. que excedan (posteriores a 2000, transferidos).</li><li><span class=\"h\">P. extraordinaria</span>: junio y diciembre = sueldo + antigüedad + compl. personal garantizado + complemento destino del grupo. Periodos 1-12 a 31-5 y 1-6 a 30-11 (meses de 30 días).</li></ul>"}, {"t": "Retribuciones complementarias", "p": "<ul><li><span class=\"h\">Destino</span>: 12 mensualidades, importe según <span class=\"h\">nivel</span> del grupo.</li><li><span class=\"h\">Específico general</span>: según <span class=\"h\">tipo</span> del puesto.</li><li><span class=\"h\">Específico especial</span>: condiciones distintas; fijo y mensual (si no, previo reconocimiento <span class=\"h\">D.G. Función Pública</span>); encuadres L1-L17: turnicidad, jornada partida, nocturnidad, domingos/festivos, peligrosidad/penosidad/toxicidad, libre designación.</li></ul>"}, {"t": "Definiciones del específico especial", "p": "<ul><li>Turnicidad: mañana/tarde/noche, mín. <span class=\"h\">25%</span> de la jornada.</li><li>Nocturnidad:<span class=\"h\">22:00-8:00</span>; no nocturno si comienza desde las 7:00; 22:00-22:30 no cuenta.</li><li>Jornada partida: mañana y tarde con ≥1 h, mín. 3 días/semana.</li><li>Domingos/festivos: domingo noche no festivo si 2/3 de la jornada no es festivo.</li><li>Peligrosidad/penosidad/toxicidad: tiempo de exposición + probabilidad de daño + severidad; informe previo de Salud y Riesgos Laborales; reconoce D.G. Función Pública.</li></ul>"}]}, {"t": "Movilidad (I)", "cards": [{"t": "Movilidad geográfica", "p": "<ul><li>No traslado con cambio de localidad salvo <span class=\"h\">razones técnicas u organizativas</span>; mínimas molestias.</li><li>Notificación mín. <span class=\"h\">2 meses</span>; gastos de viaje (él y familiares) y traslado de muebles y enseres.</li><li>Indemnización <span class=\"h\">4.390-6.360 €</span> según trastorno; hijos en edad escolar → hasta fin de curso.</li><li>% extra cada año según <span class=\"h\">Ley de Presupuestos</span>.</li><li><span class=\"h\">Preferencia</span> en concursos de traslado de la localidad; ofrecido <span class=\"h\">una única vez</span>.</li></ul>"}, {"t": "Fijo discontinuo", "p": "<ul><li>Plaza amortizada (RPT) → opción de <span class=\"h\">adscripción definitiva</span> a puesto de misma categoría/especialidad, vacante, misma localidad o cercanas.</li><li>Sujeta a <span class=\"h\">aceptación</span> del trabajador + <span class=\"h\">informe favorable</span> de la Consejería; se da cuenta a la Comisión Paritaria.</li></ul>"}, {"t": "Zonificación", "p": "<ul><li><span class=\"h\">ATE-cuidador</span>, <span class=\"h\">Intérprete de Lengua de Signos</span> (centros educativos con módulos de integración) y <span class=\"h\">Oficial 1ª/2ª de mantenimiento</span>: zonas geográficas sustituyen ubicaciones de la RPT.</li><li>Debe prestar servicio en cualquier centro de la zona; <span class=\"h\">sin indemnización</span>.</li></ul>"}, {"t": "Cambio por incapacidad permanente total", "p": "<ul><li>Declarado IPT por <span class=\"h\">INSS</span> → solicita a D.G. Función Pública en <span class=\"h\">1 mes</span> cambio por puesto vacante de categoría igual o inferior; respeta antigüedad.</li><li>Informe INSS + informe técnico preceptivo de <span class=\"h\">Salud y Riesgos Laborales</span>.</li><li>Mismo grupo y localidad → <span class=\"h\">obligado a aceptar</span> (si no, extinción del derecho); inferior → puede aceptar/rechazar (1 año finaliza); salvo > <span class=\"h\">60 km</span>.</li><li>Orden: <span class=\"h\">1º desocupados, 2º ocupados por temporal, 3º menos antigüedad</span>.</li><li>Denegada IPT o parcial → se anula en 1 mes.</li><li>Sin puesto → permanece con derecho a incorporación a vacantes compatibles; se adapta el trabajo.</li><li>Desaparece la causa → <span class=\"h\">reincorporación automática</span>.</li><li>No renuncia al puesto elegido; a traslados pierde lo obtenido; Grupo V solo en su grupo; >65 años no pueden solicitarlo.</li></ul>"}, {"t": "Permutas", "p": "<ul><li>D.G. Función Pública, previo informe de Secretarías Generales y Comisión Paritaria, entre <span class=\"h\">fijos</span>, TODAS:</li><li>Misma categoría y especialidad; servicios en la categoría con diferencia ≤ <span class=\"h\">5 años</span>; > <span class=\"h\">2 años</span> en el puesto; no otra permuta en <span class=\"h\">5 años</span>; no si falta < <span class=\"h\">10 años</span> para jubilación ordinaria; sin concursos de traslado tras <span class=\"h\">1 año</span>.</li><li>Sin gasto de traslado ni indemnización.</li></ul>"}]}, {"t": "Movilidad (II)", "cards": [{"t": "Turno de traslado", "p": "<ul><li>Plazas: <span class=\"h\">vacantes + nueva creación + resultas</span>.</li><li>Fijos con <span class=\"h\">>1 año</span> en el puesto (todos hasta la comisión).</li><li><span class=\"h\">Abierto y permanente</span>; vigente <span class=\"h\">1 año</span> desde el DOE.</li><li>Resoluciones <span class=\"h\">cuatrimestrales</span> (enero, mayo, septiembre) por orden de la Consejería de Presidencia.</li><li>Solicitudes en cualquier momento; no alterables salvo modificación de la RPT; modificables hasta <span class=\"h\">1 mes antes</span> de la comisión.</li><li>Sin traslado tras 1 año → variar <span class=\"h\">una vez por año</span> que supere la vigencia; destino <span class=\"h\">irrenunciable</span>.</li></ul>"}, {"t": "Baremo concurso de traslado", "p": "<ul><li>Antigüedad en misma categoría <span class=\"h\">45%</span> + laboral fijo <span class=\"h\">40%</span> + cursos <span class=\"h\">15%</span>.</li></ul>"}, {"t": "Ascensos", "p": "<ul><li>Al menos <span class=\"h\">cada 2 años</span>; todas las plazas a turno de traslado.</li><li>Fijos y fijos discontinuos con mín. <span class=\"h\">2 años</span>; con <span class=\"h\">5 años</span> fijos → grupo superior de 2 en 2.</li><li>Méritos: titulación, antigüedad, cursos relacionados.</li></ul>"}, {"t": "Adscripción provisional", "p": "<ul><li>Puestos no ocupados <span class=\"h\"><25 km</span> y hasta 5 localidades.</li><li>Por antigüedad de solicitud; empate en apellidos; no otra solicitud hasta finalizar; no si está de <span class=\"h\">baja</span>.</li><li>Renunciable antes de resolver; después solo por: <span class=\"h\">familiar 1º grado</span>, <span class=\"h\">agrupación familiar</span> (cónyuge en otro municipio) o <span class=\"h\">necesidades del servicio/técnicas</span> (informe Secretaría General + Comisión Paritaria; ejecuta D.G. Función Pública).</li></ul>"}, {"t": "Turno libre y tribunales", "p": "<ul><li>Ofertas según <span class=\"h\">Ley de Función Pública</span> y Reglamento General de Ingreso (OEP vigente).</li><li>Nunca a turno libre plazas no ofrecidas antes a turno de traslado.</li><li>Tribunales: impar, mín. <span class=\"h\">5</span>; <span class=\"h\">observador</span> de cada central (uno por central, todo el proceso); titulación ≥ exigida; observadores indemnizados por gastos.</li></ul>"}, {"t": "Selección y contratación", "p": "<ul><li>Principios: <span class=\"h\">igualdad, mérito, capacidad y publicidad</span>.</li><li>Periodo de prueba: Grupos I-II-III <span class=\"h\">2 meses</span>; Grupos IV-V <span class=\"h\">1 mes</span>.</li></ul>"}, {"t": "Movilidad funcional", "p": "<ul><li>No funciones distintas salvo <span class=\"h\">causas sobrevenidas urgentes/imprevisibles</span>; puestos vacantes solo si no se cubren por medios normales; <span class=\"h\">rotativa</span> por similitud funcional; titulación específica exigible.</li><li><span class=\"h\">Superiores</span>: máx. 1 mes, autorización expresa Secretaría General; no ascenso automático ni consolida; func. superiores ≤ 6 meses → diferencia retributiva.</li><li><span class=\"h\">Inferiores</span>: necesidades perentorias/imprevisibles, máx. 1 mes, comunicación al interesado y representantes.</li></ul>"}]}, {"t": "Tiempo de trabajo", "cards": [{"t": "Jornada ordinaria", "p": "<ul><li><span class=\"h\">37,5 h/semana</span> o <span class=\"h\">1.650 h/año</span> (distribución distinta; se descuentan vacaciones, AP y festivos; festivos el <span class=\"h\">24 y 31 dic</span>).</li><li>Turnicidad rotatoria: <span class=\"h\">−54 min</span> por noche; entre 1.650 h (0 noches) y <span class=\"h\">1.503 h (167 noches)</span>.</li><li>Turno <span class=\"h\">fijo de noche: 1.503 h/año</span>; nocturno 22:00-8:00.</li><li>Jornada general lunes a viernes, acomodada al centro (mañana 8-15, tarde 15-22, noche 22-8); si coinciden laboral y funcionario → <span class=\"h\">unificación de horario</span>.</li><li>Horas extra: efectivo ≤ <span class=\"h\">9 h diarias</span> y descanso entre jornadas <span class=\"h\">12 h</span>; descanso de <span class=\"h\">20 min</span> en jornada cuando el turno lo requiera (10-12:30 para organización del trabajo).</li></ul>"}, {"t": "Horas extraordinarias", "p": "<ul><li>Solo las <span class=\"h\">obligatorias</span>: prevenir/reparar siniestros, pérdida de materias primas o vidas, daños extraordinarios y urgentes.</li><li>Comunicación <span class=\"h\">mensual</span> al órgano competente y a los representantes.</li><li>Valor según <span class=\"h\">tablas salariales</span> por grupo.</li><li>Compensación en descanso con <span class=\"h\">+75%</span>, a jornadas completas, máx. <span class=\"h\">4 meses</span>.</li></ul>"}, {"t": "Calendario", "p": "<ul><li>Previos informe Comité de Empresas/Delegados; <span class=\"h\">Secretarías Generales</span> lo confeccionan el último trimestre del año según directrices de la <span class=\"h\">D.G. Función Pública</span>.</li></ul>"}, {"t": "Horario de trabajo", "p": "<ul><li>1) Acuerdo antes del <span class=\"h\">31 de marzo</span> (director/responsable + trabajadores); 2) <span class=\"h\">tablón de anuncios</span>; 3) sin acuerdo resuelve la Secretaría General previo informe de la <span class=\"h\">Comisión Paritaria</span>; 4) si no se fija, <span class=\"h\">prórroga del anterior</span>; en 1 mes se remite a D.G. Función Pública; 5) Educación y Agricultura: trimestre anterior al curso escolar.</li><li><span class=\"h\">24 de los 48 fines de semana</span> libres al año (salvo pacto) y no más de 2 fines de semana seguidos (festivos igual).</li><li>Festivo en día de descanso → <span class=\"h\">compensado con otro día</span>.</li><li>Exceso imprevisto = jornada irregular: <span class=\"h\">1 h = 75%</span>.</li><li>Extinción de contrato sin disfrute → compensación económica.</li></ul>"}, {"t": "Vacaciones", "p": "<ul><li><span class=\"h\">22 días hábiles/año</span> (Decreto 291/2015); hábiles = lunes a viernes no festivos.</li><li>Antigüedad: <span class=\"h\">15-23 · 20-24 · 25-25 · 30+-26</span>, desde el día siguiente.</li><li>Disfrute en año natural; máx. 31 de enero (Decreto) / <span class=\"h\">15 de enero</span> (V Convenio).</li><li>Fraccionables: mín. 7 días + <span class=\"h\">5 días sueltos</span> al año.</li><li>Suspensión por baja / riesgo lactancia / riesgo embarazo → reanuda tras el alta; alta después del 31 de enero → se disfruta al día siguiente y siempre que no hayan pasado <span class=\"h\">18 meses</span> de la finalización del permiso.</li><li><span class=\"h\">No se pagan</span> (solo cese y fallecimiento); se eligen antes del <span class=\"h\">30 de abril</span>; antes del 16-6 / tras el 15-9: 20 días hábiles de antelación y la <span class=\"h\">mitad entre el 16-6 y el 15-9</span>; centros que cierran → franja de cierre.</li></ul>"}]}, {"t": "Conciliación y permisos del convenio", "cards": [{"t": "Nacimiento / paternidad", "p": "<ul><li>DL 6/2019, en vigor <span class=\"h\">8-3-2019</span>; equiparación progresiva: <span class=\"h\">2019(ene-mar) 5</span> · 2019(abr-dic) <span class=\"h\">8</span> · 2020 <span class=\"h\">12</span> · 2021+ <span class=\"h\">16 semanas</span>.</li><li>16 semanas: <span class=\"h\">6 primeras obligatorias, ininterrumpidas y simultáneas</span> tras el parto; <span class=\"h\">10 restantes</span> de cada progenitor hasta el año.</li><li>Tras las 6 primeras → jornada parcial o completa con <span class=\"h\">15 días</span> de antelación.</li><li><span class=\"h\">Prematuros</span> hospitalizados → ausentarse <span class=\"h\">2 h diarias</span> mientras dure la hospitalización.</li></ul>"}, {"t": "Otros permisos", "p": "<ul><li>Exámenes <span class=\"h\">finales</span>: los días de celebración. Traslado de domicilio: 1 día; a otra localidad: hasta <span class=\"h\">3 días</span>.</li><li><span class=\"h\">Lactancia</span> (hijo <12 meses): 1 h/día, o ½ h al inicio y al final, o acumulable en jornadas completas (<span class=\"h\">28 días</span>).</li><li>Ausentarse: hijos <span class=\"h\"><16 años</span> o dependientes sin autonomía (acreditado) para consultas médicas y sanitarias públicas; si ambos son empleados públicos, <span class=\"h\">solo uno</span> ejerce.</li><li>Reuniones del centro escolar de sus hijos.</li></ul>"}, {"t": "Asuntos particulares", "p": "<ul><li><span class=\"h\">6 AP/año</span> a conveniencia, sujeto a necesidades del servicio, hasta el <span class=\"h\">31 de enero</span> del año siguiente; no se unen a vacaciones fraccionadas.</li><li>Por trienios: 6→+2 · 7→0 · 8→+1 · 9→+1 · 10+…</li></ul>"}, {"t": "Conciliación: reducción de jornada", "p": "<ul><li>Guarda legal de menor <span class=\"h\"><6 años</span> (incl. adopción y acogimiento permanente o preadoptivo), discapacidad sin actividad retribuida, o familiar <span class=\"h\">2º grado con incapacidad >65%</span> que requiera dedicación especial y sin actividad retribuida.</li><li>Reducción con baja salarial de <span class=\"h\">1/3</span> (percibe <span class=\"h\">75%</span>) o <span class=\"h\">1/2</span> (percibe <span class=\"h\">60%</span>) de retribuciones íntegras.</li><li>Protección de la madre durante el embarazo.</li></ul>"}, {"t": "Permisos sin sueldo", "p": "<ul><li>Fijos; solicitud con <span class=\"h\">15 días</span>: período no inferior a <span class=\"h\">10 días</span> ni superior a <span class=\"h\">1 año cada 3 años</span>; ampliable por causa justificada (mismos límites); supeditado a necesidades del servicio.</li><li>Durante el disfrute, <span class=\"h\">sin actividades retribuidas</span> salvo compatibilidad previa.</li></ul>"}]}, {"t": "Excedencias, jubilación y disciplina", "cards": [{"t": "Excedencias voluntarias", "p": "<ul><li><span class=\"h\">Incompatibilidad</span>: otra categoría en otra CC.AA./administración; no cuenta antigüedad; reingreso 1 mes del cese; si no → de oficio interés particular.</li><li><span class=\"h\">Interés particular</span>: fijos con 5 años; ≥2 años (con 1 año en Junta: 2-5); sin devengo; no computa; no si expediente o sanción sin cumplir.</li><li><span class=\"h\">Agrupación familiar</span>: cónyuge/pareja en otro municipio por trabajo; mín. 2, máx. <span class=\"h\">15 años</span>; ingreso antes de finalizar o en 1 mes si desaparece la causa; si no → interés particular.</li><li><span class=\"h\">Cuidado de familiares</span>: hasta <span class=\"h\">3 años</span> por hijo (incl. adopción) o familiar 2º grado; <span class=\"h\">reserva de puesto</span> y computa; temporal → hasta fin del contrato; incompatible con actividad remunerada; ingreso con 1 mes; si no → interés particular.</li><li><span class=\"h\">Forzosa</span>: fijos; reserva de puesto y cómputo; ingresar 1 mes antes; si no → de oficio interés particular.</li></ul>"}, {"t": "Jubilación e indemnizaciones", "p": "<ul><li><span class=\"h\">65 años</span>, salvo continuar (previa comunicación a D.G. Función Pública) para completar carencia o por interés personal.</li><li>Fijos: voluntaria incentivada a los <span class=\"h\">63</span>; voluntaria a los <span class=\"h\">64</span> (RD 1194/1985); solicitud con <span class=\"h\">3 meses</span>.</li><li>IP <span class=\"h\">absoluta</span>: <span class=\"h\">17.500 €</span> (abono máx. 45 días desde la resolución).</li><li><span class=\"h\">Fallecimiento</span>: <span class=\"h\">19.000 €</span> a derechohabientes dependientes económicamente; cuantías +% cada año (Ley de Presupuestos); efectos a la entrada en vigor.</li></ul>"}, {"t": "Marco disciplinario", "p": "<ul><li>Sanciones por las <span class=\"h\">autoridades administrativas</span>; se atiende al Estatuto de los Trabajadores; procedimiento: resto de personal de la C.A. + normativa laboral.</li><li>Graduación: <span class=\"h\">A</span> intencionalidad · <span class=\"h\">B</span> legalidad/interés público · <span class=\"h\">C</span> perturbación del servicio · <span class=\"h\">D</span> daños a Admin./administrados · <span class=\"h\">E</span> reincidencia.</li><li>Tolerancia/encubrimiento de jefes → responsabilidad (según sanción al autor + circunstancias).</li></ul>"}, {"t": "Faltas leves", "p": "<ul><li>Incorrección/altercados; retraso reiterado, negligencia o descuido; no comunicar faltas o no justificar la IT; falta de asistencia sin causa; descuido de locales/enseres/documentos; violación de intimidad y dignidad (incl. ofensas verbales sexuales); PRL si no afecta a seguridad y salud.</li></ul>"}, {"t": "Faltas graves", "p": "<ul><li>Incumplimiento de órdenes y obligaciones (órdenes por escrito si son de otras funciones); impuntualidad ≥ 5 días/mes; 3 días de ausencia al mes; abandono; simulación de enfermedad <3 días; 3 leves en un trimestre; evadir control horario; abuso de autoridad; grave desconsideración; ofensas verbales/físicas sexuales; falsedad de datos; incumplir PRL con riesgo; discriminación; abstenciones; daños graves por negligencia o mala fe.</li></ul>"}, {"t": "Faltas muy graves", "p": "<ul><li>Delito/falta penal en funciones; >3 faltas de asistencia al mes; malos tratos físicos; ofensas físicas sexuales; simulación >3 días; incompatibilidades; fraude/buena fe contractual; daños muy graves con mala fe; disposición de medios para uso particular; obstaculizar libertades y derechos sindicales; 3 graves en un trimestre.</li></ul>"}]}, {"t": "Permisos (parte 2)", "cards": [{"t": "DL 5/2023 · accidente/enfermedad/hospitalización", "p": "<ul><li>Vigor <span class=\"h\">30-6-2023</span>. Accidente/enfermedad grave, hospitalización o intervención sin hospitalización con reposo del <span class=\"h\">cónyuge, pareja de hecho, 1º grado consanguinidad o conviviente</span>: <span class=\"h\">5 días hábiles</span>.</li><li>Familiar <span class=\"h\">2º grado</span> consanguinidad/afinidad: <span class=\"h\">4 días hábiles</span>.</li></ul>"}, {"t": "DL 5/2023 · fallecimiento y parental", "p": "<ul><li>Fallecimiento <span class=\"h\">cónyuge, pareja o 1º grado</span>: <span class=\"h\">3 días</span> (misma localidad) / <span class=\"h\">5 días</span> (distinta).</li><li>Fallecimiento <span class=\"h\">2º grado</span>: <span class=\"h\">2 días</span> / <span class=\"h\">4 días</span>.</li><li>Permiso <span class=\"h\">parental</span> (hijo o acogido >1 año, hasta 8 años): <span class=\"h\">hasta 8 semanas</span> continuas/discontinuas, completo o parcial; comunicación con <span class=\"h\">15 días</span>, por semanas completas.</li></ul>"}, {"t": "V Convenio · enfermo y funerales", "p": "<ul><li>Presencia junto al enfermo (días que <span class=\"h\">justificadamente establezca el trabajador</span>): <span class=\"h\">5 días</span> 1º grado consang./afinidad (hijos/padres, cónyuges y padres políticos), <span class=\"h\">hermanos, cónyuge o pareja de hecho</span>, +2 días localidad distinta.</li><li><span class=\"h\">2 días</span> 2º grado (nietos/abuelos, cónyuges de nietos/abuelos/hermanos políticos), +2 días localidad distinta.</li><li>Fallecimiento del <span class=\"h\">tío o sobrino</span>: <span class=\"h\">1 día natural</span>.</li></ul>"}, {"t": "Art. 48 TREBEP · duración", "p": "<ul><li>Finalidad: cuidado del menor y conciliación en <span class=\"h\">igualdad</span>. Derechos <span class=\"h\">individuales, iguales e intransferibles</span>. Casos: a) madre biológica; b) adopción, guarda con fines de adopción o acogimiento (temporal o permanente, mín. <span class=\"h\">1 año</span>); c) progenitor distinto de la madre.</li><li><span class=\"h\">19 semanas</span> por progenitor; <span class=\"h\">32 en monoparentalidad</span>.</li><li><span class=\"h\">6 semanas</span> ininterrumpidas, obligatorias, jornada completa, tras el parto (a) o la resolución (b/c).</li><li><span class=\"h\">11 semanas (22 monoparentalidad)</span> desde el final de las 6 obligatorias hasta 12 meses (a) / dentro de los 12 meses (b/c).</li><li><span class=\"h\">2 semanas (4 monoparentalidad)</span> hasta que cumpla <span class=\"h\">8 años</span>.</li></ul>"}, {"t": "Art. 48 TREBEP · ampliaciones", "p": "<ul><li>Parto prematuro u hospitalización del neonato: +<span class=\"h\">13 semanas</span>.</li><li>Discapacidad del hijo/a: <span class=\"h\">+2 semanas</span> (ambos).</li><li>Parto múltiple: +<span class=\"h\">1 semana por hijo/a</span> desde el 2º (cada progenitor); id. en adopción/guarda/acogimiento múltiples para cada progenitor.</li><li><span class=\"h\">Fallecimiento del hijo/a</span>: no reduce (salvo reincorporación voluntaria tras las 6 obligatorias).</li><li>Fallecimiento de la madre o del otro progenitor: el <span class=\"h\">superviviente</span> disfruta la totalidad o lo que reste.</li></ul>"}, {"t": "Art. 48 TREBEP · condiciones", "p": "<ul><li>Computa como <span class=\"h\">servicio efectivo</span>; se garantizan todos los derechos económicos; reincorporación al puesto y mejoras durante la ausencia.</li><li>Disfrute interrumpido (tras las 6 obligatorias): <span class=\"h\">preaviso 15 días</span>, por <span class=\"h\">semanas completas</span>; completo o a tiempo parcial (necesidades del servicio y reglamento).</li><li>Si ambos progenitores lo solicitan → la Administración puede <span class=\"h\">aplazar justificadamente</span> y ofrecer alternativa.</li><li>Tras las 6 obligatorias: puede participar en <span class=\"h\">cursos de formación</span>.</li><li><span class=\"h\">Adopción internacional</span>: desplazamiento previo al país de origen hasta <span class=\"h\">2 meses</span> (solo retribuciones básicas); puede iniciarse <span class=\"h\">hasta 4 semanas antes</span> de la resolución judicial.</li><li>Adición de las <span class=\"h\">2 semanas (4 monoparentalidad)</span>: hechos causantes desde <span class=\"h\">2-8-2024</span>; disfrute y prestación desde <span class=\"h\">1-1-2026</span> sin nuevo reconocimiento.</li></ul>"}]}], "ncards": 44}];

UINELOSIS procede de…", ["la musculatura de cerdo, jabalí o caballo (matanzas domiciliarias)", "el huevo crudo", "las setas tóxicas", "el agua de red pública"], 0, "Triquinelosis: parásito en musculatura de cerdo, jabalí, caballo; matanzas domiciliarias (análisis)."], ["La TUBERCULOSIS alimentaria se asocia a…", ["leche cruda y productos derivados no tratados", "conservas de pescado", "verduras congeladas", "harinas refinadas"], 0, "Tuberculosis: leche cruda o productos derivados no tratados."], ["¿Cuál de estas enfermedades NO suele transmitirse por la LECHE?", ["Botulismo", "Tuberculosis", "Brucelosis", "Salmonelosis"], 0, "Leche: TBC, brucelosis, salmonelosis, hep. A, estafilococia, enterovirosis. El botulismo se asocia a conservas sin O₂."], ["Las superficies de trabajo deben ser…", ["lisas, impermeables, lavables y de materiales no tóxicos (no madera)", "de madera para evitar deslizamientos", "porosas para absorber la humedad", "rugosas para facilitar el barrido"], 0, "Superficies: lisas, impermeables, fácilmente lavables (aluminio, acero inoxidable). NO madera (acumula suciedad y gérmenes)."], ["El agua de un POZO para uso en alimentación exige…", ["analítica inicial y equipo de desinfección (con nº de registro sanitario)", "solo hervirla en verano", "un certificado del Ayuntamiento como el agua de red", "filtros de carbón en cada grifo"], 0, "Red pública → certificado del Ayuntamiento. Pozo → analítica inicial + equipo de desinfección (nº de registro sanitario)."], ["En la RECEPCIÓN de alimentos, si el vehículo de transporte no cumple las condiciones…", ["se rechaza la mercancía", "se acepta pero se anota", "se descarga y se sirve igualmente", "se abona a mitad de precio"], 0, "Recepción: vehículos exclusivos, lisos, impermeables, limpios y desinfectados; rechazo si no se cumplen las condiciones o hay transporte inadecuado."], ["Los alimentos deben almacenarse…", ["sin contacto entre sí ni con el suelo", "siempre en contacto con la pared para ahorrar espacio", "en locales sin control de temperatura", "apilados lo máximo posible"], 0, "Almacenamiento: locales a temperatura y humedad adecuadas; sin contacto entre alimentos ni con el suelo; atención a incompatibilidades."], ["Los contenedores de RESIDUOS deben…", ["tener tapa permanente y retirarse al final de la jornada", "abrirse cuando sea necesario", "lavarse una vez al mes", "guardarse junto a los alimentos"], 0, "Residuos: contenedores con tapa permanente, retirados al finalizar la jornada, limpios y desinfectados; local específico sin insectos ni roedores."], ["Un manipulador 'portador sano'…", ["elimina gérmenes sin presentar síntomas", "padece una enfermedad visible", "produce toxinas en el alimento", "es inmune a todas las enfermedades"], 0, "El manipulador puede ser portador: elimina gérmenes estando sano."], ["¿Cuál es una vía de transmisión DIRECTA de gérmenes?", ["Hablar, toser o estornudar", "El polvo", "El agua", "Los utensilios mal lavados"], 0, "Vías directas: hablar/toser/estornudar. Indirectas: manos, polvo, agua, insectos, utensilios, cubos, etc."], ["Al lavarse las manos, el ACLARADO final se hace con…", ["agua fría, para cerrar los poros", "agua caliente, para abrir los poros", "jabón neutro sin enjuagar", "agua templada con lejía"], 0, "Lavado: agua caliente (abre poros) → enjabonar y frotar 15 s → aclarar con agua fría (cierra poros) → secar con toallas de papel."], ["Un manipulador con una HERIDA en la mano…", ["debe protegerla además con guantes de látex: no basta el vendaje", "solo necesita un vendaje limpio", "no corre ningún riesgo si no sangra", "puede seguir manipulando sin más si se la tapa con esparadrapo"], 0, "Heridas: fuente importantísima (sangre, pus, gérmenes). No basta el vendaje: proteger con guantes de látex."], ["¿Qué está prohibido en la higiene del manipulador?", ["Esmalte de uñas, anillos y relojes", "El pelo corto", "El uniforme de color claro", "Las uñas cortadas"], 0, "Uñas cortas y limpias, sin esmalte (puede caer al alimento). Sin anillos ni relojes (suciedad y riesgo de caerse)."], ["La ropa de trabajo del manipulador debe ser…", ["de color claro, exclusiva y que no se utilice en la calle", "de color oscuro para disimular las manchas", "la misma con la que entra y sale", "de un solo uso obligatorio"], 0, "Ropa exclusiva de trabajo, color claro (se ven manchas), siempre limpia, nunca a la calle."], ["¿Qué está prohibido hacer mientras se manipulan alimentos?", ["Fumar, comer y mascar chicle", "Hablar en voz baja", "Usar vitrinas para alimentos sensibles", "Lavarse las manos"], 0, "Prohibiciones: no fumar, no comer, no beber, no chicle (migas y saliva)."], ["La LIMPIEZA, dentro del sistema APPCC, consiste en…", ["eliminar la suciedad con agua y detergente", "destruir los gérmenes con productos específicos", "solo retirar el polvo visible", "desinfectar sin aclarar"], 0, "Limpieza = eliminar suciedad con agua y detergente. Desinfección = destruir gérmenes con productos específicos."], ["El primer paso de la limpieza y desinfección es…", ["el acondicionamiento en seco", "la desinfección directa", "el aclarado final", "el secado con paño"], 0, "Pasos: ① Acondicionamiento en seco ② Prelavado ③ Lavado con detergente ④ Aclarado ⑤ Desinfección ⑥ Aclarado final."], ["Una medida de DESRATIZACIÓN pasiva es…", ["eliminar puntos de atracción y cerrar huecos (rejillas, puertas con chapa)", "colocar raticidas por todo el local", "usar únicamente ultrasonidos", "dejar comida para que no roan los envases"], 0, "Desratización pasiva: eliminar puntos de atracción, sin grietas, desagües con sifones y rejillas, puertas hasta el suelo con chapa."], ["Un LÍMITE CRÍTICO en un PCC es…", ["un parámetro medible (temperatura, concentración…) que no debe superarse", "una opinión del responsable", "el tamaño máximo del almacén", "un registro firmado"], 0, "Límites críticos: parámetro medible. Fuera de límite = desviación = proceso fuera de control → producto peligroso."], ["La VERIFICACIÓN en el APPCC sirve para…", ["confirmar que el sistema funciona y reduce los peligros significativos", "anotar las temperaturas cada día", "sancionar los errores", "elaborar el diagrama de flujo"], 0, "Verificación: confirmar que el sistema APPCC funciona e identifica y reduce todos los peligros significativos."], ["Las inspecciones sanitarias se basan sobre todo en…", ["los registros y hojas de control firmados por el responsable", "la opinión de los clientes", "el número de empleados", "la marca de los productos"], 0, "Registro: documentos y hojas de control firmados. Las inspecciones se basan en la supervisión ✓ de esos registros."], ["La DESCONGELACIÓN correcta de los alimentos se realiza…", ["en la cámara de refrigeración, nunca a temperatura ambiente", "a temperatura ambiente toda la noche", "en el microondas siempre", "sumergiendo el alimento en agua caliente"], 0, "Descongelación: en la cámara de refrigeración, NUNCA a temperatura ambiente; sin goteos; no volver a congelar."], ["Al recalentar alimentos en una colectividad…", ["hay que asegurar tiempo y temperatura suficientes (cuidado con el microondas)", "basta con pasar 30 segundos por el microondas", "no hace falta control de temperatura", "se puede servir directamente frío"], 0, "Preparación y emplatado: separar crudos y cocinados, elaborar cerca del consumo, tiempo y temperatura suficientes; recalentar bien (ojo microondas)."], ["En el PCC 1 (PROVEEDORES), el límite crítico es…", ["que el proveedor esté autorizado, con plan de autocontrol y albarán", "que la mercancía llegue siempre antes de las 12 h", "que el precio sea el más barato", "que el vehículo tenga nevera"], 0, "PCC 1 Proveedores: límites = autorización + autocontrol + albarán; correctora: apercibimiento, rechazo, baja."]], "1": [["¿Qué definición se le da al camarero limpiador en el V Convenio Laboral?.", ["Es el trabajador que realiza todas o algunas de las funciones mecánicas", "Es el trabajador que realiza todas o algunas de las funciones mecánicas", "Es el que e de la confianza emisor-receptor."], ["¿Cómo se le denomina también a la reformulación?", ["Fenómeno repetitivo.", "Fenómeno Eco", "Fenómeno Reformulación."], 1, ""], ["La forma de asegurar nuestra comprensión del mensaje diciéndole al", ["Parafrasear", "Feed back", "Fenómeno repetitivo."], 0, ""], ["La acogida tiene cuatro partes ¿Cuáles son?", ["Recepción, saludo, oferta y despedida", "Recepción, oferta, contra oferta y acuerdo", "Recepción, saludo, presentación y ponernos a su disposición."], 2, ""], ["Una vez que se ha escuchado al cliente el segundo paso es:", ["Explicar", "Responder", "Despedirse."], 1, "Escucha activa: escuchar comprendiendo, no solo oyendo; atender al mensaje completo (verbal y no verbal)."], ["La descripción de cómo, cuándo o porqué ocurre algo es:", ["Explicación", "Convencer", "Persuasión no negociación."], 0, ""], ["¿Qué es convencer?", ["Es una descripción de cómo, cuándo o por qué ocurre algo.", "La acción verbal intencionada para influenciar la actitud o", "Es el proceso de alcanzar un mutuo acuerdo cuando existe una"], 1, ""], ["En una negociación normal hay:", ["Cinco etapas", "Cuatro etapas", "Tres etapas."], 0, ""], ["¿Cuáles son estas etapas?", ["Preparación, discusión, oferta/contra oferta, acuerdo/desacuerdo y", "Discutir, Acordar, Despedirse y Reencontrarse.", "Preparación, discusión, oferta/contra oferta, acuerdo/desacuerdo y si"], 2, ""], ["El tipo de comunicación que se da con el cuerpo se llama:", ["Comunicación verbal", "Comunicación no verbal", "Comunicación de cuerpo a cuerpo."], 1, ""], ["¿Qué transmitimos con el lenguaje verbal?", ["Información", "Negociar", "Sentimientos"], 0, ""], ["¿Qué transmitimos con el lenguaje no verbal?", ["Información", "Sentimientos", "Desinformación."], 1, ""], ["La persona que se deja mandar, que le digan, no expresa sus opiniones,", ["Asertiva", "Pasiva", "Empatica"], 1, ""], ["El comportamiento que se refleja por el movimiento continuo de las", ["Agresiva", "Pasiva", "Asertiva"], 0, ""   if(mode==='estudiar'){
    if(screen==='picker')el.innerHTML=pickerHTML();
    else if(screen==='study')el.innerHTML=studyHTML(theme(ckey));
    else el.innerHTML=pickerHTML();
  }else{
    if(screen==='picker')el.innerHTML=testPickerHTML();
    else if(screen==='pend')el.innerHTML=pendHTML();
    else if(screen==='test')el.innerHTML=testHTML();
  }
  paint();
}

function pickerHTML(){
  let b='<div class="pick-note">Elige el tema y pulsa encima para estudiar sus tarjetas.</div><div class="grid">';
  CURR.forEach(t=>{
    const n=countCards(t);
    b+=`<button class="th" data-act="open-study" data-key="${t.key}" style="border-left:6px solid ${t.hue}">
      <span><span class="th-num" style="color:${t.hue}">${t.num}</span><div class="th-name">${t.name}</div><div class="th-sub">${n} tarjetas ${t.sections&&t.sections.length>1?('· '+t.sections.length+' apartados'):''}</div></span>
      <span class="th-badge ok">📖</span></button>`;
  });
  return b+'</div>';
}
function testPickerHTML(){
  let b='<div class="pick-note">¿De qué tema quieres hacer el test?</div><div class="grid">';
  b+=`<button class="th" data-act="start-test" data-key="G" style="border-left:6px solid #ffd479">
    <span><span class="th-num" style="color:#ffd479">★</span><div class="th-name">Test General</div><div class="th-sub">30-35 preguntas al azar mezclando todos los temas</div></span>
    <span class="th-badge ok">${GEN.length} preguntas</span></button>`;
  CURR.forEach(t=>{
    const q=bankOf(t.key).length;
    const badge=q?`<span class="th-badge ok">${q} preguntas</span>`:`<span class="th-badge wait">sin test aún</span>`;
    b+=`<button class="th" data-act="${q?'start-test':'pending-test'}" data-key="${t.key}" style="border-left:6px solid ${t.hue}">
      <span><span class="th-num" style="color:${t.hue}">${t.num}</span><div class="th-name">${t.name}</div><div class="th-sub">${q?('30-35 preguntas al azar'):('los añado en cuanto me pases los tests')}</div></span>
      ${badge}</button>`;
  });
  return b+'</div>';
}
function pendHTML(){
  const t=theme(tkey);
  return `<div class="pend"><div class="e">📭</div><span><div style="font-weight:800;font-size:16px">${t.num} · ${t.name}</div></span>
    <p>Todavía no tengo el test de este tema.<br>Paséame los tests en PDF y los añado automáticamente con sus soluciones.</p>
    <button class="btn on" data-act="back-test">← Volver a elegir tema</button></div>`;
}
function studyHTML(t){
  if(!t)return'';
  const n=countCards(t);
  let s=`<div class="bar"><button class="btn" data-act="back-study">← Temas</button><span style="font-weight:800;margin-left:auto;color:${t.hue}">${t.num} · ${t.name}</span></div>
  <div class="bar">
    <button class="btn" id="bExam" data-act="toggle-exam">🎯 Modo examen</button>
    <button class="btn" data-act="open-all">Abrir todo</button>
    <button class="btn" data-act="clr">Limpiar marcas</button>
  </div>
  <input class="srch" id="srch" placeholder="Buscar en ${t.name}…">
  <div class="status" id="status"></div>`;
  s+=`<div id="seccs" style="margin-top:12px">`;
  let gidx=0;
  (t.sections||[]).forEach(sec=>{
    if(!sec.cards||!sec.cards.length)return;
    let cards='';sec.cards.forEach(c=>{
      const k=t.key+':'+gidx;
      cards+=`<section class="card" data-k="${k}" style="--c:${t.hue}">
        <button class="q"><span class="qt">${c.t}</span><span class="chev">▶</span></button>
        <div class="a">${c.p}</div>
        <div class="mark"><button class="btn-ok" data-act="mok">✔ Ya lo sé</button><button class="btn-rev" data-act="mrev">⟳ Repasar</button><button class="btn-x" data-act="mx">✕</button></div>
      </section>`;
      gidx++;
    });
    s+=`<section class="sec" style="--c:${t.hue}"><button class="sec-head"><span class="s-t">${esc(sec.t)}</span><span class="s-count">${sec.cards.length}</span><span class="chev">▾</span></button><div class="cards">${cards}</div></section>`;
  });
  s+='</div>';
  return s;
}
function testHTML(){
  const t=tinfo(tkey);
  return `<div class="bar"><button class="btn" data-act="back-test">← Cambiar de tema</button><span style="font-weight:800;margin-left:auto;color:${t.hue}">${t.num} · ${t.name}</span></div>
  <div class="t-head"><div class="t-prog" id="tProg"></div><div class="t-score" id="tScore"></div></div>
  <div class="t-card" id="tCard"><div class="t-q" id="tQ"></div><div class="t-opts" id="tOpts"></div><div class="t-expl" id="tExpl" hidden></div><button class="btn t-next" id="tNext" hidden>➜ Siguiente</button></div>
  <div class="t-end" id="tEnd" hidden><div class="t-result" id="tResult"></div><div class="t-fallos" id="tFallos"></div>
    <div class="bar"><button class="btn" data-act="wrong-only">⟳ Repetir fallos</button><button class="btn" data-act="again">🎯 Otra vez</button><button class="btn" data-act="back-test">← Cambiar tema</button></div></div>`;
}

function paint(){
  const t=screen==='study'?theme(ckey):null;
  if(screen==='study'&&t){
    document.querySelectorAll('.card').forEach(c=>{
      const st=(marks[t.key]||{})[c.dataset.k.split(':')[1]];
      if(st==='ok')c.classList.add('ok');
      if(st==='rev')c.classList.add('rev');
    });
    refreshStatus(t);
    // marcas listeners vía delegación
  }
  if(screen==='test')showQ();
}

// ---------- test runtime ----------
function startTest(key){
  tkey=key;QKEY=key;started=false;pos=0;aciertos=0;fallos=[];resp=[];wrongCache=[];
  const bank=bankOf(key);
  const idx=shuffle(bank.map((_,i)=>i)).slice(0,30+Math.floor(Math.random()*6));
  order=idx;started=true;
  screen='test';render();
}
function showQ(){
  const bank=bankOf(QKEY);
  const q=bank[order[pos]];
  if(!q){finish();return;}
  resp=shuffle(q[1].map((txt,i)=>({txt,i})));
  $('tQ').textContent='Pregunta '+(pos+1)+' de '+order.length+' — '+q[0];
  $('tOpts').innerHTML='';$('tExpl').hidden=true;$('tNext').hidden=true;
  resp.forEach((o,oi)=>{
    const b=document.createElement('button');b.className='t-opt';b.textContent=String.fromCharCode(97+oi)+') '+o.txt;
    b.dataset.oi=oi;b.addEventListener('click',()=>answer(oi,q));$('tOpts').appendChild(b);
  });
  $('tProg').textContent='Aciertos: '+aciertos+' · Fallos: '+fallos.length+' · '+QKEY;
  $('tScore').textContent='Mejor: '+(best[QKEY]||'—');
}
function answer(oi,q){
  const bank=bankOf(QKEY);
  const ok=resp[oi].i===q[2];
  document.querySelectorAll('.t-opt').forEach(b=>b.disabled=true);
  document.querySelectorAll('.t-opt').forEach(b=>{
    if(resp[+b.dataset.oi].i===q[2])b.classList.add('ok');
    if(+b.dataset.oi===oi&&!ok)b.classList.add('bad');
  });
  if(ok)aciertos++;else fallos.push(order[pos]);
  $('tExpl').innerHTML='<b>'+ (ok?'✔ ¡Correcto!':'✖ Incorrecto') +'</b> — '+(q[3]||'');
  $('tExpl').hidden=false;
  $('tProg').textContent='Aciertos: '+aciertos+' · Fallos: '+fallos.length+' · '+QKEY;
  if(ok){$('tNext').hidden=true;setTimeout(advance,900);}else{$('tNext').hidden=false;}
}
function advance(){pos++;if(pos<order.length)showQ();else finish();}
function finish(){
  $('tCard').hidden=true;$('tEnd').hidden=false;
  const pct=Math.round(aciertos/order.length*100);
  $('tResult').textContent='✔ '+aciertos+' de '+order.length+' ('+pct+' %) '+ (pct>=80?'🎉 ¡Buen nivel!':pct>=50?'💪 Vas bien, repasa los fallos.':'📚 Toca repasar.');
  if(!best[QKEY]||aciertos>best[QKEY]){best[QKEY]=aciertos;LS.s('cch_best',best);}
  wrongCache=fallos.slice();
  $('tFallos').innerHTML=(fallos.length?'<h3>Repasar estos '+fallos.length+' fallos</h3>':'')+fallos.map(i=>{
    const q=bankOf(QKEY)[i];return '<p>'+esc(q[0])+'<br>✔ '+esc(q[1][q[2]])+'</p>';}).join('');
}

// ---------- estudio runtime ----------
function refreshStatus(t){
  const m=marks[t.key]||{};
  const ok=Object.values(m).filter(x=>x==='ok').length;
  const re=Object.values(m).filter(x=>x==='rev').length;
  $('status').textContent='🎯 '+ok+' dominados · ⟳ '+re+' a repasar · '+countCards(t)+' tarjetas';
}
function setMark(card,st){
  const k=card.dataset.k.split(':');
  const key=k[0],idx=k[1];
  if(!marks[key])marks[key]={};
  if(st){marks[key][idx]=st;}else{delete marks[key][idx];}
  LS.s('cch',marks);
  card.classList.remove('ok','rev');
  if(st==='ok')card.classList.add('ok');
  if(st==='rev')card.classList.add('rev');
  card.classList.remove('open');
  refreshStatus(theme(key));
}

// ---------- navegación ----------
function goStudy(){mode='estudiar';screen='picker';render();}
function goTest(){mode='test';screen='picker';render();}

document.addEventListener('click',e=>{
  const bt=e.target.closest('[data-act]');
  if(bt){
    const a=bt.dataset.act, key=bt.dataset.key;
    if(a==='open-study'){ckey=key;screen='study';render();return;}
    if(a==='back-study'){goStudy();return;}
    if(a==='start-test'){startTest(key);return;}
    if(a==='pending-test'){tkey=key;screen='pend';render();return;}
    if(a==='back-test'){screen='picker';render();return;}
    if(a==='open-all'){document.querySelectorAll('.sec').forEach(s=>s.classList.add('open'));document.querySelectorAll('.card').forEach(c=>c.classList.add('open'));return;}
    if(a==='clr'){const t=theme(ckey);if(t){marks[t.key]={};LS.s('cch',marks);document.querySelectorAll('.card').forEach(c=>c.classList.remove('ok','rev','open'));refreshStatus(t);}return;}
    if(a==='toggle-exam'){const on=document.body.classList.toggle('exam');bt.classList.toggle('on',on);bt.textContent=on?'🎯 Ocultar respuestas':'🎯 Modo examen';return;}
    if(a==='mok'){setMark(bt.closest('.card'),'ok');return;}
    if(a==='mrev'){setMark(bt.closest('.card'),'rev');return;}
    if(a==='mx'){setMark(bt.closest('.card'),null);return;}
    if(a==='again'){startTest(QKEY);return;}
    if(a==='wrong-only'){pos=0;aciertos=0;fallos=[];resp=[];order=wrongCache.length?wrongCache.slice():shuffle(bankOf(QKEY).map((_,i)=>i)).slice(0,30+Math.floor(Math.random()*6));started=true;$('tEnd').hidden=true;$('tCard').hidden=false;showQ();return;}
    if(a==='next'){advance();return;}
  }
  // tarjetas / secciones
  const q=e.target.closest('.q');
  if(q)q.closest('.card').classList.toggle('open');
  const sh=e.target.closest('.sec-head');
  if(sh)sh.parentElement.classList.toggle('open');
  const nx=e.target.closest('#tNext');
  if(nx)advance();
});
$('tabE').addEventListener('click',goStudy);
$('tabT').addEventListener('click',goTest);
$('cEnter').addEventListener('click',()=>{const c=$('cover');c.classList.add('hide');setTimeout(()=>c.remove(),460);});
document.getElementById('content').addEventListener('input',e=>{
  const inp=e.target.closest('#srch');
  if(!inp)return;
  const dec=t=>t.normalize('NFD').replace(/[̀-ͯ]/g,'');
  const q=dec(inp.value.trim().toLowerCase());let total=0;
  const t=theme(ckey);
  document.querySelectorAll('#seccs .sec').forEach(sec=>{
    let vis=0;sec.querySelectorAll('.card').forEach(c=>{
      const m=!q||dec((c.querySelector('.qt').textContent+' '+(c.querySelector('.a').textContent||'')).toLowerCase()).includes(q);
      c.hidden=!m;if(m)vis++;});
    const n=sec.querySelectorAll('.card').length;
    const sc=sec.querySelector('.s-count');if(sc)sc.textContent=q?vis+'/'+n:vis;
    total+=vis;});
  if(q)document.querySelectorAll('#seccs .sec').forEach(s=>s.classList.add('open'));
  document.getElementById('status').textContent=t?'Resultados buscados: '+total:'';
});
render();
</script>
</body>
</html>
