<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Chuleta interactiva · Tema 8</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html{background:#12141a}
  body{font-family:system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;color:#e8eaf0;max-width:560px;margin:0 auto;padding:0 12px calc(90px + env(safe-area-inset-bottom))}
  header{position:sticky;top:0;z-index:5;background:linear-gradient(180deg,#12141a 90%,#12141a00);padding:calc(10px + env(safe-area-inset-top)) 0 12px}
  h1{font-size:17px;color:#ffd479}
  h1 small{display:block;font-size:11px;color:#8b93a7;font-weight:400}
  .tabs{display:flex;gap:8px;margin-top:10px}
  .tab{flex:1;border:none;border-radius:12px;padding:11px;font-size:14px;font-weight:800;cursor:pointer;background:#232838;color:#9aa3b8}
  .tab.on{background:#ffd479;color:#201400}
  .bar{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap}
  .btn{border:none;border-radius:999px;padding:9px 14px;font-size:13px;font-weight:700;cursor:pointer;background:#232838;color:#dfe4ee}
  .btn.on{background:#ffd479;color:#201400}
  .btn.okbtn{background:#2e9e55}
  .srch{flex:1 1 100%;margin-top:6px;background:#1b2029;color:#e8eaf0;border:1px solid #31394a;border-radius:12px;padding:10px 12px;font-size:14px;outline:none}
  .status{font-size:12px;color:#ffd479;margin-top:6px}
  .sec{margin-bottom:14px;border:1px solid #2a3142;border-radius:16px;overflow:hidden;background:#191e28}
  .sec-head{width:100%;display:flex;align-items:center;gap:10px;padding:14px;background:linear-gradient(90deg,var(--c),color-mix(in srgb,var(--c) 55%,#191e28));border:none;color:#fff;font-size:14px;font-weight:800;letter-spacing:.4px;cursor:pointer}
  .s-count{margin-left:auto;background:rgba(255,255,255,.22);border-radius:999px;padding:2px 10px;font-size:12px}
  .sec .chev{transition:transform .18s}
  .sec.open .chev{transform:rotate(180deg)}
  .cards{display:none}
  .sec.open .cards{display:block}
  .card{background:#1f2532;border-left:5px solid var(--c);border-radius:12px;margin:8px;overflow:hidden}
  .card.ok{background:#123521;border-left-color:#3ecf6f}
  .card.rev{background:#36270f;border-left-color:#ffb428}
  .q{width:100%;display:flex;align-items:center;gap:8px;padding:11px 10px;background:none;border:none;color:#e8eaf0;text-align:left;cursor:pointer}
  .qt{font-size:13.5px;font-weight:700;flex:1}
  .q .chev{font-size:10px;color:var(--c)}
  .a{display:none;padding:2px 12px 10px}
  .card.open .a{display:block}
  .a p{font-size:13.5px;line-height:1.5;margin:8px 0;padding-left:10px;border-left:2px solid color-mix(in srgb,var(--c) 45%,#ffffff00)}
  .a b,.bw{color:#ffd479;font-weight:700}
  .a em,.a i{font-style:italic;color:#b9c2d6}
  .r{color:#ff7b7b;font-weight:700}
  .v{color:#7ce08f;font-weight:700}
  .h{background:#ffd479;color:#201400;border-radius:4px;padding:0 3px;font-weight:700}
  .mark{display:none;gap:8px;padding:0 10px 10px}
  .card.open .mark{display:flex}
  .mark button{flex:1;border:none;border-radius:9px;padding:9px;font-size:12.5px;font-weight:700;cursor:pointer}
  .btn-ok{background:#2e9e55;color:#fff}
  .btn-rev{background:#e0912a;color:#fff}
  .btn-x{flex:0 0 auto!important;background:#3a4254;color:#aeb6c6}
  .card.ok .btn-ok,.card.rev .btn-rev{outline:2px solid #fff}
  body.exam .a{display:none!important}
  body.exam .card.open .a{display:block}
  .t-head{display:flex;justify-content:space-between;align-items:center;margin:6px 2px 10px;font-size:13px;color:#ffd479}
  .t-card{background:#1f2532;border:1px solid #31394a;border-radius:16px;padding:16px}
  .t-q{font-size:16px;font-weight:800;line-height:1.35;margin-bottom:14px}
  .t-opt{display:block;width:100%;text-align:left;background:#262d3d;border:2px solid #31394a;border-radius:12px;padding:12px;margin-bottom:9px;font-size:14px;color:#e8eaf0;cursor:pointer}
  .t-opt.ok{background:#16432a;border-color:#3ecf6f}
  .t-opt.bad{background:#4a1d1d;border-color:#ff6b6b}
  .t-opt:disabled{opacity:1;cursor:default}
  .t-expl{margin-top:12px;background:#232a39;border-left:4px solid #ffd479;border-radius:8px;padding:10px 12px;font-size:13px;line-height:1.45}
  .t-expl b{color:#ffd479}
  .t-next{width:100%;margin-top:12px;background:#ffd479;color:#201400}
  .t-end{background:#1f2532;border:1px solid #31394a;border-radius:16px;padding:18px}
  .t-result{font-size:20px;font-weight:800;text-align:center;margin-bottom:12px}
  .t-fallos h3{font-size:13px;color:#ff7b7b;margin:12px 0 6px}
  .t-fallos p{font-size:12.5px;background:#262d3d;border-radius:8px;padding:8px 10px;margin-bottom:6px}
  .t-fallos p b{color:#7ce08f}
  footer{position:fixed;bottom:0;left:0;right:0;text-align:center;padding:10px env(safe-area-inset-bottom) 0;background:#12141aE6;backdrop-filter:blur(6px)}
  footer small{font-size:10px;color:#6c768c}
</style>
</head>
<body>
<header>
  <h1>Chuleta interactiva · Tema 8<small>Manipulación de alimentos · estudia y entrena en modo test</small></h1>
  <div class="tabs">
    <button class="tab on" id="tEstudiar">📖 Estudiar</button>
    <button class="tab" id="tTest">📝 Test («como el examen»)</button>
  </div>
  <div id="panelEstudiar">
    <div class="bar">
      <button class="btn" id="bExam">🎯 Modo examen</button>
      <button class="btn" id="bAll">Abrir todo</button>
      <button class="btn" id="bClr">Limpiar marcas</button>
    </div>
    <input class="srch" id="srch" placeholder="Buscar: salmonela, temperatura, APPCC…">
    <div class="status" id="status"></div>
  </div>
</header>
</header>
<section id="panelTest" hidden>
  <div class="t-head">
    <div class="t-prog" id="tProg"></div>
    <div class="t-score" id="tScore"></div>
  </div>
  <div class="t-card" id="tCard">
    <div class="t-q" id="tQ"></div>
    <div class="t-opts" id="tOpts"></div>
    <div class="t-expl" id="tExpl" hidden></div>
    <button class="btn t-next" id="tNext" hidden>➜ Siguiente</button>
  </div>
  <div class="t-end" id="tEnd" hidden>
    <div class="t-result" id="tResult"></div>
    <div class="t-fallos" id="tFallos"></div>
    <div class="bar">
      <button class="btn" id="tAgain">🎯 Otra vez (todas)</button>
      <button class="btn" id="tWrong">⟳ Repetir fallos</button>
    </div>
  </div>
</section>

<script>
const cards=[...document.querySelectorAll('.card')];
const seccs=[...document.querySelectorAll('.sec')];
const LS=((()=>{try{return {get:()=>JSON.parse(localStorage.getItem('ch8m')||'{}'),set:v=>localStorage.setItem('ch8m',JSON.stringify(v))}}catch(e){return {get:()=>({}),set:()=>{}}}})());
let marks=LS.get();
function refreshStatus(){const vals=Object.values(marks);const ok=vals.filter(m=>m==='ok').length;const re=vals.filter(m=>m==='rev').length;document.getElementById('status').textContent='🎯 '+ok+' dominados · ⟳ '+re+' a repasar · '+cards.length+' total'}
cards.forEach((c,i)=>{{const v=marks[i];if(v==='ok')c.classList.add('ok');if(v==='rev')c.classList.add('rev');}});
const quiz=[["Un alimento ALTERADO es aquel que…", ["ha sufrido deterioro de su valor nutritivo u organoléptico por causas naturales o mala manipulación", "contiene microorganismos peligrosos o toxinas", "ha recibido radiaciones ionizantes", "se ha descongelado y vuelto a congelar"], 0, "Alterado: deterioro del valor nutritivo y organoléptico (olor, color, sabor) → apto para el consumo. Contaminado es el que contiene gérmenes o toxinas."], ["A diferencia del alimento alterado, el contaminado…", ["no se detecta a simple vista y es más peligroso", "se detecta por su olor o color", "siempre se detecta por los sentidos", "pierde vitaminas por el frío"], 0, "Contaminado: contiene microorganismos peligrosos o toxinas. NO se detecta a simple vista → más peligroso."], ["Los microorganismos son…", ["seres vivos unicelulares visibles solo con microscopio", "seres pluricelulares visibles a simple vista", "siempre perjudiciales para los alimentos", "células que solo existen en el agua"], 0, "Seres vivos unicelulares visibles solo con microscopio. Tipos: virus, bacterias, protozoos, hongos (levaduras unicelulares, mohos pluricelulares)."], ["Solo carece de microorganismos…", ["el material estéril", "el alimento refrigerado", "la fruta lavada", "el agua hervida durante 5 minutos"], 0, "Sin microorganismos solo el material estéril."], ["Los microorganismos que enferman al consumidor antes de apreciarse cualquier alteración son…", ["los patógenos", "los beneficiosos", "los comensales o no patógenos", "las levaduras"], 0, "Patógenos: enferman antes de la alteración visible. Beneficiosos: necesarios (yogur → Lactobacillus)."], ["En la TOXIINFECCIÓN alimentaria el microorganismo…", ["se ingiere con el alimento y se multiplica dentro del cuerpo", "crece en el alimento antes de consumirlo y libera toxinas", "se destruye a 60 ºC", "procede siempre de las conservas"], 0, "Toxiinfección: el microorganismo está en el alimento, se ingiere y se multiplica dentro del cuerpo."], ["En la INTOXICACIÓN alimentaria el microorganismo…", ["crece en el alimento antes de consumirlo y libera toxinas", "se multiplica dentro del cuerpo", "no produce toxinas", "se elimina con el frío"], 0, "Intoxicación: el microorganismo crece en el alimento antes de consumirlo y libera toxinas."], ["La temperatura óptima para el crecimiento bacteriano es de aprox…", ["37 ºC", "4 ºC", "100 ºC", "0 ºC"], 0, "Temperatura: óptimo ≈ 37 ºC; el frío retrasa o paraliza y el calor elimina."], ["¿Cuál de estos alimentos soporta pocos gérmenes por falta de agua?", ["Legumbres secas, aceite y leche en polvo", "Leche fresca", "Carne picada", "Tortilla de patatas recién hecha"], 0, "Humedad: más agua = más gérmenes. Secas: legumbres, aceite, leche en polvo, bacalao salado."], ["Los MOHOS proliferan especialmente con…", ["un pH ácido de 3–4 (tomate, cítricos)", "un pH neutro de 7", "un pH fuertemente alcalino", "la ausencia total de nutrientes"], 0, "pH: los mohos crecen con pH 3–4 (tomate, cítricos); las bacterias en neutro (leche, carne, pescado)."], ["Las bacterias necesitan sobre todo…", ["proteínas (carne, huevos, leche)", "azúcares (frutas, pasteles)", "grasas saturadas", "agua destilada"], 0, "Nutrientes: bacterias → proteínas (carne, huevos, leche); hongos → azúcares (frutas, pasteles)."], ["Las aflatoxinas o micotoxinas…", ["proceden de mohos y son cancerígenas (cereales, cacao, frutos secos)", "aparecen en ahumados por las altas temperaturas", "son la única causa de botulismo", "desaparecen con la refrigeración"], 0, "Aflatoxinas: mohos; cereales, cacao, frutos secos; cancerígenas. Dioxinas: ahumados y altas temperaturas. Nitrosaminas: embutidos con nitritos."], ["La refrigeración de los alimentos se realiza entre…", ["2 y 8 ºC", "0 y 2 ºC bajo cero", "−18 ºC", "60 y 90 ºC"], 0, "Refrigeración 2–8 ºC · Congelación ≤ −18 ºC (rápida)."], ["Durante la CONGELACIÓN, a partir de qué temperatura se paraliza el crecimiento de los gérmenes?", ["−10 ºC", "0 ºC", "2 ºC", "−70 ºC"], 0, "Congelación ≤ −18 ºC; a −10 ºC se paraliza todo. Las grasas pueden enranciarse; no recongelar lo descongelado."], ["¿Qué NO debe hacerse nunca con un alimento descongelado?", ["Volver a congelarlo", "Cocinarlo el mismo día", "Consumirlo en 24 horas", "Refrigerarlo hasta su uso"], 0, "…no recongelar descongelado."], ["La LIOFILIZACIÓN consiste en…", ["congelación rápida y sublimación a baja presión", "secado al sol", "adición de azúcar concentrado", "fermentación controlada"], 0, "Liofilización: congelación rápida + sublimación a baja presión (verduras, carnes)."], ["El SECADO como método de conservación es típico de…", ["aromáticas y especias", "carnes frescas", "cámaras frigoríficas", "productos enlatados"], 0, "Eliminando agua: secado (aromáticas, especias) · concentración (zumos) · liofilización."], ["La SALAZÓN conserva porque…", ["retira el agua del alimento", "añade conservantes artificiales", "baja el pH a 3", "elimina las proteínas"], 0, "Salazón: retira agua. Aditivos: vinagre (pH bajo), azúcar, sal, ahumado, conservantes autorizados."], ["El BOTULISMO se asocia sobre todo a…", ["conservas caseras, embutidos y envasados sin oxígeno", "huevos crudos en mayonesas y salsas", "leche cruda y quesos frescos caseros", "verduras crudas mal lavadas"], 0, "Botulismo: Clostridium botulinum; sin O₂ → toxina (el veneno natural más potente, termolábil). Conservas caseras peligrosas, embutidos, envasados sin O₂."], ["La SALMONELOSIS se contrae principalmente por…", ["huevos y huevo crudo (mayonesas, cremas, salsas)", "conservas caseras", "quesos frescos de leche cruda", "agua de pozo sin desinfectar"], 0, "Salmonella: huevos y huevo crudo (mayonesas, cremas, salsas), carnes poco hechas; incubación 12–36 h."], ["La toxiinfección por CAMPYLOBACTER…", ["es más frecuente y grave que la salmonelosis y deja portador sano", "es menos grave que la salmonelosis", "solo aparece en conservas", "se previene con el ahumado"], 0, "Campylobacter: huevos y carne contaminados por heces; más frecuente y grave que la salmonelosis; deja portador sano."], ["La toxina de la INTOXICACIÓN ESTAFILOCÓCICA…", ["es resistente al calor (la cocción no la destruye)", "desaparece a 60 ºC", "se elimina con el frío", "la produce el botulismo"], 0, "Staph. aureus (piel, fosas nasales, heridas, granos) → llega por manos, tos, estornudos. Toxina termorresistente. Salsas, natas, cremas pasteleras."], ["La presencia de E. COLI en un alimento indica…", ["contaminación fecal", "conservación correcta", "presencia de mohos", "exceso de sal"], 0, "E. coli: en el intestino de animales y hombre → su presencia = contaminación fecal. Prevención: lavarse las manos, esp. tras el servicio."], ["La HIDATIDOSIS se transmite por…", ["huevos de un gusano del perro en verduras crudas mal lavadas o aguas contaminadas", "carne de cerdo poco hecha", "leche sin hervir", "alimentos enlatados"], 0, "Hidatidosis: gusano plano en el intestino del perro; huevos en heces → quiste hidatídico. Verduras crudas mal lavadas, manos, agua contaminada."], ["La BRUCELOSIS (fiebre de Malta) se adquiere por…", ["leche cruda y quesos frescos caseros", "carne de jabalí", "conservas caseras", "mosquitos e insectos"], 0, "Brucelosis: Brucella por leche cruda y quesos frescos caseros. Tras curación larga los quesos no transmiten."], ["La TRIQUINELOSIS procede de…", ["la musculatura de cerdo, jabalí o caballo (matanzas domiciliarias)", "el huevo crudo", "las setas tóxicas", "el agua de red pública"], 0, "Triquinelosis: parásito en musculatura de cerdo, jabalí, caballo; matanzas domiciliarias (análisis)."], ["La TUBERCULOSIS alimentaria se asocia a…", ["leche cruda y productos derivados no tratados", "conservas de pescado", "verduras congeladas", "harinas refinadas"], 0, "Tuberculosis: leche cruda o productos derivados no tratados."], ["¿Cuál de estas enfermedades NO suele transmitirse por la LECHE?", ["Botulismo", "Tuberculosis", "Brucelosis", "Salmonelosis"], 0, "Leche: TBC, brucelosis, salmonelosis, hep. A, estafilococia, enterovirosis. El botulismo se asocia a conservas sin O₂."], ["Las superficies de trabajo deben ser…", ["lisas, impermeables, lavables y de materiales no tóxicos (no madera)", "de madera para evitar deslizamientos", "porosas para absorber la humedad", "rugosas para facilitar el barrido"], 0, "Superficies: lisas, impermeables, fácilmente lavables (aluminio, acero inoxidable). NO madera (acumula suciedad y gérmenes)."], ["El agua de un POZO para uso en alimentación exige…", ["analítica inicial y equipo de desinfección (con nº de registro sanitario)", "solo hervirla en verano", "un certificado del Ayuntamiento como el agua de red", "filtros de carbón en cada grifo"], 0, "Red pública → certificado del Ayuntamiento. Pozo → analítica inicial + equipo de desinfección (nº de registro sanitario)."], ["En la RECEPCIÓN de alimentos, si el vehículo de transporte no cumple las condiciones…", ["se rechaza la mercancía", "se acepta pero se anota", "se descarga y se sirve igualmente", "se abona a mitad de precio"], 0, "Recepción: vehículos exclusivos, lisos, impermeables, limpios y desinfectados; rechazo si no se cumplen las condiciones o hay transporte inadecuado."], ["Los alimentos deben almacenarse…", ["sin contacto entre sí ni con el suelo", "siempre en contacto con la pared para ahorrar espacio", "en locales sin control de temperatura", "apilados lo máximo posible"], 0, "Almacenamiento: locales a temperatura y humedad adecuadas; sin contacto entre alimentos ni con el suelo; atención a incompatibilidades."], ["Los contenedores de RESIDUOS deben…", ["tener tapa permanente y retirarse al final de la jornada", "abrirse cuando sea necesario", "lavarse una vez al mes", "guardarse junto a los alimentos"], 0, "Residuos: contenedores con tapa permanente, retirados al finalizar la jornada, limpios y desinfectados; local específico sin insectos ni roedores."], ["Un manipulador 'portador sano'…", ["elimina gérmenes sin presentar síntomas", "padece una enfermedad visible", "produce toxinas en el alimento", "es inmune a todas las enfermedades"], 0, "El manipulador puede ser portador: elimina gérmenes estando sano."], ["¿Cuál es una vía de transmisión DIRECTA de gérmenes?", ["Hablar, toser o estornudar", "El polvo", "El agua", "Los utensilios mal lavados"], 0, "Vías directas: hablar/toser/estornudar. Indirectas: manos, polvo, agua, insectos, utensilios, cubos, etc."], ["Al lavarse las manos, el ACLARADO final se hace con…", ["agua fría, para cerrar los poros", "agua caliente, para abrir los poros", "jabón neutro sin enjuagar", "agua templada con lejía"], 0, "Lavado: agua caliente (abre poros) → enjabonar y frotar 15 s → aclarar con agua fría (cierra poros) → secar con toallas de papel."], ["Un manipulador con una HERIDA en la mano…", ["debe protegerla además con guantes de látex: no basta el vendaje", "solo necesita un vendaje limpio", "no corre ningún riesgo si no sangra", "puede seguir manipulando sin más si se la tapa con esparadrapo"], 0, "Heridas: fuente importantísima (sangre, pus, gérmenes). No basta el vendaje: proteger con guantes de látex."], ["¿Qué está prohibido en la higiene del manipulador?", ["Esmalte de uñas, anillos y relojes", "El pelo corto", "El uniforme de color claro", "Las uñas cortadas"], 0, "Uñas cortas y limpias, sin esmalte (puede caer al alimento). Sin anillos ni relojes (suciedad y riesgo de caerse)."], ["La ropa de trabajo del manipulador debe ser…", ["de color claro, exclusiva y que no se utilice en la calle", "de color oscuro para disimular las manchas", "la misma con la que entra y sale", "de un solo uso obligatorio"], 0, "Ropa exclusiva de trabajo, color claro (se ven manchas), siempre limpia, nunca a la calle."], ["¿Qué está prohibido hacer mientras se manipulan alimentos?", ["Fumar, comer y mascar chicle", "Hablar en voz baja", "Usar vitrinas para alimentos sensibles", "Lavarse las manos"], 0, "Prohibiciones: no fumar, no comer, no beber, no chicle (migas y saliva)."], ["Las siglas APPCC significan…", ["Análisis de Peligros y Puntos de Control Crítico", "Análisis de Plagas y Control de Calidad", "Aplicación de Programas de Conservación Correcta", "Alternativa y Prevención de la Contaminación Científica"], 0, "APPCC = Análisis de Peligros y Puntos de Control Crítico. Identifica, evalúa y previene peligros físicos, químicos y biológicos."], ["La LIMPIEZA, dentro del sistema APPCC, consiste en…", ["eliminar la suciedad con agua y detergente", "destruir los gérmenes con productos específicos", "solo retirar el polvo visible", "desinfectar sin aclarar"], 0, "Limpieza = eliminar suciedad con agua y detergente. Desinfección = destruir gérmenes con productos específicos."], ["El primer paso de la limpieza y desinfección es…", ["el acondicionamiento en seco", "la desinfección directa", "el aclarado final", "el secado con paño"], 0, "Pasos: ① Acondicionamiento en seco ② Prelavado ③ Lavado con detergente ④ Aclarado ⑤ Desinfección ⑥ Aclarado final."], ["Una medida de DESRATIZACIÓN pasiva es…", ["eliminar puntos de atracción y cerrar huecos (rejillas, puertas con chapa)", "colocar raticidas por todo el local", "usar únicamente ultrasonidos", "dejar comida para que no roan los envases"], 0, "Desratización pasiva: eliminar puntos de atracción, sin grietas, desagües con sifones y rejillas, puertas hasta el suelo con chapa."], ["Un LÍMITE CRÍTICO en un PCC es…", ["un parámetro medible (temperatura, concentración…) que no debe superarse", "una opinión del responsable", "el tamaño máximo del almacén", "un registro firmado"], 0, "Límites críticos: parámetro medible. Fuera de límite = desviación = proceso fuera de control → producto peligroso."], ["La VERIFICACIÓN en el APPCC sirve para…", ["confirmar que el sistema funciona y reduce los peligros significativos", "anotar las temperaturas cada día", "sancionar los errores", "elaborar el diagrama de flujo"], 0, "Verificación: confirmar que el sistema APPCC funciona e identifica y reduce todos los peligros significativos."], ["Las inspecciones sanitarias se basan sobre todo en…", ["los registros y hojas de control firmados por el responsable", "la opinión de los clientes", "el número de empleados", "la marca de los productos"], 0, "Registro: documentos y hojas de control firmados. Las inspecciones se basan en la supervisión ✓ de esos registros."], ["La DESCONGELACIÓN correcta de los alimentos se realiza…", ["en la cámara de refrigeración, nunca a temperatura ambiente", "a temperatura ambiente toda la noche", "en el microondas siempre", "sumergiendo el alimento en agua caliente"], 0, "Descongelación: en la cámara de refrigeración, NUNCA a temperatura ambiente; sin goteos; no volver a congelar."], ["Al recalentar alimentos en una colectividad…", ["hay que asegurar tiempo y temperatura suficientes (cuidado con el microondas)", "basta con pasar 30 segundos por el microondas", "no hace falta control de temperatura", "se puede servir directamente frío"], 0, "Preparación y emplatado: separar crudos y cocinados, elaborar cerca del consumo, tiempo y temperatura suficientes; recalentar bien (ojo microondas)."], ["En el PCC 1 (PROVEEDORES), el límite crítico es…", ["que el proveedor esté autorizado, con plan de autocontrol y albarán", "que la mercancía llegue siempre antes de las 12 h", "que el precio sea el más barato", "que el vehículo tenga nevera"], 0, "PCC 1 Proveedores: límites = autorización + autocontrol + albarán; correctora: apercibimiento, rechazo, baja."]];
const $=id=>document.getElementById(id);
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
let order=[],pos=0,aciertos=0,fallos=[],resp=[];
function startTest(onlyWrong){pos=0;aciertos=0;fallos=[];resp=[];
  let idx=quiz.map((_,i)=>i);
  if(onlyWrong&&wrongCache.length)idx=wrongCache.slice();
  order=shuffle(idx);
  $('tEnd').hidden=true;$('tCard').hidden=false;
  showQ();}
function showQ(){const q=quiz[order[pos]];resp=shuffle(q[1].map((t,i)=>({t,i})));
  $('tQ').textContent='Pregunta '+(pos+1)+' de '+order.length+' — '+q[0];
  $('tOpts').innerHTML='';$('tExpl').hidden=true;$('tNext').hidden=true;
  resp.forEach((o,oi)=>{const b=document.createElement('button');b.className='t-opt';b.textContent=String.fromCharCode(97+oi)+') '+o.t;
    b.addEventListener('click',()=>answer(oi,q));$('tOpts').appendChild(b);});
  $('tProg').textContent='Aciertos: '+aciertos+' · Fallos: '+fallos.length;
  $('tScore').textContent='Mejor: '+localStorage.getItem('ch8best')||'—';}
function answer(oi,q){const ok=resp[oi].i===q[2];document.querySelectorAll('.t-opt').forEach(b=>b.disabled=true);
  document.querySelectorAll('.t-opt').forEach((b,i)=>{if(resp[i].i===q[2])b.classList.add('ok');if(i===oi&&!ok)b.classList.add('bad');});
  if(ok)aciertos++;else fallos.push(order[pos]);
  $('tExpl').innerHTML='<b>'+ (ok?'✔ ¡Correcto!':'✖ Incorrecto') +'</b> — '+q[3];$('tExpl').hidden=false;
  $('tProg').textContent='Aciertos: '+aciertos+' · Fallos: '+fallos.length;
  if(ok){$('tNext').hidden=true;setTimeout(advance,900);}else{$('tNext').hidden=false;}}
function advance(){pos++;if(pos<order.length)showQ();else finish();}
let wrongCache=[];
function finish(){$('tCard').hidden=true;$('tEnd').hidden=false;
  const pct=Math.round(aciertos/order.length*100);
  $('tResult').textContent='✔ '+aciertos+' de '+order.length+' ('+pct+' %) '+ (pct>=80?'🎉 ¡Buen nivel!':pct>=50?'💪 Vas bien, repasa los fallos.':'📚 Toca repasar.');
  const best=+(localStorage.getItem('ch8best')||0);if(aciertos>best)localStorage.setItem('ch8best',aciertos);
  wrongCache=fallos.slice();
  $('tFallos').innerHTML=(fallos.length?'<h3>Repasar estos '+fallos.length+' fallos</h3>':'')+fallos.map(i=>{const q=quiz[i];return '<p><b>'+String.fromCharCode(65+(i%26))+'</b> '+q[0].replace(/<[^>]+>/g,'')+'<br>✔ '+q[1][q[2]]+'</p>';}).join('');
}
$('tTest').addEventListener('click',()=>{$('tTest').classList.add('on');$('tEstudiar').classList.remove('on');$('panelEstudiar').hidden=true;$('panelTest').hidden=false;if(order.length===0)startTest(false);});
$('tEstudiar').addEventListener('click',()=>{$('tEstudiar').classList.add('on');$('tTest').classList.remove('on');$('panelTest').hidden=true;$('panelEstudiar').hidden=false;});
$('tAgain').addEventListener('click',()=>startTest(false));
$('tWrong').addEventListener('click',()=>{if(wrongCache.length)startTest(true);else startTest(false);});
$('tNext').addEventListener('click',advance);
document.body.addEventListener('click',e=>{
  const q=e.target.closest('.q');
  if(q){const c=q.closest('.card');c.classList.toggle('open');}
  const okb=e.target.closest('.btn-ok');
  if(okb){const c=okb.closest('.card');marks[c.dataset.i]='ok';c.classList.remove('rev');c.classList.add('ok');LS.set(marks);refreshStatus();c.classList.remove('open');}
  const rb=e.target.closest('.btn-rev');
  if(rb){const c=rb.closest('.card');marks[c.dataset.i]='rev';c.classList.remove('ok');c.classList.add('rev');LS.set(marks);refreshStatus();c.classList.remove('open');}
  const xb=e.target.closest('.btn-x');
  if(xb){const c=xb.closest('.card');delete marks[c.dataset.i];c.classList.remove('ok','rev');LS.set(marks);refreshStatus();c.classList.remove('open');}
  const sh=e.target.closest('.sec-head');
  if(sh)sh.parentElement.classList.toggle('open');
});
document.getElementById('bExam').addEventListener('click',e=>{document.body.classList.toggle('exam');e.target.classList.toggle('on');});
document.getElementById('bAll').addEventListener('click',()=>{document.querySelectorAll('.card').forEach(c=>c.classList.add('open'));});
document.getElementById('bClr').addEventListener('click',()=>{marks={};LS.set(marks);cards.forEach(c=>{c.classList.remove('ok','rev','open')});refreshStatus();});
document.getElementById('srch').addEventListener('input',e=>{
  const q=e.target.value.trim().toLowerCase();let total=0;
  seccs.forEach(sec=>{let vis=0;sec.querySelectorAll('.card').forEach(c=>{const m=!q||(c.textContent||'').toLowerCase().includes(q);c.hidden=!m;if(m)vis++;});
    const n=sec.querySelectorAll('.card').length;sec.querySelector('.s-count').textContent=q?vis+'/'+n:vis;total+=vis;});
  document.getElementById('status').textContent='Resultados: '+total;
});
refreshStatus();
</script>
